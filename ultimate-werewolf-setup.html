  <style>

    .role-name { font-weight: bold; min-width: 120px; }
    .role-desc { flex: 1; font-size: 12px; }
    .tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-right: 6px; font-weight: bold; }
    .tag-evil { background: #fdecea; color: #c0392b; }
    .tag-village { background: #eafaf1; color: #27ae60; }
    .tag-neutral { background: #f5eef8; color: #8e44ad; }
    .summary { display: flex; gap: 12px; justify-content: center; font-size: 12px; flex-wrap: wrap; margin: 12px 0; }
    .night-order { background: #fff9e6; border: 1px solid #f39c12; border-radius: 6px; padding: 12px; margin: 12px 0; }
    .night-step { display: flex; gap: 10px; padding: 8px; border-left: 3px solid #f39c12; margin-bottom: 6px; font-size: 11px; }
    .share-box { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin: 12px 0; display: none; }
    .share-link { background: #fff; border: 1px solid #ddd; padding: 8px; font-family: monospace; font-size: 11px; word-break: break-all; margin-bottom: 8px; }
    .player-name-input { font-size: 16px; padding: 10px; border: 2px solid #ddd; border-radius: 4px; width: 100%; max-width: 300px; margin-bottom: 12px; }
    .players-list { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin: 12px 0; }
    .player-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #e0e0e0; }
    .role-display { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 40px; margin: 20px 0; text-align: center; }
    .role-name-big { font-size: 28px; font-weight: bold; margin: 20px 0; }
    .role-desc-big { font-size: 12px; margin: 20px 0; background: #f9f9f9; padding: 15px; border-radius: 4px; }
    .warning { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 8px 12px; margin: 8px 0; color: #856404; font-size: 12px; }
    .role-emoji { font-size: 80px; margin: 20px 0; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .role-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 12px; padding: 40px; margin: 20px 0; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: slideUp 0.6s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .role-card-evil { background: linear-gradient(135deg, #8b0000 0%, #ff6b6b 100%); }
    .role-card-village { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); }
    .role-card-neutral { background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%); }
    .role-card h2 { font-size: 32px; margin: 15px 0; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .role-card .team-badge { display: inline-block; font-size: 12px; padding: 8px 16px; background: rgba(255,255,255,0.3); border-radius: 20px; margin: 10px 0; font-weight: bold; }
    .role-card .description { font-size: 14px; margin: 20px 0; line-height: 1.6; font-style: italic; }
    .role-row { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid #e0e0e0; align-items: center; }
    .role-row-emoji { font-size: 28px; min-width: 40px; text-align: center; }
    .player-item { display: flex; justify-content: space-between; padding: 14px; border-bottom: 1px solid #e0e0e0; align-items: center; }
    .player-item-emoji { font-size: 24px; margin-right: 12px; }
  </style>
</head>
<body>
  <h1>🐺 Ultimate Werewolf</h1>
  <p class="subtitle">Digital Setup - Balanced & Exciting</p>

  <div class="tabs">
    <button class="tab-btn active" id="modBtn">📋 Moderator</button>
    <button class="tab-btn" id="playerBtn">👤 Join</button>
  </div>

  <div id="modTab" class="tab-content active">
    <p style="text-align:center;color:#666;margin-bottom:16px;">Select players to generate balanced setup</p>
    <div class="btn-row" id="btnRow"></div>
    <div id="result"></div>
  </div>

  <div id="playerTab" class="tab-content">
    <p style="text-align:center;color:#666;margin-bottom:16px;">Enter name to receive role</p>
    <div id="playerView"></div>
  </div>

  <script>
var ROLES = {werewolf:{n:"Werewolf",t:"evil",w:-9,no:1,d:"Point to eliminate at night. Wins with evil.",e:"🐺"},alphawolf:{n:"Alpha Wolf",t:"evil",w:-9,no:2,d:"Once per game, convert village to werewolf.",e:"👑🐺"},wolfcub:{n:"Wolf Cub",t:"evil",w:-8,no:1,d:"If killed, werewolves get double kill next night.",e:"🐶"},minion:{n:"Minion",t:"evil",w:-6,no:3,d:"Knows werewolves. Wins with evil.",e:"🤝"},sorceress:{n:"Sorceress",t:"evil",w:-3,no:4,d:"Each night, learn if target is Seer.",e:"🔮"},lycan:{n:"Lycan",t:"evil",w:-1,no:99,d:"Appears as werewolf to Seer. Secretly evil.",e:"🌙"},seer:{n:"Seer",t:"village",w:7,no:5,d:"Each night, learn one player's true role.",e:"🔍"},mysticseer:{n:"Mystic Seer",t:"village",w:9,no:5,d:"Learn true role of one, alignment of another.",e:"🌟"},appseer:{n:"Apprentice Seer",t:"village",w:4,no:99,d:"Becomes Seer if Seer dies.",e:"📚"},mentalist:{n:"Mentalist",t:"village",w:6,no:7,d:"Learn if two players are same team.",e:"🧠"},auraseer:{n:"Aura Seer",t:"village",w:3,no:6,d:"Each night, learn alignment (good/evil).",e:"✨"},pi:{n:"PI",t:"village",w:3,no:9,d:"Learn if one of two is werewolf.",e:"🕵️"},revealer:{n:"Revealer",t:"village",w:2,no:8,d:"Flip card once per game, then die.",e:"💎"},witch:{n:"Witch",t:"village",w:4,no:10,d:"Save victim OR eliminate player.",e:"🧙‍♀️"},hunter:{n:"Hunter",t:"village",w:3,no:99,d:"When killed, shoot one player.",e:"🏹"},huntress:{n:"Huntress",t:"village",w:3,no:11,d:"Shoot once at night, also on day death.",e:"👩‍🦰🏹"},bodyguard:{n:"Bodyguard",t:"village",w:3,no:12,d:"Protect one from werewolves each night.",e:"🛡️"},priest:{n:"Priest",t:"village",w:3,no:13,d:"Bless player for immunity.",e:"🙏"},spellcaster:{n:"Spellcaster",t:"village",w:1,no:14,d:"Once, silence player for one day.",e:"✋"},cupid:{n:"Cupid",t:"village",w:3,no:15,d:"Night 1: link two lovers (die together).",e:"💘"},mason:{n:"Mason",t:"village",w:2,no:99,d:"Know other Masons.",e:"🪨"},prince:{n:"Prince",t:"village",w:3,no:99,d:"First vote cancels, role revealed.",e:"👶"},toughguy:{n:"Tough Guy",t:"village",w:3,no:99,d:"Survive werewolf kill until next day.",e:"💪"},diseased:{n:"Diseased",t:"village",w:3,no:99,d:"If eaten, skip werewolves' next kill.",e:"🦠"},drunk:{n:"Drunk",t:"village",w:4,no:99,d:"Don't know role. Learn on day 3.",e:"🍷"},pacifist:{n:"Pacifist",t:"village",w:-1,no:99,d:"Must vote daily. Wins with village.",e:"☮️"},troublemaker:{n:"Troublemaker",t:"neutral",w:0,no:16,d:"Stir trouble for next day vote.",e:"😈"},doppelganger:{n:"Doppelganger",t:"neutral",w:-2,no:17,d:"Copy role night 1, gain when they die.",e:"👥"},madbomber:{n:"Mad Bomber",t:"neutral",w:-2,no:99,d:"Eliminated = chain explosion.",e:"💣"},curse:{n:"Curse",t:"neutral",w:-3,no:99,d:"If werewolves eat you, become wolf.",e:"⚫"},cultleader:{n:"Cult Leader",t:"neutral",w:0,no:18,d:"Recruit nightly. Win if all cultists.",e:"⛪"}};
var POOLS = {6:{e:["werewolf"],v:["seer","hunter","bodyguard"]},7:{e:["werewolf","werewolf"],v:["seer","hunter","mason"]},8:{e:["werewolf","wolfcub"],v:["seer","mentalist","bodyguard","witch"]},9:{e:["werewolf","werewolf","minion"],v:["seer","hunter","bodyguard","mason","mason"]},10:{e:["werewolf","werewolf","minion"],v:["seer","hunter","bodyguard","witch","mason","mason"]},11:{e:["werewolf","werewolf","werewolf","minion"],v:["mysticseer","hunter","bodyguard","witch","mason","mason"],n:["troublemaker"]},12:{e:["werewolf","werewolf","wolfcub","minion"],v:["seer","appseer","hunter","bodyguard","witch","mason","mason"],n:["doppelganger"]},13:{e:["werewolf","werewolf","werewolf","minion"],v:["mysticseer","appseer","huntress","bodyguard","witch","mason","priest"],n:["curse"]},14:{e:["werewolf","werewolf","werewolf","alphawolf","minion"],v:["seer","appseer","hunter","bodyguard","witch","mason","cupid"],n:["cultleader"]}};
var NIGHT_ACTIONS = {1:"Werewolves kill",2:"Alpha converts",3:"Minion checks",4:"Sorceress seeks",5:"Seers view",6:"Aura learns",7:"Mentalist compares",8:"Revealer flips",9:"PI checks",10:"Witch acts",11:"Huntress shoots",12:"Bodyguard protects",13:"Priest blesses",14:"Spellcaster silences",15:"Cupid links",16:"Troublemaker stirs",17:"Doppelganger copies",18:"Cult recruits"};
var gameState = null;
var firebaseDb = null;
var firebaseListener = null;

var firebaseConfig = {
  apiKey: "AIzaSyC5Oz7_xQfdmEGAQmlyzyDWteYmrRPYojY",
  authDomain: "werewolf-72435.firebaseapp.com",
  projectId: "werewolf-72435",
  storageBucket: "werewolf-72435.firebasestorage.app",
  messagingSenderId: "778703058273",
  appId: "1:778703058273:web:ee44886cb9702b816fc120",
  measurementId: "G-7CNPDZFNNM"
};

if(typeof firebase !== "undefined" && firebase.initializeApp) {
  firebase.initializeApp(firebaseConfig);
  firebaseDb = firebase.database();
}

function encodeGameState(gs) {
  var stateStr = JSON.stringify({r:gs.roles,c:gs.count,e:gs.evil,v:gs.village,n:gs.neutral,b:gs.balance,id:gs.id});
  return btoa(stateStr).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

function decodeGameState(encoded) {
  try {
    var padded = encoded + '=='.substr(0,(4-encoded.length%4)%4);
    var stateStr = atob(padded.replace(/-/g,'+').replace(/_/g,'/'));
    var data = JSON.parse(stateStr);
    return {id:data.id||'shared',count:data.c,players:{},roles:data.r,evil:data.e,village:data.v,neutral:data.n,balance:data.b};
  } catch(e) {
    return null;
  }
}

function setupGame(count) {
  var pool = JSON.parse(JSON.stringify(POOLS[count]));
  var roles = pool.e.concat(pool.v).concat(pool.n || []);
  var balance = 0;
  for(var i = 0; i < roles.length; i++) { balance += ROLES[roles[i]].w; }
  gameState = {id:"uw-"+Date.now(),count:count,players:{},roles:roles,evil:pool.e.length,village:pool.v.length,neutral:(pool.n||[]).length,balance:balance};
  
  var gameKey = "game-"+gameState.id;
  localStorage.setItem(gameKey, JSON.stringify(gameState));
  
  var fbData = {count:count, roles:roles, evil:pool.e.length, village:pool.v.length, neutral:(pool.n||[]).length, balance:balance, players:{}, id:gameState.id};
  firebaseDb.ref("games/"+gameState.id).set(fbData);
  
  setupFirebaseListener(gameState.id);
  showSetup(pool);
}

function showSetup(pool) {
  var html = "<h3 style='margin-bottom:12px;'>"+gameState.count+" Players (Balance: "+(gameState.balance>=0?"+":"")+gameState.balance+")</h3>";
  html += "<div class='summary'><span class='tag tag-evil'>Evil: "+gameState.evil+"</span><span class='tag tag-village'>Village: "+gameState.village+"</span>";
  if(gameState.neutral > 0) html += "<span class='tag tag-neutral'>Neutral: "+gameState.neutral+"</span>";
  html += "</div>";
  
  html += "<h4 style='margin:16px 0 12px;'>Roles in this game:</h4>";
  for(var i = 0; i < gameState.roles.length; i++) {
    var rk = gameState.roles[i];
    var r = ROLES[rk];
    html += "<div class='role-row'><div class='role-row-emoji'>"+r.e+"</div><div class='tag tag-"+r.t+"'>"+r.t.toUpperCase().substr(0,3)+"</div><div class='role-name'>"+r.n+"</div><div class='role-desc'>"+r.d+"</div></div>";
  }
  
  var nightRoles = [];
  for(var i = 0; i < gameState.roles.length; i++) {
    if(ROLES[gameState.roles[i]].no < 99) {
      nightRoles.push(gameState.roles[i]);
    }
  }
  
  if(nightRoles.length > 0) {
    nightRoles.sort(function(a,b){return ROLES[a].no - ROLES[b].no;});
    html += "<div class='night-order'><div style='font-weight:bold;margin-bottom:8px;'>Night Order (Who wakes when):</div>";
    for(var i = 0; i < nightRoles.length; i++) {
      var rk = nightRoles[i];
      var r = ROLES[rk];
      html += "<div class='night-step'><strong>"+r.no+".</strong> <strong>"+r.n+":</strong> "+NIGHT_ACTIONS[r.no]+"</div>";
    }
    html += "</div>";
  }
  
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  html += "<div class='share-box' style='display:block;'><div style='font-size:11px;font-weight:bold;margin-bottom:6px;'>SHARE THIS LINK WITH PLAYERS:</div><div class='share-link'>"+url+"</div>";
  html += "<button class='action-btn' onclick='copyLink()'>Copy</button> ";
  if(navigator.share) {
    html += "<button class='action-btn' onclick='shareLink()'>Share</button>";
  }
  html += "</div>";
  
  html += "<h4 style='margin:16px 0 12px;'>Connected Players ("+Object.keys(gameState.players).length+"/"+gameState.count+")</h4>";
  if(Object.keys(gameState.players).length > 0) {
    html += "<div class='players-list'>";
    for(var pid in gameState.players) {
      var p = gameState.players[pid];
      var r = ROLES[p.role];
      html += "<div class='player-item'><div><div class='player-item-emoji'>"+r.e+"</div><div><strong>"+p.name+"</strong><div style='font-size:10px;color:#666;'>"+r.n+"</div></div></div><span class='tag tag-"+r.t+"'>"+r.t+"</span></div>";
    }
    html += "</div>";
  } else {
    html += "<div style='padding:20px;text-align:center;color:#888;'>Waiting for players...</div>";
  }
  
  var btns = "<button class='action-btn action-btn-green' onclick='refreshPlayers()'>Refresh Players</button> ";
  btns += "<button class='action-btn' onclick='setupGame("+gameState.count+")'>Reroll Setup</button> ";
  btns += "<button class='action-btn' onclick='endGame()' style='border-color:#c0392b;color:#c0392b;'>End Game</button>";
  
  document.getElementById("result").innerHTML = html + "<div style='margin-top:16px;'>"+btns+"</div>";
  document.getElementById("result").style.display = "block";
}

function setupFirebaseListener(gameId) {
  if(firebaseListener) {
    firebaseListener.off();
  }
  firebaseListener = firebaseDb.ref("games/"+gameId+"/players").on('value', function(snapshot){
    if(gameState && gameState.id === gameId) {
      gameState.players = {};
      snapshot.forEach(function(child){
        gameState.players[child.key] = child.val();
      });
      var pool = POOLS[gameState.count];
      if(pool) {
        showSetup(pool);
      }
    }
  });
}

function refreshPlayers() {
  if(!gameState || !gameState.id) return;
  firebaseDb.ref("games/"+gameState.id+"/players").once('value', function(snapshot){
    gameState.players = {};
    snapshot.forEach(function(child){
      gameState.players[child.key] = child.val();
    });
    var pool = POOLS[gameState.count];
    showSetup(pool);
  });
}

function endGame() {
  if(confirm("End this game? Players will no longer be able to join.")) {
    localStorage.removeItem("game-"+gameState.id);
    if(gameState && gameState.id) {
      firebaseDb.ref("games/"+gameState.id).remove();
    }
    gameState = null;
    document.getElementById("result").innerHTML = "<div class='warning'>Game ended. Create a new one to play again.</div>";
    document.getElementById("result").style.display = "block";
  }
}

function copyLink() {
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  navigator.clipboard.writeText(url).then(function() { alert("Link copied!"); });
}

function shareLink() {
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  navigator.share({title:"Werewolf Game",url:url});
}

function showPlayerView() {
  var params = new URLSearchParams(window.location.search);
  var gid = params.get("g") || params.get("game");
  var html = "";
  if(!gid) {
    html = "<p style='color:#888;'>Ask moderator for game link</p>";
  } else {
    var g = null;
    if(params.get("g")) {
      g = decodeGameState(gid);
    } else if(params.get("game")) {
      var gameKey = "game-"+gid;
      var stored = localStorage.getItem(gameKey);
      if(stored) { 
        g = JSON.parse(stored); 
      } else {
        g = null;
      }
    }
    
    if(!g) {
      html = "<p style='color:#c0392b;font-weight:bold;'>Game link invalid or expired</p><p style='color:#888;font-size:11px;'>Ask moderator to create a new game and send the link</p>";
    } else {
      var stored = localStorage.getItem("game-shared");
      if(stored) { g = JSON.parse(stored); }
      var pid = localStorage.getItem("pid-shared");
      if(!pid) {
        html = "<input type='text' class='player-name-input' id='pname' placeholder='Your name'>";
        html += "<button class='action-btn action-btn-green' onclick='joinGame(\""+gid+"\")'>Join Game</button>";
      } else {
        var p = g.players[pid];
        var r = ROLES[p.role];
        var cardClass = r.t === "evil" ? "role-card-evil" : (r.t === "village" ? "role-card-village" : "role-card-neutral");
        var teamLabel = r.t === "evil" ? "🔴 EVIL SIDE" : (r.t === "village" ? "🟢 VILLAGE SIDE" : "🟣 NEUTRAL");
        html = "<div class='role-card "+cardClass+"'>";
        html += "<div style='font-size:14px;margin-bottom:8px;'>👤 "+p.name+"</div>";
        html += "<div class='role-emoji'>"+r.e+"</div>";
        html += "<h2>"+r.n+"</h2>";
        html += "<div class='team-badge'>"+teamLabel+"</div>";
        html += "<div class='description'>"+r.d+"</div>";
        html += "<button class='action-btn' style='background:#fff;color:#333;margin-top:20px;' onclick='leaveGame(\"shared\")'>Leave Game</button>";
        html += "</div>";
      }
    }
  }
  document.getElementById("playerView").innerHTML = html;
}

function joinGame(gid) {
  var name = document.getElementById("pname").value.trim();
  if(!name) { alert("Enter your name"); return; }
  
  var g = null;
  var params = new URLSearchParams(window.location.search);
  
  var sharedGame = localStorage.getItem("game-shared");
  if(sharedGame) {
    try {
      g = JSON.parse(sharedGame);
    } catch(e) {}
  }
  
  if(!g) {
    if(params.get("g")) {
      g = decodeGameState(gid);
    } else if(params.get("game")) {
      var gameKey = "game-"+gid;
      var stored = localStorage.getItem(gameKey);
      if(stored) { 
        g = JSON.parse(stored); 
      }
    }
  }
  
  if(!g) { alert("Game link invalid"); return; }
  var pid = "p"+Date.now();
  var rndx = Math.floor(Math.random() * g.roles.length);
  g.players[pid] = {name:name, role:g.roles[rndx]};
  localStorage.setItem("game-shared", JSON.stringify(g));
  localStorage.setItem("pid-shared", pid);
  localStorage.setItem("gid-shared", g.id);
  
  firebaseDb.ref("games/"+g.id+"/players/"+pid).set({name:name, role:g.roles[rndx]});
  setupPlayerFirebaseListener(g.id, pid);
  
  showPlayerView();
}

function setupPlayerFirebaseListener(gameId, playerId) {
  if(firebaseListener) {
    firebaseListener.off();
  }
  firebaseListener = firebaseDb.ref("games/"+gameId+"/players/"+playerId).on('value', function(snapshot){
    if(snapshot.exists()) {
      var playerData = snapshot.val();
      var sharedGame = localStorage.getItem("game-shared");
      if(sharedGame) {
        try {
          var g = JSON.parse(sharedGame);
          g.players[playerId] = playerData;
          localStorage.setItem("game-shared", JSON.stringify(g));
        } catch(e) {}
      }
    }
  });

function leaveGame(gid) {
  localStorage.removeItem("pid-shared");
  localStorage.removeItem("game-shared");
  localStorage.removeItem("gid-shared");
  showPlayerView();
}

document.getElementById("modBtn").onclick = function() {
  document.getElementById("modTab").classList.add("active");
  document.getElementById("playerTab").classList.remove("active");
  document.getElementById("modBtn").classList.add("active");
  document.getElementById("playerBtn").classList.remove("active");
  
  var params = new URLSearchParams(window.location.search);
  var gid = params.get("game");
  if(gid && !gameState) {
    var gameKey = "game-"+gid;
    var gdata = localStorage.getItem(gameKey);
    if(gdata) {
      gameState = JSON.parse(gdata);
      var pool = POOLS[gameState.count];
      showSetup(pool);
    }
  }
};

document.getElementById("playerBtn").onclick = function() {
  document.getElementById("playerTab").classList.add("active");
  document.getElementById("modTab").classList.remove("active");
  document.getElementById("playerBtn").classList.add("active");
  document.getElementById("modBtn").classList.remove("active");
  showPlayerView();
};

function initPage() {
  if(window.pageInitialized) return;
  window.pageInitialized = true;
  
  for(var i = 6; i <= 14; i++) {
    (function(n) {
      var b = document.createElement("button");
      b.className = "btn";
      b.textContent = n;
      b.onclick = function() {
        if(gameState) {
          if(!confirm("End current game and start new one?")) return;
          localStorage.removeItem("game-"+gameState.id);
        }
        document.querySelectorAll(".btn").forEach(function(x){x.classList.remove("active");});
        b.classList.add("active");
        setupGame(n);
      };
      document.getElementById("btnRow").appendChild(b);
    })(i);
  }
  
  var params = new URLSearchParams(window.location.search);
  if(params.get("g") || params.get("game")) {
    setTimeout(function(){
      document.getElementById("playerTab").classList.add("active");
      document.getElementById("modTab").classList.remove("active");
      document.getElementById("playerBtn").classList.add("active");
      document.getElementById("modBtn").classList.remove("active");
      showPlayerView();
    }, 50);
  }
}

if(document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initPage);
} else {
  setTimeout(initPage, 100);
}
  </script>
</body>
</html>
