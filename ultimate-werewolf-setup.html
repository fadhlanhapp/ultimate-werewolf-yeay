<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Werewolf - Online Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f5f5f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; text-align: center; }
    .subtitle { color: #666; font-style: italic; font-size: 12px; margin-bottom: 6px; text-align: center; }
    .note {
      font-size: 11px; color: #c0392b;
      background: #fdecea; border: 1px solid #e74c3c;
      border-radius: 4px; padding: 5px 14px;
      margin-bottom: 24px; text-align: center;
    }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab-btn {
      padding: 8px 16px; border: 2px solid #bbb; border-radius: 6px;
      background: #fff; cursor: pointer; font-family: Georgia, serif;
      font-size: 13px; font-weight: bold;
    }
    .tab-btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
    .tab-btn:hover { border-color: #555; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Setup Panel */
    .setup-panel { max-width: 560px; width: 100%; }
    .input-section { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
    .input-label { font-size: 15px; font-weight: bold; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn {
      width: 44px; height: 44px; border: 2px solid #bbb; border-radius: 6px;
      background: #fff; font-size: 15px; font-family: Georgia, serif;
      font-weight: bold; cursor: pointer; color: #333;
    }
    .btn:hover { border-color: #555; background: #f0f0f0; }
    .btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
    .action-btn {
      padding: 8px 20px; margin-top: 8px;
      border: 2px solid #2b2b2b; border-radius: 6px;
      background: #fff; font-size: 13px; font-family: Georgia, serif;
      cursor: pointer; display: inline-block;
    }
    .action-btn:hover { background: #2b2b2b; color: #fff; }
    .action-btn-green { border-color: #27ae60; color: #27ae60; }
    .action-btn-green:hover { background: #27ae60; color: #fff; }

    /* Result */
    #result {
      width: 100%; max-width: 560px; background: #fff;
      border: 1px solid #ddd; border-radius: 8px; padding: 22px 26px; display: none;
    }
    .result-title { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
    .result-sub { font-size: 11px; color: #888; margin-bottom: 16px; }

    /* Share Link */
    .share-box {
      background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px;
      padding: 12px; margin: 12px 0;
    }
    .share-label { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666; margin-bottom: 6px; }
    .share-link {
      background: #fff; border: 1px solid #ddd; border-radius: 4px;
      padding: 8px 10px; font-size: 11px; word-break: break-all;
      font-family: monospace; margin-bottom: 6px; max-height: 80px; overflow-y: auto;
    }
    .share-buttons { display: flex; gap: 6px; }
    .share-buttons button { padding: 4px 12px; font-size: 11px; border: 1px solid #ccc;
      border-radius: 4px; background: #fff; cursor: pointer; }
    .share-buttons button:hover { background: #f0f0f0; }

    /* Player View */
    .player-panel { max-width: 600px; width: 100%; text-align: center; }
    .role-display {
      background: #fff; border: 2px solid #ddd; border-radius: 8px;
      padding: 40px 30px; margin: 20px 0; font-size: 18px;
    }
    .role-name { font-size: 28px; font-weight: bold; margin: 20px 0; color: #2b2b2b; }
    .role-team-evil { color: #c0392b; }
    .role-team-village { color: #27ae60; }
    .role-team-neutral { color: #8e44ad; }
    .role-desc { font-size: 12px; color: #555; margin: 20px 0; line-height: 1.6; text-align: left;
      background: #f9f9f9; padding: 15px; border-radius: 4px; }
    .player-name-input { font-size: 16px; padding: 10px; border: 2px solid #ddd;
      border-radius: 4px; width: 100%; max-width: 300px; margin-bottom: 12px; }
    .player-name-display { font-size: 14px; color: #666; margin: 12px 0; }

    /* Moderator View */
    .mod-panel { max-width: 800px; width: 100%; }
    .players-list {
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      margin: 12px 0;
    }
    .player-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-bottom: 1px solid #e0e0e0; gap: 12px;
    }
    .player-item:last-child { border-bottom: none; }
    .player-info { flex: 1; text-align: left; }
    .player-name { font-weight: bold; }
    .player-role { font-size: 11px; color: #666; }
    .player-tag {
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      font-family: sans-serif; font-weight: bold;
    }
    .tag-evil { background: #fdecea; color: #c0392b; border: 1px solid #e74c3c; }
    .tag-village { background: #eafaf1; color: #27ae60; border: 1px solid #2ecc71; }
    .tag-neutral { background: #f5eef8; color: #8e44ad; border: 1px solid #9b59b6; }

    /* Roles list */
    .role-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px dotted #e0e0e0; gap: 8px;
    }
    .role-row:last-child { border-bottom: none; }
    .role-left { display: flex; align-items: baseline; gap: 7px; min-width: 155px; }
    .tag { font-size: 10px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; font-family: sans-serif; }
    .role-name { font-weight: bold; font-size: 12px; }
    .role-desc { font-size: 11px; color: #555; flex: 1; line-height: 1.4; }
    .role-count { font-size: 16px; font-weight: bold; min-width: 28px; text-align: right; color: #333; }

    /* Summary */
    .summary {
      margin-top: 16px; padding-top: 10px; border-top: 1px solid #ddd;
      display: flex; gap: 10px; justify-content: center; font-size: 11px; flex-wrap: wrap;
    }
    .summary span { padding: 3px 10px; border-radius: 12px; font-family: sans-serif; }
    .sum-evil    { background: #fdecea; color: #c0392b; border: 1px solid #e74c3c; }
    .sum-village { background: #eafaf1; color: #27ae60; border: 1px solid #2ecc71; }
    .sum-neutral { background: #f5eef8; color: #8e44ad; border: 1px solid #9b59b6; }

    @media print {
      body { background: #fff; padding: 16px; }
      .tabs, .action-btn, .share-box, .player-name-input { display: none !important; }
    }
  </style>
  <script>
  // ── ROLE DEFINITIONS ──────────────────────────────────────────────────────
  var ROLES = {
    werewolf:    { name:"Werewolf",    team:"evil",    tag:"Evil",    weight:-9,  nightOrder:1,  desc:"Wakes each night to silently choose a victim to eliminate." },
    alphawolf:   { name:"Alpha Wolf",  team:"evil",    tag:"Evil",    weight:-9,  nightOrder:2,  desc:"A werewolf who, once per game, can convert a villager into a new werewolf instead of killing." },
    wolfcub:     { name:"Wolf Cub",    team:"evil",    tag:"Evil",    weight:-8,  nightOrder:1,  desc:"A werewolf. If eliminated, werewolves kill two players the following night." },
    minion:      { name:"Minion",      team:"evil",    tag:"Evil",    weight:-6,  nightOrder:3,  desc:"Knows the werewolves. Wins if any werewolf survives to the end." },
    lycan:       { name:"Lycan",       team:"evil",    tag:"Evil",    weight:-1,  nightOrder:99, desc:"Appears as Werewolf when seen by the Seer. Actually on the evil team." },
    sorceress:   { name:"Sorceress",   team:"evil",    tag:"Evil",    weight:-3,  nightOrder:4,  desc:"Each night, picks a player to learn if they are the Seer. Wins with werewolves." },
    
    mysticseer:  { name:"Mystic Seer", team:"village", tag:"Village", weight:9,   nightOrder:5,  desc:"Learns the true role of one player AND the alignment of a second player." },
    mentalist:   { name:"Mentalist",   team:"village", tag:"Village", weight:6,   nightOrder:7,  desc:"Learns if two chosen players are on the same team or different teams." },
    revealer:    { name:"Revealer",    team:"village", tag:"Village", weight:2,   nightOrder:8,  desc:"Once per game, publicly flips one player's card. Dies whether good or evil." },
    witch:       { name:"Witch",       team:"village", tag:"Village", weight:4,   nightOrder:10, desc:"May save the werewolves' victim OR eliminate any player (one action per night)." },
    appseer:     { name:"Apprentice Seer", team:"village", tag:"Village", weight:4, nightOrder:5, desc:"Becomes the Seer if the Seer is eliminated. No power until then." },
    drunk:       { name:"Drunk",       team:"village", tag:"Village", weight:4,   nightOrder:99, desc:"Does not know their role. On day 3, Moderator reveals their true role." },
    hunter:      { name:"Hunter",      team:"village", tag:"Village", weight:3,   nightOrder:99, desc:"When eliminated, shoots and eliminates one other player." },
    diseased:    { name:"Diseased",    team:"village", tag:"Village", weight:3,   nightOrder:99, desc:"If killed by werewolves, werewolves skip their kill next night." },
    pi:          { name:"PI",          team:"village", tag:"Village", weight:3,   nightOrder:9,  desc:"Learns if at least one of two chosen players is a werewolf." },
    prince:      { name:"Prince",      team:"village", tag:"Village", weight:3,   nightOrder:99, desc:"First time voted out, Moderator reveals role and vote is cancelled." },
    toughguy:    { name:"Tough Guy",   team:"village", tag:"Village", weight:3,   nightOrder:99, desc:"When killed by werewolves, survives until next day before removal." },
    auraseer:    { name:"Aura Seer",   team:"village", tag:"Village", weight:3,   nightOrder:6,  desc:"Learns only the alignment (good/evil) of one player each night." },
    huntress:    { name:"Huntress",    team:"village", tag:"Village", weight:3,   nightOrder:11, desc:"Like Hunter, but can also proactively shoot once per game at night." },
    bodyguard:   { name:"Bodyguard",   team:"village", tag:"Village", weight:3,   nightOrder:12, desc:"Protects one player from werewolves. Cannot protect same person twice in a row." },
    priest:      { name:"Priest",      team:"village", tag:"Village", weight:3,   nightOrder:13, desc:"Blesses a player each night, making them immune to werewolf attack." },
    seer:        { name:"Seer",        team:"village", tag:"Village", weight:7,   nightOrder:5,  desc:"Learns the true role of one chosen player each night." },
    mason:       { name:"Mason",       team:"village", tag:"Village", weight:2,   nightOrder:99, desc:"Wakes with other Masons and recognizes them as confirmed villagers." },
    spellcaster: { name:"Spellcaster", team:"village", tag:"Village", weight:1,   nightOrder:14, desc:"Once per game, silences a player for one full day (cannot speak)." },
    cupid:       { name:"Cupid",       team:"village", tag:"Village", weight:3,   nightOrder:15, desc:"Night 1: links two players as lovers. If one dies, other dies too." },
    pacifist:    { name:"Pacifist",    team:"village", tag:"Village", weight:-1,  nightOrder:99, desc:"Must vote to eliminate someone daily. Cannot abstain. Wins with village." },
    
    troublemaker:{ name:"Troublemaker",team:"neutral", tag:"Neutral", weight:0,   nightOrder:16, desc:"One night per game, stirs up trouble for the following day vote." },
    doppelganger:{ name:"Doppelganger",team:"neutral", tag:"Neutral", weight:-2,  nightOrder:17, desc:"Night 1: copies another player's role. Activates when that player dies." },
    madbomber:   { name:"Mad Bomber",  team:"neutral", tag:"Neutral", weight:-2,  nightOrder:99, desc:"When eliminated, all adjacent players are also eliminated." },
    curse:       { name:"Curse",       team:"neutral", tag:"Neutral", weight:-3,  nightOrder:99, desc:"Starts as villager. If targeted by werewolves, becomes one instead." },
    cultleader:  { name:"Cult Leader", team:"neutral", tag:"Neutral", weight:0,   nightOrder:18, desc:"Recruits one player per night. Wins if all survivors are cult members." }
  };

  var NIGHT_ACTIONS = {
    1:  "Werewolves choose a victim to kill",
    2:  "Alpha Wolf can convert a villager (once per game)",
    3:  "Minion communicates if needed",
    4:  "Sorceress learns if a player is the Seer",
    5:  "Seers view chosen player roles",
    6:  "Aura Seer learns player alignment",
    7:  "Mentalist learns if players are on same team",
    8:  "Revealer flips one player's card publicly",
    9:  "PI learns if a chosen player is a werewolf",
    10: "Witch saves victim OR eliminates a player",
    11: "Huntress uses her shot proactively",
    12: "Bodyguard protects one player",
    13: "Priest blesses a player",
    14: "Spellcaster silences a player",
    15: "Cupid links two lovers (Night 1)",
    16: "Troublemaker stirs up trouble",
    17: "Doppelganger copies a role",
    18: "Cult Leader recruits a player"
  };

  var POOLS = {
    6:  { evil:["werewolf"],               village:["seer","hunter","bodyguard"] },
    7:  { evil:["werewolf","werewolf"],     village:["seer","hunter","bodyguard"] },
    8:  { evil:["werewolf","wolfcub"],      village:["seer","hunter","bodyguard","witch"] },
    9:  { evil:["werewolf","werewolf","minion"], village:["seer","hunter","bodyguard","mason","mason"] },
    10: { evil:["werewolf","werewolf","minion"], village:["seer","hunter","bodyguard","witch","mason","mason"] },
    11: { evil:["werewolf","werewolf","werewolf","minion"], village:["seer","hunter","bodyguard","witch","mason","mason"] },
    12: { evil:["werewolf","werewolf","wolfcub","minion"], village:["seer","appseer","hunter","bodyguard","witch","mason","mason"] },
    13: { evil:["werewolf","werewolf","werewolf","minion"], village:["seer","appseer","hunter","bodyguard","witch","mason","mason","priest"] },
    14: { evil:["werewolf","werewolf","werewolf","alphawolf","minion"], village:["seer","appseer","hunter","bodyguard","witch","mason","mason"] }
  };

  var EVIL_VARIANTS   = ["alphawolf","wolfcub","lycan","sorceress"];
  var VILLAGE_VARIANTS= ["mysticseer","mentalist","revealer","drunk","pi","prince","toughguy","auraseer","huntress","diseased","spellcaster","cupid","priest"];
  var NEUTRAL_POOL    = ["troublemaker","doppelganger","madbomber","curse","cultleader"];

  var currentCount = null;
  var currentGameState = null;

  // ── UI FUNCTIONS ──────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    var btns = document.querySelectorAll('.tab-btn');
    btns.forEach(function(btn) {
      if (btn.textContent.includes(tab === 'moderator' ? 'Setup' : 'Join')) {
        btn.classList.add('active');
      }
    });
    if (tab === 'player') renderPlayerView();
  }

  function copyToClipboard() {
    var link = document.getElementById('shareLink').textContent;
    navigator.clipboard.writeText(link).then(function() { alert('Link copied!'); });
  }

  function shareViaURL() {
    var link = document.getElementById('shareLink').textContent;
    if (navigator.share) {
      navigator.share({ title: 'Ultimate Werewolf Game', url: link });
    } else {
      alert('Sharing not supported. Copy the link manually.');
    }
  }

  function generateGameId() {
    return 'uw-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
  }

  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function generate(count) {
    var pool = JSON.parse(JSON.stringify(POOLS[count]));
    var evilKeys    = pool.evil.slice();
    var villageKeys = pool.village.slice();
    var neutralKeys = [];

    villageKeys = villageKeys.map(function(k) {
      if (k === "mason") return k;
      if (Math.random() < 0.35) {
        var alt = VILLAGE_VARIANTS[Math.floor(Math.random() * VILLAGE_VARIANTS.length)];
        if (villageKeys.indexOf(alt) === -1 && evilKeys.indexOf(alt) === -1) return alt;
      }
      return k;
    });

    evilKeys = evilKeys.map(function(k) {
      if (k !== "werewolf") return k;
      if (Math.random() < 0.25) {
        var already = evilKeys.concat(villageKeys).concat(neutralKeys);
        var candidates = EVIL_VARIANTS.filter(function(x){ return already.indexOf(x) === -1; });
        if (candidates.length) return pickRandom(candidates);
      }
      return k;
    });

    var thirdPartyChance = count >= 11 ? 0.60 : (count >= 9 ? 0.40 : 0);
    if (Math.random() < thirdPartyChance) {
      var already2 = evilKeys.concat(villageKeys);
      var candidates = NEUTRAL_POOL.filter(function(x){ return already2.indexOf(x) === -1; });
      if (candidates.length) {
        var chosen = pickRandom(candidates);
        if (chosen === "cultleader" && count < 11) chosen = pickRandom(candidates.filter(function(x){return x!=="cultleader";}));
        if (chosen) {
          neutralKeys.push(chosen);
          var removable = villageKeys.filter(function(k){ return k !== "seer" && k !== "mason"; });
          if (removable.length) villageKeys.splice(villageKeys.indexOf(removable[0]), 1);
        }
      }
    }

    var all = evilKeys.concat(villageKeys).concat(neutralKeys);
    while (all.length < count) { villageKeys.push("spellcaster"); all = evilKeys.concat(villageKeys).concat(neutralKeys); }
    while (all.length > count) {
      var rem = villageKeys.filter(function(k){ return k !== "seer" && k !== "mason"; });
      if (rem.length) villageKeys.splice(villageKeys.indexOf(rem[rem.length-1]), 1);
      else if (neutralKeys.length) neutralKeys.pop();
      all = evilKeys.concat(villageKeys).concat(neutralKeys);
    }

    currentGameState = {
      gameId: generateGameId(),
      playerCount: count,
      roles: all,
      evilKeys: evilKeys,
      villageKeys: villageKeys,
      neutralKeys: neutralKeys,
      players: {}
    };

    renderResult(count, evilKeys, villageKeys, neutralKeys);
  }

  function reroll() { if (currentCount) generate(currentCount); }

  function generateGame() {
    if (!currentGameState) return;
    var gameData = JSON.stringify(currentGameState);
    localStorage.setItem('game-' + currentGameState.gameId, gameData);
    var baseUrl = window.location.origin + window.location.pathname;
    var shareLink = baseUrl + '?game=' + currentGameState.gameId;
    document.getElementById('shareLink').textContent = shareLink;
    renderModeratorView();
  }

  function renderModeratorView() {
    var modView = document.getElementById('modView');
    var gameState = currentGameState;
    var html = '<div class="mod-panel"><h3 style="margin-top:20px;margin-bottom:12px;">Connected Players</h3>';
    html += '<div class="players-list" id="playersList"></div>';
    html += '<p style="font-size:11px;color:#888;margin-top:12px;">Players: ' + Object.keys(gameState.players).length + '/' + gameState.playerCount + '</p>';
    html += '</div>';
    modView.innerHTML = html;
    updatePlayersList();
  }

  function updatePlayersList() {
    if (!currentGameState) return;
    var playersList = document.getElementById('playersList');
    if (!playersList) return;
    var html = '';
    var players = currentGameState.players;
    if (Object.keys(players).length === 0) {
      html = '<div style="padding:20px;text-align:center;color:#888;">Waiting for players...</div>';
    } else {
      for (var playerId in players) {
        var player = players[playerId];
        var role = ROLES[player.role];
        var tagClass = 'tag-' + role.team;
        html += '<div class="player-item">';
        html += '  <div class="player-info">';
        html += '    <div class="player-name">' + player.name + '</div>';
        html += '    <div class="player-role">' + role.name + '</div>';
        html += '  </div>';
        html += '  <span class="player-tag ' + tagClass + '">' + role.team.toUpperCase() + '</span>';
        html += '</div>';
      }
    }
    playersList.innerHTML = html;
  }

  function renderPlayerView() {
    var params = new URLSearchParams(window.location.search);
    var gameId = params.get('game');
    var playerView = document.getElementById('playerView');
    if (!gameId) {
      playerView.innerHTML = '<p style="color:#888;padding:20px;">No game link. Ask moderator for the link.</p>';
      return;
    }
    var gameData = localStorage.getItem('game-' + gameId);
    if (!gameData) {
      playerView.innerHTML = '<p style="color:#888;padding:20px;">Game not found or expired.</p>';
      return;
    }
    var gameState = JSON.parse(gameData);
    var playerId = localStorage.getItem('playerId-' + gameId);
    var html = '';
    if (!playerId) {
      html += '<div style="max-width:400px;">';
      html += '<input type="text" class="player-name-input" id="playerNameInput" placeholder="Enter your name">';
      html += '<button class="action-btn action-btn-green" onclick="joinGame('' + gameId + '')">Join Game</button>';
      html += '</div>';
    } else {
      var player = gameState.players[playerId];
      var role = ROLES[player.role];
      html += '<div class="role-display">';
      html += '<div class="player-name-display">Your Name: <strong>' + player.name + '</strong></div>';
      html += '<div style="font-size:12px;color:#888;margin-bottom:12px;">Find your card or ask moderator</div>';
      html += '<div class="role-name role-team-' + role.team + '">' + role.name + '</div>';
      html += '<div class="role-desc">' + role.desc + '</div>';
      html += '<button class="action-btn" onclick="leaveGame('' + gameId + '')">Leave Game</button>';
      html += '</div>';
    }
    playerView.innerHTML = html;
  }

  function joinGame(gameId) {
    var nameInput = document.getElementById('playerNameInput');
    var playerName = nameInput.value.trim();
    if (!playerName) { alert('Enter your name'); return; }
    var gameData = localStorage.getItem('game-' + gameId);
    if (!gameData) { alert('Game not found'); return; }
    var gameState = JSON.parse(gameData);
    var playerId = 'player-' + Date.now();
    var availableIndices = [];
    for (var i = 0; i < gameState.playerCount; i++) {
      var alreadyAssigned = false;
      for (var pId in gameState.players) {
        if (gameState.players[pId].roleIndex === i) { alreadyAssigned = true; break; }
      }
      if (!alreadyAssigned) availableIndices.push(i);
    }
    if (availableIndices.length === 0) { alert('All roles assigned'); return; }
    var roleIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
    var role = gameState.roles[roleIndex];
    gameState.players[playerId] = { name: playerName, role: role, roleIndex: roleIndex };
    localStorage.setItem('game-' + gameId, JSON.stringify(gameState));
    localStorage.setItem('playerId-' + gameId, playerId);
    renderPlayerView();
    if (currentGameState && currentGameState.gameId === gameId) { updatePlayersList(); }
  }

  function leaveGame(gameId) {
    localStorage.removeItem('playerId-' + gameId);
    renderPlayerView();
  }

  function buildNightOrder(evilKeys, villageKeys, neutralKeys) {
    var allKeys = evilKeys.concat(villageKeys).concat(neutralKeys);
    var unique = {};
    allKeys.forEach(function(k) { unique[k] = true; });
    var actingRoles = [];
    for (var k in unique) {
      if (ROLES[k] && ROLES[k].nightOrder < 99) { actingRoles.push(k); }
    }
    actingRoles.sort(function(a, b) { return ROLES[a].nightOrder - ROLES[b].nightOrder; });
    return actingRoles;
  }

  function renderResult(count, evilKeys, villageKeys, neutralKeys) {
    document.getElementById("resultTitle").textContent = count + " Players — Card Setup";
    document.getElementById("resultSub").textContent = "Deal cards face-down. Use reroll for different setup.";
    document.getElementById("result").style.display = "block";
    var roleList = document.getElementById("roleList");
    roleList.innerHTML = "";
    function tally(keys) {
      var map = {}, order = [];
      keys.forEach(function(k) {
        if (!map[k]) { map[k] = 0; order.push(k); }
        map[k]++;
      });
      return order.map(function(k){ return { key:k, qty:map[k] }; });
    }
    var sections = [
      { items: tally(evilKeys),    team:"evil"    },
      { items: tally(villageKeys), team:"village" },
      { items: tally(neutralKeys), team:"neutral" }
    ];
    var evilCount = 0, villageCount = 0, neutralCount = 0;
    sections.forEach(function(sec) {
      sec.items.forEach(function(entry) {
        var r = ROLES[entry.key];
        if (!r) return;
        var row  = document.createElement("div"); row.className  = "role-row";
        var left = document.createElement("div"); left.className = "role-left";
        var tag  = document.createElement("span"); tag.className  = "tag tag-" + r.team; tag.textContent = r.tag;
        var name = document.createElement("span"); name.className = "role-name"; name.textContent = r.name;
        var desc = document.createElement("span"); desc.className = "role-desc"; desc.textContent = r.desc;
        var cnt  = document.createElement("span"); cnt.className  = "role-count"; cnt.textContent  = "×" + entry.qty;
        left.appendChild(tag); left.appendChild(name);
        row.appendChild(left); row.appendChild(desc); row.appendChild(cnt);
        roleList.appendChild(row);
        if (r.team === "evil")    evilCount    += entry.qty;
        if (r.team === "village") villageCount += entry.qty;
        if (r.team === "neutral") neutralCount += entry.qty;
      });
    });
    var summary = document.getElementById("summary");
    summary.innerHTML =
      '<span class="sum-evil">Evil: ' + evilCount + '</span>' +
      '<span class="sum-village">Village: ' + villageCount + '</span>' +
      (neutralCount ? '<span class="sum-neutral">Third Party: ' + neutralCount + '</span>' : '') +
      '<span style="color:#888;font-family:sans-serif;">Total: ' + count + '</span>';
    var nightOrder = buildNightOrder(evilKeys, villageKeys, neutralKeys);
    var nightSection = document.getElementById("nightSection");
    nightSection.innerHTML = "";
    if (nightOrder.length > 0) {
      var nightTitle = document.createElement("div");
      nightTitle.style.cssText = "font-size:12px;font-weight:bold;text-transform:uppercase;margin-top:16px;margin-bottom:8px;color:#555;";
      nightTitle.textContent = "Night Order";
      nightSection.appendChild(nightTitle);
      nightOrder.forEach(function(roleKey, idx) {
        var r = ROLES[roleKey];
        var step = document.createElement("div");
        step.style.cssText = "display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-left:3px solid #999;background:#f9f9f9;font-size:11px;border-radius:3px;margin-bottom:6px;";
        step.innerHTML = '<span style="font-weight:bold;color:#666;min-width:20px;">' + (idx+1) + '.</span>' +
                         '<span style="font-weight:bold;">' + r.name + ':</span>' +
                         '<span style="color:#555;flex:1;">' + NIGHT_ACTIONS[r.nightOrder] + '</span>';
        nightSection.appendChild(step);
      });
    }
  }

  function init() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('game')) { switchTab('player'); renderPlayerView(); }
    
    var btnRow = document.getElementById("btnRow");
    if (btnRow) {
      [6,7,8,9,10,11,12,13,14].forEach(function(n) {
        var b = document.createElement("button");
        b.className = "btn"; b.textContent = n;
        b.onclick = function() {
          document.querySelectorAll(".btn").forEach(function(x){ x.classList.remove("active"); });
          b.classList.add("active");
          currentCount = n;
          generate(n);
          document.getElementById("generateBtn").style.display = "inline-block";
          document.getElementById("rerollBtn").style.display = "inline-block";
        };
        btnRow.appendChild(b);
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</head>
<body>
  <h1>Ultimate Werewolf</h1>
  <p class="subtitle">Digital Setup Generator</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('moderator')">📋 Setup Game</button>
    <button class="tab-btn" onclick="switchTab('player')">👤 Join Game</button>
  </div>

  <!-- Moderator Panel -->
  <div id="moderator" class="tab-content active setup-panel">
    <p class="note">🎲 Moderator: Generate a setup and share the link with players</p>

    <div class="input-section">
      <span class="input-label">How many players? (excluding Moderator)</span>
      <div class="btn-row" id="btnRow"></div>
    </div>

    <div>
      <button class="action-btn action-btn-green" onclick="generateGame()" style="display:none" id="generateBtn">✓ Create Game Link</button>
      <button class="action-btn" id="rerollBtn" onclick="reroll()" style="display:none">↻ Reroll Setup</button>
    </div>

    <div id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      
      <div class="share-box">
        <div class="share-label">Shareable Link (send to players)</div>
        <div class="share-link" id="shareLink"></div>
        <div class="share-buttons">
          <button onclick="copyToClipboard()">📋 Copy</button>
          <button onclick="shareViaURL()">🔗 Share</button>
        </div>
      </div>

      <div id="roleList"></div>
      <div class="summary" id="summary"></div>
      <div id="nightSection"></div>
    </div>

    <div id="modView"></div>
  </div>

  <!-- Player Panel -->
  <div id="player" class="tab-content player-panel">
    <p class="note">👤 Player: Enter your name to see your assigned role</p>
    <div id="playerView"></div>
  </div>
</body>
</html>
