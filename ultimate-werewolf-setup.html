function encodeGameState(gs) {
  var stateStr = JSON.stringify({r:gs.roles,c:gs.count,e:gs.evil,v:gs.village,n:gs.neutral,b:gs.balance,id:gs.id});
  return btoa(stateStr).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

function decodeGameState(encoded) {
  try {
    var padded = encoded + '=='.substr(0,(4-encoded.length%4)%4);
    var stateStr = atob(padded.replace(/-/g,'+').replace(/_/g,'/'));
    var data = JSON.parse(stateStr);
    return {id:data.id||'shared',count:data.c,players:{},roles:data.r,availableRoles:data.r.slice(),evil:data.e,village:data.v,neutral:data.n,balance:data.b};

function randomizeRoles(evilCount, villageCount, neutralCount) {
  // Get all available roles by team
  var allEvil = [], allVillage = [], allNeutral = [];
  for(var key in ROLES) {
    if(ROLES[key].t === 'evil') allEvil.push(key);
    else if(ROLES[key].t === 'village') allVillage.push(key);
    else if(ROLES[key].t === 'neutral') allNeutral.push(key);

  // Fisher-Yates shuffle
  function shuffle(arr) {
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = a[i];
      a[i] = a[j];
      a[j] = temp;
    }
    return a;

  var shuffledVillage = shuffle(allVillage).slice(0, villageCount);

  var hasCoreWolf = false;
  for(var i = 0; i < shuffledEvil.length; i++) {
    if(coreWolves.indexOf(shuffledEvil[i]) !== -1) {

  if(!hasCoreWolf && evilCount > 0) {
    // Replace first evil role with a random core wolf
    var randomCoreWolf = coreWolves[Math.floor(Math.random() * coreWolves.length)];
    shuffledEvil[0] = randomCoreWolf;
  }
  
  return {e: shuffledEvil, v: shuffledVillage, n: shuffledNeutral};
}

function rerollGameRoles() {
  if(!gameState) return;
  var originalPool = POOLS[gameState.count];
  var evilCount = originalPool.e.length;
  var villageCount = originalPool.v.length;
  var neutralCount = (originalPool.n || []).length;
  
  // Get randomized roles
  var pool = randomizeRoles(evilCount, villageCount, neutralCount);
  var roles = pool.e.concat(pool.v).concat(pool.n || []);
  
  // IMPROVEMENT 4: Add 3 extra roles for bluffing
  var extraRoleCount = Math.min(3, Math.floor(roles.length * 0.3));
  for(var i = 0; i < extraRoleCount; i++) {
    var randomRoleKey = roles[Math.floor(Math.random() * roles.length)];
    roles.push(randomRoleKey);
  }
  
  var balance = 0;
  for(var i = 0; i < roles.length; i++) { balance += ROLES[roles[i]].w; }
  
  // IMPROVEMENT 1 & 2: Reset available roles for reroll
  var shuffledRoles = roles.slice();
  for(var i = shuffledRoles.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = shuffledRoles[i];
    shuffledRoles[i] = shuffledRoles[j];
    shuffledRoles[j] = temp;
  }
  
  gameState.roles = roles;
  gameState.availableRoles = shuffledRoles;
  gameState.evil = pool.e.length;
  gameState.village = pool.v.length;
  gameState.neutral = (pool.n||[]).length;
  gameState.balance = balance;
  gameState.players = {}; // Reset players on reroll
  
  console.log("Rerolled roles:", roles, "Available:", shuffledRoles.length);
  localStorage.setItem("game-"+gameState.id, JSON.stringify(gameState));
  showSetup(pool);
}

function setupGame(count) {
  var pool = JSON.parse(JSON.stringify(POOLS[count]));
  var roles = pool.e.concat(pool.v).concat(pool.n || []);
  
  // IMPROVEMENT 4: Add 3 extra roles for bluffing (more roles than players)
  var extraRoleCount = Math.min(3, Math.floor(roles.length * 0.3)); // Add 30% more roles
  for(var i = 0; i < extraRoleCount; i++) {
    var randomRoleKey = roles[Math.floor(Math.random() * roles.length)];
    roles.push(randomRoleKey);
  }
  
  var balance = 0;
  for(var i = 0; i < roles.length; i++) { balance += ROLES[roles[i]].w; }
  
  // IMPROVEMENT 1 & 2: Track assigned roles to prevent duplicates and race conditions
  var availableRoles = roles.slice(); // Copy array
  var shuffledRoles = availableRoles.slice();
  for(var i = shuffledRoles.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = shuffledRoles[i];
    shuffledRoles[i] = shuffledRoles[j];
    shuffledRoles[j] = temp;
  }
  
  gameState = {id:"uw-"+Date.now(),count:count,players:{},roles:roles,availableRoles:shuffledRoles,assignedRoles:{},evil:pool.e.length,village:pool.v.length,neutral:(pool.n||[]).length,balance:balance};
  
  // This is the moderator creating a game
  isModeratorView = true;
  
  // Save to Supabase (async, no await)
  if(supabase || SUPABASE_KEY) {
    console.log("Saving game to Supabase:", gameState.id);
    supabaseInsertGame({
      id: gameState.id,
      count: count,
      roles: JSON.stringify(roles),
      evil: pool.e.length,
      village: pool.v.length,
      neutral: pool.n ? pool.n.length : 0,
      balance: balance
    }).catch(function(error) {
      console.error("Error creating game:", error);
    });
  }
  
  // Also save to localStorage for offline fallback
  localStorage.setItem("game-"+gameState.id, JSON.stringify(gameState));
  localStorage.setItem("game-shared", JSON.stringify(gameState));
  
  showSetup(pool);
  subscribeToPlayers();
}

function showSetup(pool) {
  var html = "<h3 style='margin-bottom:12px;'>"+gameState.count+" Players (Balance: "+(gameState.balance>=0?"+":"")+gameState.balance+")</h3>";
  html += "<div class='summary'><span class='tag tag-evil'>Evil: "+gameState.evil+"</span><span class='tag tag-village'>Village: "+gameState.village+"</span>";
  if(gameState.neutral > 0) html += "<span class='tag tag-neutral'>Neutral: "+gameState.neutral+"</span>";
  html += "</div>";
  
  html += "<h4 style='margin:16px 0 12px;'>Roles in this game:</h4>";
  for(var i = 0; i < gameState.roles.length; i++) {
    var rk = gameState.roles[i];
    var r = ROLES[rk];
    html += "<div class='role-row'><div class='role-row-emoji'>"+r.e+"</div><div class='tag tag-"+r.t+"'>"+r.t.toUpperCase().substr(0,3)+"</div><div class='role-name'>"+r.n+"</div><div class='role-desc'>"+r.d+"</div></div>";
  }
  
  var nightRoles = [];
  for(var i = 0; i < gameState.roles.length; i++) {
    if(ROLES[gameState.roles[i]].no < 99) {
      nightRoles.push(gameState.roles[i]);
    }
  }
  
  if(nightRoles.length > 0) {
    nightRoles.sort(function(a,b){return ROLES[a].no - ROLES[b].no;});
    html += "<div class='night-order'><div style='font-weight:bold;margin-bottom:8px;'>Night Order (Who wakes when):</div>";
    for(var i = 0; i < nightRoles.length; i++) {
      var rk = nightRoles[i];
      var r = ROLES[rk];
      html += "<div class='night-step'><strong>"+r.no+".</strong> <strong>"+r.n+":</strong> "+NIGHT_ACTIONS[r.no]+"</div>";
    }
    html += "</div>";
  }
  
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  html += "<div class='share-box' style='display:block;'><div style='font-size:11px;font-weight:bold;margin-bottom:6px;'>SHARE THIS LINK WITH PLAYERS:</div><div class='share-link'>"+url+"</div>";
  html += "<button class='action-btn' onclick='copyLink()'>Copy</button> ";
  if(navigator.share) {
    html += "<button class='action-btn' onclick='shareLink()'>Share</button>";
  }
  html += "</div>";
  
  // IMPROVEMENT 3: Show all connected players up to game count
  html += "<h4 style='margin:16px 0 12px;'>Connected Players ("+Object.keys(gameState.players).length+"/"+gameState.count+")</h4>";
  if(Object.keys(gameState.players).length > 0) {
    html += "<div class='players-list'>";
    var playerCount = 0;
    for(var pid in gameState.players) {
      if(playerCount >= gameState.count) break; // Don't show more than game count
      var p = gameState.players[pid];
      var r = ROLES[p.role];
      html += "<div class='player-item'><div><div class='player-item-emoji'>"+r.e+"</div><div><strong>"+p.name+"</strong><div style='font-size:10px;color:#666;'>"+r.n+"</div></div></div><span class='tag tag-"+r.t+"'>"+r.t+"</span></div>";
      playerCount++;
    }
    html += "</div>";
  } else {
    html += "<div style='padding:20px;text-align:center;color:#888;'>Waiting for players...</div>";
  }
  
  var btns = "<button class='action-btn action-btn-green' onclick='refreshPlayers()'>Refresh Players</button> ";

  btns += "<button class='action-btn' onclick='rerollGameRoles()'>Reroll Setup</button> ";
  btns += "<button class='action-btn' onclick='endGame()' style='border-color:#c0392b;color:#c0392b;'>End Game</button>";
  
  document.getElementById("result").innerHTML = html + "<div style='margin-top:16px;'>"+btns+"</div>";
  document.getElementById("result").style.display = "block";
}

function refreshPlayers() {
  if(!gameState || !gameState.id) return;
  
  console.log("Refreshing players for game:", gameState.id);
  
  // Helper function to show the updated player list
  var showUpdatedList = function() {
    var pool = POOLS[gameState.count];
    showSetup(pool);
  };
  
  if(supabase || SUPABASE_KEY) {
    // Try to fetch fresh data from Supabase (priority)
    supabaseSelectPlayers(gameState.id).then(function(response) {
      var data = response.data;
      var error = response.error;
      
      console.log("Supabase fetch response:", {hasData: !!data, error: error, count: data ? data.length : 0});
      
      if(error || !data || data.length === 0) {
        console.log("Supabase returned no players, falling back to localStorage");
        // Fall back to localStorage if Supabase fails or returns empty
        var gameKey = "game-"+gameState.id;
        var stored = localStorage.getItem(gameKey);
        if(stored) {
          try {
            gameState = JSON.parse(stored);
          } catch(e) {
            console.error("Failed to parse localStorage:", e);
          }
        }
      } else if(Array.isArray(data)) {
        // Rebuild gameState.players from Supabase data
        gameState.players = {};
        console.log("Found "+data.length+" players from Supabase");
        for(var i = 0; i < data.length; i++) {
          gameState.players[data[i].id] = {name: data[i].name, role: data[i].role};
        }
        
        // Also update localStorage so other tabs see it
        var gameKey = "game-"+gameState.id;
        localStorage.setItem(gameKey, JSON.stringify(gameState));
      }
      
      showUpdatedList();
    }).catch(function(error) {
      console.error("Error fetching from Supabase:", error);
      // Fall back to localStorage if Supabase fetch fails
      var gameKey = "game-"+gameState.id;
      var stored = localStorage.getItem(gameKey);
      if(stored) {
        try {
          gameState = JSON.parse(stored);
        } catch(e) {
          console.error("Failed to parse localStorage:", e);
        }
      }
      showUpdatedList();
    });
  } else {
    console.log("Supabase not available - using localStorage only");
    // Fall back to localStorage if Supabase not available
    var gameKey = "game-"+gameState.id;
    var stored = localStorage.getItem(gameKey);
    if(stored) {
      try {
        gameState = JSON.parse(stored);
      } catch(e) {
        console.error("Failed to parse localStorage:", e);
      }
    }
    showUpdatedList();
  }
}

function subscribeToPlayers() {
  if(!gameState || !gameState.id) return;
  
  // Start auto-refresh polling only for moderators (every 2 seconds)
  if(isModeratorView) {
    console.log("Starting auto-polling for moderator (2s interval)");
    if(autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
    }
    autoRefreshTimer = setInterval(function() {
      refreshPlayers();
    }, 2000);
  }
  
  // Also try Supabase real-time subscription if SDK is available
  if(!supabase) {
    console.log("Supabase SDK not available, using polling only");
    return;
  }
  
  // Unsubscribe from previous subscription
  if(playersSubscription) {
    playersSubscription.unsubscribe();
  }
  
  // Subscribe to real-time updates
  try {
    playersSubscription = supabase
      .channel('players-'+gameState.id)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'players',
        filter: 'game_id=eq.'+gameState.id
      }, (payload) => {
        console.log("Player update received:", payload);
        if(isModeratorView) {
          refreshPlayers();
        }
      })
      .subscribe();
  } catch(err) {
    console.error("Could not subscribe to real-time:", err);
  }
}

function endGame() {
  if(confirm("End this game? Players will no longer be able to join.")) {
    if(gameState && gameState.id) {
      // Stop auto-refresh polling
      if(autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
      
      // Delete from Supabase (async, no await)
      if(supabase) {
        supabase.from('games').delete().eq('id', gameState.id).catch(function(error) {
          console.error("Error ending game:", error);
        });
      }
      
      // Also clear localStorage
      localStorage.removeItem("game-"+gameState.id);
      localStorage.removeItem("game-shared");
      
      if(playersSubscription) {
        playersSubscription.unsubscribe();
      }
    }
    gameState = null;
    document.getElementById("result").innerHTML = "<div class='warning'>Game ended. Create a new one to play again.</div>";
    document.getElementById("result").style.display = "block";
  }
}

function copyLink() {
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  navigator.clipboard.writeText(url).then(function() { alert("Link copied!"); });
}

function shareLink() {
  var encoded = encodeGameState(gameState);
  var url = window.location.origin + window.location.pathname + "?g=" + encoded;
  navigator.share({title:"Werewolf Game",url:url});
}

function showPlayerView() {
  var params = new URLSearchParams(window.location.search);
  var gid = params.get("g") || params.get("game");
  var html = "";
  if(!gid) {
    html = "<p style='color:#888;'>Ask moderator for game link</p>";
  } else {
    var g = null;
    var actualGameId = null; // Track actual game ID for comparison
    
    if(params.get("g")) {
      g = decodeGameState(gid);
      if(g) {
        actualGameId = g.id; // Extract actual game ID from decoded state
      }
    } else if(params.get("game")) {
      actualGameId = gid; // For ?game= links, gid IS the actual game ID
      var gameKey = "game-"+gid;
      var stored = localStorage.getItem(gameKey);
      if(stored) { 
        g = JSON.parse(stored); 
      } else {
        g = null;
      }
    }
    
    if(!g) {
      html = "<p style='color:#c0392b;font-weight:bold;'>Game link invalid or expired</p><p style='color:#888;font-size:11px;'>Ask moderator to create a new game and send the link</p>";
    } else {
      var stored = localStorage.getItem("game-shared");
      if(stored) { 
        var parsedShared = JSON.parse(stored);
        // Only use if from same game
        if(parsedShared.id === actualGameId) {
          g = parsedShared;
        }
      }
      var pid = localStorage.getItem("pid-shared");
      
      // FRESH GAME CHECK: If player was in a different game, show join form again
      var prevGameId = localStorage.getItem("prev-game-id");
      if(pid && prevGameId && actualGameId && prevGameId !== actualGameId) {
        // Different game detected - clear old session for fresh start
        console.log("Player switching games: " + prevGameId + " -> " + actualGameId);
        pid = null; // Force them to rejoin as fresh player
        localStorage.removeItem("pid-shared");
        localStorage.removeItem("game-shared");
      }
      
      if(!pid || !g.players[pid]) {
        html = "<input type='text' class='player-name-input' id='pname' placeholder='Your name'>";
        html += "<button class='action-btn action-btn-green' onclick='joinGame(\""+gid+"\")'>Join Game</button>";
      } else {
        var p = g.players[pid];
        var r = ROLES[p.role];
        if(!r) {
          html = "<p style='color:#c0392b;'>ERROR: Role not found for " + p.role + "</p>";
        } else {
          var cardClass = r.t === "evil" ? "role-card-evil" : (r.t === "village" ? "role-card-village" : "role-card-neutral");
          var teamLabel = r.t === "evil" ? "🔴 EVIL SIDE" : (r.t === "village" ? "🟢 VILLAGE SIDE" : "🟣 NEUTRAL");
          html = "<div class='role-card "+cardClass+"'>";
          html += "<div style='font-size:14px;margin-bottom:8px;'>👤 "+p.name+"</div>";
          html += "<div class='role-emoji'>"+r.e+"</div>";
          html += "<h2>"+r.n+"</h2>";
          html += "<div class='team-badge'>"+teamLabel+"</div>";
          html += "<div class='description'>"+r.d+"</div>";
          html += "<button class='action-btn' style='background:#fff;color:#333;margin-top:20px;' onclick='leaveGame(\"shared\")'>Leave Game</button>";
          html += "</div>";
        }
      }
    }
  }
  document.getElementById("playerView").innerHTML = html;
}

function joinGame(gid) {
  var name = document.getElementById("pname").value.trim();
  if(!name) { alert("Enter your name"); return; }
  
  var g = null;
  var params = new URLSearchParams(window.location.search);
  var actualGameId = null;
  
  // STEP 1: Extract the actual game ID from URL
  if(params.get("g")) {
    // Decode URL state to get the actual game ID
    var decodedUrlState = decodeGameState(gid);
    if(decodedUrlState) {
      actualGameId = decodedUrlState.id;
    }
  } else if(params.get("game")) {
    actualGameId = gid;
  }
  
  // STEP 2: FRESH GAME CHECK - If joining a different game, clear old player data
  var prevGameId = localStorage.getItem("prev-game-id");
  if(prevGameId && actualGameId && prevGameId !== actualGameId) {
    console.log("New game detected. Clearing old session: " + prevGameId + " -> " + actualGameId);
    localStorage.removeItem("game-shared");
    localStorage.removeItem("pid-shared");
  }
  
  // STEP 3: Try to get CURRENT game state from localStorage FIRST
  // This is CRITICAL - it has all players who already joined!
  if(actualGameId) {
    var gameKey = "game-" + actualGameId;
    var storedLatest = localStorage.getItem(gameKey);
    if(storedLatest) {
      try {
        g = JSON.parse(storedLatest);
        console.log("Using game state from localStorage with " + Object.keys(g.players).length + " players already joined");
      } catch(e) {
        console.error("Failed to parse stored game state:", e);
      }
    }
  }
  
  // STEP 4: If localStorage doesn't have it, fall back to URL decode or game-shared
  if(!g) {
    if(params.get("g")) {
      g = decodeGameState(gid);
      if(g) {
        console.log("Using game state from URL decode (fresh game, no players yet)");
      }
    } else if(params.get("game")) {
      var gameKey = "game-"+actualGameId;
      var stored = localStorage.getItem(gameKey);
      if(stored) { 
        g = JSON.parse(stored); 
      }
    }
  }
  
  if(!g) { alert("Game link invalid"); return; }
  
  // CRITICAL FIX: Always find the first unassigned role by checking ALL current players
  // This prevents duplicate role assignments when multiple players join in parallel
  var assignedRole = null;
  var assignedRoles = {};
  
  // Build map of all roles currently assigned to other players
  for(var pid_key in g.players) {
    if(g.players[pid_key] && g.players[pid_key].role) {
      assignedRoles[g.players[pid_key].role] = true;
    }
  }
  
  // Find first unassigned role
  for(var i = 0; i < g.roles.length; i++) {
    if(!assignedRoles[g.roles[i]]) {
      assignedRole = g.roles[i];
      break;
    }
  }
  
  if(!assignedRole) {
    alert("Game is full! All roles have been assigned.");
    return;
  }
  
  var pid = "p"+Date.now();
  
  // This is a player joining, not moderator
  isModeratorView = false;
  
  // Save to localStorage with current game key so next player gets updated state
  g.players[pid] = {name:name, role:assignedRole};
  
  // SANITY CHECK 1: Verify player got added correctly
  if(!g.players[pid] || !g.players[pid].role) {
    alert("ERROR: Failed to assign role. Try again.");
    return;
  }
  
  // Use actual game ID for storage
  var gameKey = "game-" + g.id;
  localStorage.setItem(gameKey, JSON.stringify(g));
  localStorage.setItem("game-shared", JSON.stringify(g));
  localStorage.setItem("pid-shared", pid);
  localStorage.setItem("gid-shared", g.id);
  localStorage.setItem("prev-game-id", g.id); // Track current game for future joins
  
  // SANITY CHECK 2: Verify localStorage saved correctly
  var verifyGame = localStorage.getItem(gameKey);
  var verifyPid = localStorage.getItem("pid-shared");
  if(!verifyGame || !verifyPid) {
    console.error("SANITY CHECK FAILED: localStorage save failed");
    return;
  }
  
  var savedGame = JSON.parse(verifyGame);
  if(!savedGame.players[pid] || savedGame.players[pid].role !== assignedRole) {
    console.error("SANITY CHECK FAILED: Player data mismatch");
    return;
  }
  
  console.log("✅ SANITY CHECKS PASSED - Player joined:", {
    player_id: pid,
    name: name,
    role: assignedRole,
    game_id: g.id,
    total_players: Object.keys(g.players).length,
    game_size: g.count
  });
  
  // Try to save to Supabase if available
  if(supabase || SUPABASE_KEY) {
    console.log("Saving player to Supabase:", {player_id: pid, game_id: g.id, name: name});
    // Use timestamp as numeric ID (high enough to avoid collisions)
    var numericId = Math.floor(Date.now() / 1000) % 1000000;
    supabaseInsertPlayer({
      id: numericId,
      player_id: pid,
      game_id: g.id,
      name: name,
      role: assignedRole
    }).then(function(response) {
      console.log("Supabase insert response:", response);
      if(response.error) {
        console.error("Supabase error:", response.error);
      } else {
        console.log("✓ Player saved to Supabase successfully");
      }
    }).catch(function(error) {
      console.error("Error joining game on Supabase:", error);
    });
  } else {
    console.log("Supabase not available - only saved to localStorage");
  }
  
  showPlayerView();
}


function leaveGame(gid) {
  localStorage.removeItem("pid-shared");
  localStorage.removeItem("game-shared");
  localStorage.removeItem("gid-shared");
  showPlayerView();
}

document.getElementById("playerBtn").onclick = function() {

  document.getElementById("playerBtn").classList.add("active");
  document.getElementById("modBtn").classList.remove("active");

};

function initPage() {
  if(window.pageInitialized) return;
  window.pageInitialized = true;
  
  for(var i = 6; i <= 14; i++) {
    (function(n) {
      var b = document.createElement("button");
      b.className = "btn";
      b.textContent = n;
      b.onclick = function() {
        if(gameState) {
          if(!confirm("End current game and start new one?")) return;
          localStorage.removeItem("game-"+gameState.id);
        }
        document.querySelectorAll(".btn").forEach(function(x){x.classList.remove("active");});
        b.classList.add("active");
        setupGame(n);
      };
      document.getElementById("btnRow").appendChild(b);
    })(i);
  }
  
  var params = new URLSearchParams(window.location.search);
  if(params.get("g") || params.get("game")) {
    setTimeout(function(){
      document.getElementById("playerTab").classList.add("active");
      document.getElementById("modTab").classList.remove("active");
      document.getElementById("playerBtn").classList.add("active");
      document.getElementById("modBtn").classList.remove("active");
      showPlayerView();
    }, 50);
  }
}

// Initialize page UI
if(document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initPage);
} else {
  initPage();
}
