<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultimate Werewolf</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; font-size: 14px; color: #1a1a1a;
      background: radial-gradient(ellipse at top, #2b2b3a 0%, #0f0f18 100%);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px; color: #eee; }
    h1 { font-size: 26px; margin-bottom: 4px; color: #f5f5f0; text-shadow: 0 2px 10px rgba(255,107,107,0.4); }
    .subtitle { color: #b0b0c0; font-style: italic; font-size: 12px; margin-bottom: 18px; }
    .container { width: 100%; max-width: 720px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 20px; justify-content: center; }
    .tab-btn { padding: 10px 22px; border: 2px solid #444; border-radius: 8px; background: #1e1e2a;
      color: #ccc; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s; }
    .tab-btn:hover { border-color: #888; }
    .tab-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: rgba(255,255,255,0.97); color: #1a1a1a; border-radius: 12px;
      padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .card h3 { font-size: 18px; margin-bottom: 12px; }
    .card h4 { font-size: 14px; margin: 14px 0 8px; color: #444; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
    .count-btn { width: 52px; height: 52px; border: 2px solid #bbb; border-radius: 8px; background: #fff;
      font-weight: bold; cursor: pointer; font-size: 16px; font-family: Georgia; transition: all 0.2s; }
    .count-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .count-btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }

    .action-btn { padding: 10px 18px; margin: 4px; border: 2px solid #2b2b2b; border-radius: 8px;
      background: #fff; color: #2b2b2b; cursor: pointer; font-weight: bold; font-family: Georgia;
      font-size: 13px; transition: all 0.15s; }
    .action-btn:hover { background: #2b2b2b; color: #fff; transform: translateY(-1px); }
    .action-btn.primary { border-color: #27ae60; color: #fff; background: #27ae60; }
    .action-btn.primary:hover { background: #219150; }
    .action-btn.danger { border-color: #c0392b; color: #c0392b; }
    .action-btn.danger:hover { background: #c0392b; color: #fff; }
    .action-btn.warn { border-color: #f39c12; color: #f39c12; }
    .action-btn.warn:hover { background: #f39c12; color: #fff; }
    .action-btn.big { padding: 14px 28px; font-size: 15px; }

    .tag { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 4px; margin-right: 6px; font-weight: bold; letter-spacing: 0.5px; }
    .tag-evil { background: #fdecea; color: #c0392b; }
    .tag-village { background: #eafaf1; color: #27ae60; }
    .tag-neutral { background: #f5eef8; color: #8e44ad; }
    .tag-vampire { background: #f9e4e4; color: #8e0000; }

    .summary { display: flex; gap: 10px; justify-content: center; font-size: 12px; flex-wrap: wrap; margin: 12px 0; }
    .balance-pill { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold;
      background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
    .balance-pill.positive { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .balance-pill.negative { background: linear-gradient(135deg, #c0392b, #e74c3c); }

    .role-row { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
    .role-row:last-child { border-bottom: none; }
    .role-emoji { font-size: 30px; min-width: 44px; text-align: center; }
    .role-name { font-weight: bold; font-size: 14px; }
    .role-desc { font-size: 12px; color: #555; margin-top: 2px; }

    .night-order { background: #fff9e6; border: 1px solid #f39c12; border-radius: 8px; padding: 14px; margin: 12px 0; color: #1a1a1a; }
    .night-step { display: flex; gap: 10px; padding: 8px 10px; border-left: 3px solid #f39c12; margin-bottom: 6px; font-size: 12px; background: rgba(255,255,255,0.6); border-radius: 4px; }
    .night-step.done { opacity: 0.5; border-left-color: #27ae60; }
    .night-step.current { background: #fff3cd; border-left-color: #e67e22; border-left-width: 5px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

    .share-box { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border: 1px solid #64b5f6; border-radius: 8px; padding: 14px; margin: 12px 0; color: #0d47a1; }
    .share-link { background: #fff; border: 1px solid #90caf9; padding: 10px; font-family: monospace; font-size: 11px; word-break: break-all; margin-bottom: 8px; border-radius: 4px; }

    .player-name-input { font-size: 16px; padding: 12px; border: 2px solid #ddd; border-radius: 6px; width: 100%; max-width: 320px; margin-bottom: 12px; font-family: Georgia; }
    .player-name-input:focus { border-color: #667eea; outline: none; }

    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin: 12px 0; }
    .player-tile { background: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
    .player-tile.dead { opacity: 0.5; background: #f5f5f5; border-color: #ccc; }
    .player-tile.dead .player-tile-name { text-decoration: line-through; color: #888; }
    .player-tile-emoji { font-size: 24px; }
    .player-tile-name { font-weight: bold; font-size: 13px; color: #1a1a1a; }
    .player-tile-role { font-size: 10px; color: #666; }
    .player-tile-hidden { color: #999; font-style: italic; }
    .player-tile-kill { background: #fee; border: 1px solid #c0392b; color: #c0392b; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; margin-left: auto; }
    .player-tile-kill:hover { background: #c0392b; color: #fff; }
    .player-tile-revive { background: #efe; border: 1px solid #27ae60; color: #27ae60; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; margin-left: auto; }

    .swap-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .swap-modal { background: #fff; color: #1a1a1a; border-radius: 12px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: slideUp 0.2s ease; margin-bottom: 40px; }
    .swap-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
    .swap-header button { background: transparent; border: none; font-size: 26px; color: #888; cursor: pointer; line-height: 1; padding: 0 6px; }
    .swap-header button:hover { color: #c0392b; }
    .swap-body { padding: 20px; }
    .swap-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid #eee; background: #fafafa; border-radius: 0 0 12px 12px; }
    .swap-summary { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 10px 12px; background: #f5f5f0; border-radius: 8px; }
    .swap-side { flex: 1; min-width: 0; }
    .swap-lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .swap-role { font-size: 14px; margin-top: 2px; }
    .swap-arrow { font-size: 22px; color: #667eea; padding: 0 6px; }
    .swap-preview-card { background: #fafafa; border-left: 4px solid #667eea; padding: 14px; margin-top: 12px; border-radius: 6px; }
    .rip-entry { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; background: #fafafa; transition: background 0.15s; }
    .rip-entry:hover { background: #f0f0f5; }
    .rip-entry.rip-evil { border-left: 4px solid #c0392b; }
    .rip-entry.rip-village { border-left: 4px solid #27ae60; }
    .rip-entry.rip-neutral { border-left: 4px solid #8e44ad; }
    .rip-entry.rip-vampire { border-left: 4px solid #8e0000; }
    .rip-head { display: flex; gap: 10px; align-items: center; }
    .rip-emoji { font-size: 26px; min-width: 34px; text-align: center; }
    .rip-name { font-weight: bold; font-size: 15px; color: #1a1a1a; }
    .rip-short { font-size: 13px; color: #333; margin-top: 4px; line-height: 1.5; }
    .rip-hint { font-size: 10px; color: #888; margin-top: 6px; font-style: italic; }
    .rip-caret { color: #999; transition: transform 0.2s; margin-left: 8px; }
    .rip-entry.open .rip-caret { transform: rotate(180deg); }
    .rip-long { font-size: 12px; color: #444; line-height: 1.6; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; display: none; }
    .rip-entry.open .rip-long { display: block; }
    .rip-entry.open .rip-hint { display: none; }
    /* Neutral card background for ALL teams — color must NOT leak a player's alignment
       to anyone glancing at their screen. Every role card looks identical from a distance. */
    .role-card { background: linear-gradient(135deg, #3a3a52 0%, #55556e 100%); color: #fff; border-radius: 16px;
      padding: 40px 30px; margin: 20px 0; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: slideUp 0.6s ease; }
    .role-card-evil,
    .role-card-village,
    .role-card-neutral,
    .role-card-vampire { background: linear-gradient(135deg, #3a3a52 0%, #55556e 100%); }
    .role-card-big-emoji { font-size: 90px; margin: 20px 0; animation: bounce 2.5s infinite; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .role-card h2 { font-size: 34px; margin: 12px 0; font-weight: bold; text-shadow: 2px 2px 8px rgba(0,0,0,0.4); }
    .role-card .team-badge { display: inline-block; font-size: 12px; padding: 8px 18px; background: rgba(255,255,255,0.25);
      border-radius: 20px; margin: 8px 0 16px; font-weight: bold; letter-spacing: 1px; }
    .role-card .short-desc { font-size: 15px; margin: 12px 0; font-weight: bold; line-height: 1.5; }
    .role-card .long-desc { font-size: 12px; margin: 20px 0 12px; line-height: 1.7; text-align: left;
      background: rgba(0,0,0,0.18); padding: 14px; border-radius: 8px; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes reveal { 0% { filter: blur(20px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }

    .warning { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #856404; font-size: 12px; }
    .info { background: #e3f2fd; border: 1px solid #64b5f6; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #0d47a1; font-size: 12px; }
    .error { background: #fdecea; border: 1px solid #c0392b; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #c0392b; font-size: 12px; }

    .phase-banner { text-align: center; padding: 16px; border-radius: 10px; margin-bottom: 16px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
    .phase-night { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; }
    .phase-day { background: linear-gradient(135deg, #f9d423, #ff9068); color: #1a1a1a; }
    .phase-lobby { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #1a1a1a; }

    .day-counter { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px; margin-left: 10px; font-size: 14px; }

    .lobby-status { background: linear-gradient(135deg, #f9f9f9, #e8e8e8); padding: 20px; text-align: center; border-radius: 10px; color: #333; font-size: 14px; }
    .waiting-dots::after { content: '...'; animation: pulse 1.5s infinite; }

    .win-check { padding: 12px; background: #e8f5e9; border-left: 4px solid #27ae60; margin: 10px 0; border-radius: 4px; font-size: 13px; }
    .win-check.evil { background: #ffebee; border-left-color: #c0392b; }
    .win-check.neutral { background: #f3e5f5; border-left-color: #8e44ad; }

    .toggle-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }

    @media (max-width: 500px) {
      .role-card { padding: 28px 18px; }
      .role-card h2 { font-size: 26px; }
      .role-card-big-emoji { font-size: 70px; }
      .players-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <h1>🐺 Ultimate Werewolf</h1>
  <p class="subtitle">Digital moderator &amp; role dealer</p>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="modBtn">📋 Moderator</button>
      <button class="tab-btn" id="playerBtn">👤 Join Game</button>
    </div>

    <div id="modTab" class="tab-content active">
      <div id="modView"></div>
    </div>
    <div id="playerTab" class="tab-content">
      <div id="playerView"></div>
    </div>
  </div>

  <script>
// ============================================================
// CONFIG
// ============================================================
var API_BASE = "https://api.gathr.lol/ultimate-werewolf";

// ============================================================
// ROLE DATA
// ============================================================
var ROLES = {
// ============ EVIL / WOLF TEAM ============
werewolf:{n:"Werewolf",t:"evil",w:-6,no:1,d:"Each night, prowl with the pack and devour one villager.",ld:"When the moon rises, you slip from your bed and hunt beside your kin. Speak lightly during the day, vote scattered early, then coordinate silently as suspicion grows. Your greatest enemies are information roles — Seer, Fortune Teller, Doctor — hunt them first before their light reveals your den. Betray no tell, and the village will devour itself.",e:"🐺"},
alphawolf:{n:"Alpha Wolf",t:"evil",w:-7,no:2,d:"Leader of the pack. Once per game, convert a villager into a fellow wolf.",ld:"You are the beast that leads. Every night you feed with the pack, but once during the game you may sink your fangs into a villager and turn them — permanently swelling your ranks and shattering the village's mathematics. Use it when suspicion falls on a wolf and the game hangs in balance. Reveal too soon and the village will impale you before you can bite.",e:"👑"},
wolfcub:{n:"Wolf Cub",t:"evil",w:-6,no:1,d:"Small and vulnerable — but if lynched, the pack kills TWO the next night.",ld:"You are the pup the pack will die to protect. Your greatest weapon is your fragility: if the village foolishly lynches you, the wolves grow enraged and tear apart two victims the following night instead of one. Bait the village, let them think you're the easy kill — and watch the pack feast.",e:"🐶"},
minion:{n:"Minion",t:"evil",w:-5,no:3,d:"You know every werewolf. They do not know you.",ld:"You are the whisper in the wolves' shadow — a traitor in the village's heart. You see them, but they see only a villager. Coordinate through voting patterns and strategic sacrifices: throw a suspicious vote at a wolf early to build trust, then guide the mob toward Seers and Doctors. Die for the pack. The wolves' win is your win, even if you never speak a word to them.",e:"🤝"},
sorceress:{n:"Sorceress",t:"evil",w:-3,no:4,d:"Each night, point at a player — learn whether they are the Seer.",ld:"Your dark magic senses the Seer's aura from across the table. Each night you may point at one player and learn if they carry the Seer's gift. Feed this to the wolves and they will devour the village's brightest light before it can illuminate the truth.",e:"🔮"},
sorcerer:{n:"Sorcerer",t:"evil",w:-4,no:27,d:"Corrupted seer — each night, learn if target is a wolf, a Seer, or nothing.",ld:"You wield twisted sight. Each night, you inspect one player and learn: they are a werewolf, they are the Seer, or your vision clouds and you learn nothing. Wolves know your face; you become their informant. Choose targets to give the pack the confirmation they need without accidentally exposing wolf identity to the village.",e:"🧙"},
shaman:{n:"Shaman",t:"evil",w:-4,no:19,d:"Dark magic user — join the werewolves' kill each night.",ld:"You are magic bent to evil. From the very first night, you rise with the pack and take part in every kill — your spellcraft blends with their fangs. Blend in during the day as a mystic villager and use the wolves' cover to strike.",e:"🧙‍♂️"},
wolfhound:{n:"Wolf Hound",t:"evil",w:-3,no:99,d:"An evil spy who knows ONE werewolf.",ld:"You are a hound at the wolves' heel — you learn the identity of one werewolf on the first night, but they don't know your face. Coordinate through voting patterns and subtle defenses. If your wolf falls, you must invent a new alliance on the fly. Wins with the wolves.",e:"🐕"},
dreamwolf:{n:"Dream Wolf",t:"evil",w:-6,no:1,d:"Sleeper wolf — activates only when the first werewolf dies.",ld:"You dream in the shadow of the pack, hidden even from the wolves themselves. You do not wake, do not kill, do not know the others. But the moment the first werewolf falls, your eyes snap open and you take their place in the hunt. The village kills a wolf and finds another has risen — chaos.",e:"😴"},
lonewolf:{n:"Lone Wolf",t:"evil",w:-5,no:1,d:"A wolf who wins ONLY if the last surviving evil is you.",ld:"You are pack, but not truly. Every night you kill with the wolves — but you win only if you are the last evil standing. Sometimes that means betraying your kin, letting them fall to buy your survival. A wolf with a knife pointed inward. Chaotic and dangerous — even to your own team.",e:"🐺"},
blackwolf:{n:"Black Wolf",t:"evil",w:-6,no:28,d:"A werewolf AND spellcaster — once per game, silence a player for a full day.",ld:"You combine two powers: at night you feed with the pack, but once during the game you may cast a spell of silence on any player, sealing their lips for an entire day phase. Use it to silence an accuser building momentum against a wolf, or to gag a Seer before they reveal.",e:"⚫"},
bigbadwolf:{n:"Big Bad Wolf",t:"evil",w:-7,no:29,d:"A fearsome wolf — kill adjacent players in combinations, not just one.",ld:"You are the pack's most fearsome. Instead of the usual one kill, you may target any combination of adjacent players in a single night. Wipe out entire flanks of the table when the village foolishly clusters together. Devastating in mid-game when trust groups sit side by side.",e:"😈"},
bogeyman:{n:"Bogeyman",t:"evil",w:-4,no:30,d:"Break ties for the wolves. Solo-win if every night-active role dies.",ld:"When the pack cannot agree on a victim, you decide for them — the tiebreaker in every kill. Additionally, your solo victory triggers when every player with a night action has died: even the wolves. You benefit from eliminating information roles AND from the wolves eventually devouring themselves.",e:"👹"},
fruitbrute:{n:"Fruit Brute",t:"evil",w:-4,no:31,d:"Cursed last wolf — must kill every night, or you starve and die.",ld:"You are the last of a cursed lineage. If you become the last werewolf alive, you become powerful — but you MUST kill each and every night. Miss even one and you starve; the curse consumes you. Late-game tension: the village learns to protect all remaining players and you scramble desperately to feed.",e:"🍃"},
wolfman:{n:"Wolf Man",t:"evil",w:-6,no:1,d:"Appear as an innocent villager to all Seers — secretly a wolf.",ld:"You wear a perfect mask. Every Seer, Fortune Teller, and Aura Seer sees only 'Villager' when they inspect you. Yet you rise with the pack each night and hunt. You are the wolf they will never believe is the wolf. Play the loudest villager at the table.",e:"🧛"},
whitewolf:{n:"White Wolf",t:"evil",w:-7,no:32,d:"Wake with wolves nightly. Every other night, kill anyone alone. Solo win.",ld:"You are legend and terror combined. You wake with the pack every night to communicate — but on alternating nights, you kill ALONE, choosing any target you wish (even a fellow wolf). Your win is solo: the last player alive. Betray the pack when the timing is right and rise from the massacre triumphant.",e:"⚪"},
amnesiac:{n:"Amnesiac",t:"evil",w:-1,no:99,d:"You forget your real role. The moderator tells you a fake one at start.",ld:"You awaken with no memory of who you are. The moderator whispers a role to you at the start — but it is a lie. Your true role is hidden. Play the fake convincingly; you win with whatever your true team is. The uncertainty is your torment and your camouflage.",e:"❓"},
vampire:{n:"Vampire",t:"vampire",w:-4,no:33,d:"Bite one player each night. If they're nominated the next day, they die.",ld:"You are a curse of the night, separate from the wolves entirely. Each night you sink your fangs into one victim. They do not die immediately — but if they are nominated for lynching the following day, they perish instantly from the venom in their veins. An independent evil with your own hunt.",e:"🧛"},
propagandist:{n:"Propagandist",t:"evil",w:-2,no:50,d:"Once per day, plant an anonymous rumor into village discussion.",ld:"You are the architect of lies. Once per day phase you may whisper a false rumor to the moderator, who will broadcast it anonymously to the village — 'someone heard so-and-so claim to be Seer.' The village cannot trace it back to you. Feed the pack targets by manufacturing suspicion.",e:"📰"},
conspirator:{n:"Conspirator",t:"evil",w:-3,no:51,d:"Silent wolf commander — you know all wolves; they don't know you.",ld:"You are the invisible general. You see every wolf in the game, but they see only a villager. Guide their strategy through voting theater: vote against a wolf publicly to build trust, then coordinate elimination targets through subtle patterns. When the village hunts obvious wolves, they miss the commander behind the curtain.",e:"🤐"},

// ============ VILLAGE / GOOD TEAM ============
seer:{n:"Seer",t:"village",w:5,no:5,d:"Each night, learn one player's TRUE role.",ld:"You are the village's brightest torch. Every night you point at one player and the moderator reveals their exact role. But knowledge is a curse: the moment wolves suspect you, they will tear you apart. Share findings as doubts, not certainties. Build allies. Establish a Seer succession. Every night alive is a gift; use it before the pack finds you.",e:"🔍"},
mysticseer:{n:"Mystic Seer",t:"village",w:6,no:5,d:"Enhanced Seer — learn one player's role AND another's alignment each night.",ld:"You are Seer twice over. Each night you may inspect one player and learn their exact role, AND look at a second and learn only their alignment (good/evil/neutral). Twice the data, twice the responsibility, twice the target on your back.",e:"🌟"},
appseer:{n:"Apprentice Seer",t:"village",w:3,no:99,d:"A hidden backup — become the Seer the moment the Seer dies.",ld:"You appear as a normal villager, but you carry a secret gift waiting to bloom. The moment the true Seer dies, you inherit their power on the very next night. The village keeps its light even after darkness. Reveal too early and the wolves will simply add you to their list.",e:"📚"},
beholder:{n:"Beholder",t:"village",w:3,no:34,d:"On night 1, learn who the Seer is.",ld:"You are the Seer's quiet ally. On the first night, the moderator shows you exactly which player is the Seer. You know who to defend, who to trust, who to guide. Reveal your role too early and the wolves target you both — you become a Seer beacon.",e:"👁️"},
mentalist:{n:"Mentalist",t:"village",w:4,no:7,d:"Each night, learn whether TWO players share the same team.",ld:"You read minds across the table. Each night, point at any two players and learn whether they are on the same team. A yes/no answer, but immensely powerful — pair a suspected wolf with a confirmed villager and watch the truth crystallize.",e:"🧠"},
auraseer:{n:"Aura Seer",t:"village",w:3,no:6,d:"Each night, sense a player's alignment (good, evil, or neutral).",ld:"You see the colors of souls. Each night you look at one player and learn their team — not their exact role, but whether they are good, evil, or something stranger. Less precise than a Seer, but a valuable second lens.",e:"✨"},
empath:{n:"Empath",t:"village",w:3,no:20,d:"Each night, sense the alignment of BOTH your neighbors.",ld:"You feel the auras beside you. Each night, learn the alignment of the players immediately to your left and right. If both are good, sit tight; if evil creeps near, sound the alarm. Convince the village to shift seats — become a walking radar.",e:"💫"},
pi:{n:"Private Investigator",t:"village",w:3,no:9,d:"Inspect 3 adjacent players — learn if ANY of them is evil.",ld:"You investigate in clusters. Each night, point at three consecutive players and the moderator tells you if at least one among them is evil. A binary answer over a triangle of suspicion. Perfect for narrowing wolf hiding spots quickly.",e:"🕵️"},
revealer:{n:"Revealer",t:"village",w:2,no:8,d:"Once per game, publicly reveal a player's true role for everyone.",ld:"You carry a single crystal that shatters secrets. Once during the game, you may flip a player's card face-up for the entire village to see. A gamble: reveal a wolf and swing the game; reveal a Seer and cost the village their light. Save it for a decisive moment.",e:"💎"},
witch:{n:"Witch",t:"village",w:4,no:10,d:"Two potions: one to heal (save a night's victim), one to kill (any player).",ld:"You brew in secret. You start with two potions — a golden vial that saves one victim from the wolves' fangs (used AFTER learning who they targeted), and a black vial that slays any player of your choice. Both are one-shot. Timing is everything: save too early, waste the vial; save too late, the wolves outmaneuver you.",e:"🧙‍♀️"},
doctor:{n:"Doctor",t:"village",w:4,no:21,d:"Each night, protect one player from the wolves' kill.",ld:"You are the village's shield. Each night, choose one player to guard. If the wolves target them, they survive till dawn. Vary your targets — predictable patterns get you eaten. Protecting yourself occasionally is fair play. When someone survives an attack, everyone knows there's a Doctor — and the pack will hunt you next.",e:"⚕️"},
hunter:{n:"Hunter",t:"village",w:3,no:99,d:"When you die, take one player down with you.",ld:"Your bow is drawn even in death. The moment you die — by wolves, by lynch, by any means — you may fire one final arrow at any living player, killing them instantly. Even the threat of your Hunter shot changes voting behavior. Paradoxically, more valuable alive as a deterrent than dead as a revenge.",e:"🏹"},
huntress:{n:"Huntress",t:"village",w:3,no:11,d:"Shoot once at night, and once more if voted out.",ld:"You are two arrows. Once during a night phase, you may shoot any player dead. Additionally, if you are lynched during the day, you get one final shot before you fall. Aggressive village firepower — the wolves will prioritize you accordingly.",e:"👩‍🦰"},
bodyguard:{n:"Bodyguard",t:"village",w:3,no:12,d:"Guard one player each night — reveal yourself to block a wolf kill.",ld:"You choose one player to guard each night. If wolves target your ward, you may reveal yourself as Bodyguard and take the blow — the ward survives, but you die instead. A sacrifice mechanic: use it wisely on high-value targets like a revealed Seer or a lynched-tomorrow suspect.",e:"🛡️"},
priest:{n:"Priest",t:"village",w:3,no:13,d:"Protect on odd-numbered nights (night 1, 3, 5, …). Rest between.",ld:"You bless in rhythm. On the first night, you may consecrate one player, granting them immunity. Then you rest a night. Then bless again. Alternating cadence — predictable but reliable. Wolves may target you or simply strike on your resting nights.",e:"🙏"},
spellcaster:{n:"Spellcaster",t:"village",w:1,no:14,d:"Once per game, silence a player for an entire day.",ld:"You know one binding spell. Once during the game, choose a player and seal their tongue: they cannot speak, vote, or accuse for the next day phase. Silence a suspected wolf before they can defend themselves, or gag a chaos-inducer at a critical moment.",e:"✋"},
cupid:{n:"Cupid",t:"village",w:3,no:15,d:"Night 1: designate two lovers. If one dies, the other dies too.",ld:"On the first night only, you point at two players and bind their fates. From that moment, if either dies — by lynch, by wolf, by any cause — the other's heart shatters and they die too. Bind wisely: two villagers grants stability; a wolf and villager creates chaos; two wolves is a gift to the village.",e:"💘"},
mason:{n:"Mason",t:"village",w:2,no:99,d:"Wake on night 1 with the other Masons. You know each other.",ld:"You are part of a sacred order. On the first night, you and any other Masons open your eyes together and confirm each other's identities — an instant trust circle. From that moment, you know at least one confirmed ally in the village. Guard the secret; wolves lynching a Mason kills a known-good.",e:"🪨"},
prince:{n:"Prince",t:"village",w:3,no:99,d:"First time you're voted for lynch — immune. But your role reveals.",ld:"You wear royal armor once. The first day the village votes to lynch you, the vote fails — your role is publicly revealed as Prince and you survive. From that point on, everyone knows you're a townsperson (a huge village win). But you also become a wolf target.",e:"👑"},
toughguy:{n:"Tough Guy",t:"village",w:3,no:99,d:"Survive the first wolf attack — but you'll die the following day.",ld:"You are hard to kill, but not immortal. When wolves first target you, you survive the night. However, come the next dusk, your wounds catch up and you die anyway. One extra day to help the village — use your final speech to accuse and inform.",e:"💪"},
diseased:{n:"Diseased",t:"village",w:3,no:99,d:"If wolves eat you, they sicken and skip the following night's kill.",ld:"Your blood is poison to the pack. If they choose to feed on you, they become ill and lose the next night's kill entirely. The village gains a free night of safety at the cost of your life — a superb passive protection.",e:"🦠"},
drunk:{n:"Drunk",t:"village",w:2,no:99,d:"You don't know your real role. On day 3, the moderator tells you.",ld:"You wake groggy with no memory of your card. For the first two days you play blind — you don't know your powers, so you can't use them (or you fake being a villager). On the morning of day 3, the moderator whispers your true role and you finally awaken to your gift.",e:"🍷"},
paranoid:{n:"Paranoid",t:"village",w:0,no:99,d:"Roleplay demands: you believe EVERYONE is a werewolf.",ld:"You suspect all. You must vocally suspect every player at some point, spreading distrust like a plague. You're actually a villager — but your paranoia may accidentally reveal wolves. Or accidentally lynch your friends. A comedy of errors and information.",e:"😰"},
gypsy:{n:"Gypsy",t:"village",w:2,no:22,d:"Each night, guess a player's role. The mod signals if you're right.",ld:"You read fortunes in the fire. Each night, you name a player and guess their role aloud (to the moderator). If correct, the moderator gives a subtle signal — a nod, a candle relit. Your accuracy grows over rounds as you triangulate.",e:"🔮"},
medium:{n:"Medium",t:"village",w:2,no:23,d:"Each night, commune with one dead player for a clue.",ld:"You speak to the fallen. Each night, choose a dead player; the moderator relays one whispered clue from them. The dead see all — but they can only whisper riddles, not names. Slow-building intelligence that pays off in late game.",e:"👻"},
jailer:{n:"Jailer",t:"village",w:3,no:24,d:"Each night, jail one player. They cannot act, but wolves can still kill them.",ld:"You keep a cell in your basement. Each night, drag one player behind bars — they cannot perform any night action (Seers can't see, killers can't kill). But the wolves still know where they are and can eat a jailed player. A double-edged blade.",e:"⛓️"},
pacifist:{n:"Pacifist",t:"village",w:-1,no:99,d:"You may not vote during any day. Wins with village.",ld:"You have taken a vow. You cannot vote during any day phase — your finger stays down when the mob raises theirs. You can still speak, accuse, and reason; you just cannot cast a ballot. A handicapped ally, but an eloquent one.",e:"☮️"},
old_man:{n:"Old Man",t:"village",w:2,no:99,d:"If wolves target you, you reveal your role publicly, then die.",ld:"You are old and frail. If the wolves attack you at night, you gasp your final words and reveal your role to the entire village before dying. Everyone learns 'Old Man died' — a small but real information transfer from beyond.",e:"👴"},
arsonist:{n:"Arsonist",t:"village",w:3,no:25,d:"Each night, douse a player in kerosene. If lynched, they burn AND you learn their role.",ld:"You paint the night in accelerant. Each night, choose a player and douse them with flammable liquid. Nothing happens — until they are lynched during a day phase. Then they combust: they die AND the moderator tells you their exact role first. Combines information with drama.",e:"🔥"},
vigilante:{n:"Vigilante",t:"village",w:2,no:26,d:"Once per game, at night, execute any player of your choice.",ld:"You are the village's private judge. Once during the game, on any night, you may kill any player. A single silver bullet. Miss and you help the wolves; hit and you may be the decisive strike. Carries emotional weight — you must be certain.",e:"🎯"},
count:{n:"The Count",t:"village",w:2,no:99,d:"Night 1: learn how many wolves are in each half of the table.",ld:"You count from the shadows. On the very first night, the moderator splits the table in two and tells you exactly how many wolves sit in each half. Powerful geographic intel — combined with alignments from Seers, wolves become findable within one night.",e:"🎩"},
villageIdiot:{n:"Village Idiot",t:"village",w:1,no:99,d:"You MUST cast a vote every single day phase. No abstaining.",ld:"You have opinions and you WILL be heard. You are compelled to vote every day, even when unsure. This forces information into the day: your patterns matter. A trusted Idiot's vote is credibility gold; a compromised one is a wolf tell.",e:"🤪"},
insomniac:{n:"Insomniac",t:"village",w:2,no:99,d:"You learn each morning which neighbors woke up during the night.",ld:"You never truly sleep. Each morning, the moderator tells you which of your immediate neighbors took a night action — Seers investigating, Doctors saving, wolves killing. Meta-knowledge: you know which seats are active without knowing who.",e:"😴"},
martyr:{n:"Martyr",t:"village",w:3,no:99,d:"When a player would die at night, you may take their place before reveal.",ld:"You throw yourself into fate's path. When the moderator is about to reveal a night's death, you may declare — you die instead, silently, and the original victim never knows they were targeted. Sacrifice for the village's most vital player.",e:"⚰️"},
mayor:{n:"Mayor",t:"village",w:3,no:99,d:"Reveal to double your vote weight for the rest of the game.",ld:"You wear the chain of office. At any point during the game, you may publicly reveal yourself as Mayor — from that moment, your vote counts as two. Reveal too early and wolves eat you; too late and the village lynches its own leader.",e:"🎖️"},
oldhag:{n:"Old Hag",t:"village",w:3,no:35,d:"Each night, curse a player to sit out of the next day's discussion.",ld:"You mutter incantations. Each night, choose one player and curse them — during the next day phase they must physically leave the table (or fall silent). They cannot vote, speak, or accuse. Silence a wolf, or silence someone you suspect of scheming.",e:"🧓"},
thing:{n:"Thing",t:"village",w:1,no:99,d:"Each night, silently tap a neighbor's shoulder — a wordless signal.",ld:"You are strange and mostly harmless. Each night, secretly tap one of your immediate neighbors. They know they've been tapped, but not by whom. A pure communication toy — establish signals with allies without alerting the pack.",e:"👆"},
villager:{n:"Villager",t:"village",w:1,no:99,d:"No powers. Vote, accuse, survive, and expose the wolves.",ld:"You are the salt of the earth — no gifts, no visions, no spells. Only your wits and your voice. Watch voting patterns like a hawk. Note who defends whom. Note who stays silent. The wolves live and die by their tells; be the villager who sees them.",e:"👨‍🌾"},
fortuneteller:{n:"Fortune Teller",t:"village",w:4,no:36,d:"Each night, learn one player's EXACT role — never fails.",ld:"Your crystal never lies. Each night, choose one player and learn their exact role with pinpoint accuracy. You are the Seer's more powerful cousin — never fooled, never misled by Lycans or Wolf Men. Correspondingly, you are the pack's top-priority target.",e:"🔮"},
amulet:{n:"Amulet Bearer",t:"village",w:3,no:99,d:"You cannot die while holding the amulet. Pass it each day, or lose it.",ld:"You carry an ancient talisman. As long as you hold the amulet, no attack — wolf, lynch, or otherwise — can kill you. But you must pass it to another living player at the end of each day, and it can only be worn once by any given person. Circulate immunity across the village.",e:"💍"},
lycan:{n:"Lycan",t:"village",w:-1,no:99,d:"You appear as a WEREWOLF to all Seers — but you're truly good.",ld:"You bear a curse without evil. Every Seer, Fortune Teller, and Aura Seer that inspects you sees only 'werewolf.' The village will hunt you. Your only hope is to convince them you're falsely accused before your own team lynches you. Roleplay a saint.",e:"🌙"},
orator:{n:"Orator",t:"village",w:2,no:40,d:"Once per game, your speech triggers TWO lynchings in a single day.",ld:"Your voice moves crowds. Once during the game, mid-day, unleash a powerful oration — the village will vote TWICE, eliminating two players in a single day phase instead of one. Save it for a moment of maximum chaos.",e:"🎤"},
lawyer:{n:"Lawyer",t:"village",w:3,no:41,d:"Each night, pick a client. If they're voted out next day, they survive.",ld:"You are institutional protection. Each night you select one client — if they receive the most votes the following day, the lynching is overturned and the next-highest instead. Wolves must burn votes on unimportant targets or expose their coordination.",e:"⚖️"},
gossip:{n:"Gossip",t:"village",w:2,no:42,d:"Each night, learn 2-3 random keywords from ongoing night discussions.",ld:"You eavesdrop through walls. Each night, the moderator gives you 2-3 random keywords or phrases from the night's role-communications ('kill', 'protect', 'seer', 'vision'). Patterns emerge over nights — 'salve' and 'brew' repeatedly = a Witch exists. Slow-burn intel.",e:"💬"},
advocate:{n:"Advocate",t:"village",w:2,no:43,d:"Once per game, veto a lynch — force a runoff between the top two.",ld:"You may intervene once. When votes are tallied and someone is about to be lynched, you may stand and veto — the vote becomes a sudden-death runoff between the top TWO vote-getters. A single, powerful save.",e:"📣"},
whistleblower:{n:"Whistleblower",t:"village",w:3,no:45,d:"Each night, publicly accuse a player of being a specific evil role.",ld:"You risk your reputation. Each night, name one player and publicly declare their role ('I say Alice is the werewolf'). If right, your credibility soars. If wrong, you are marked as unreliable — or possibly evil. High stakes.",e:"🔔"},
accuser:{n:"Accuser",t:"village",w:2,no:46,d:"When you nominate a player for lynch, your accusation counts as TWO votes.",ld:"Your finger carries weight. When you nominate a player for lynching during a day, your accusation counts as two votes toward that lynching. You are a swing hammer — use silence to build unpredictability, then break a coordinated wolf vote.",e:"👉"},
defender:{n:"Defender",t:"village",w:2,no:47,d:"Each day, grant one player immunity from being lynched.",ld:"You are a public shield. Each day phase, announce one player as defended. Any votes cast against them that day are nullified. Wolves must either eat you at night or waste day votes on unprotected targets.",e:"🛡️"},
chronicler:{n:"Chronicler",t:"village",w:2,no:49,d:"Once per game, reveal a full analysis of voting patterns.",ld:"You record every vote in secret ledgers. Once during the game, publicly reveal your analysis: 'Players X, Y, Z voted together on days 2, 4, and 6.' Statistical evidence of wolf coordination. Devastating late-game when wolves have grown careless.",e:"📊"},

// ============ NEW WIKI ROLES ============
piper:{n:"Flute Player",t:"neutral",w:-3,no:52,d:"Each night, charm two players. Solo-win when ALL living players are charmed.",ld:"Your enchanted melody creeps through the village. Each night, point at two players — they are secretly charmed (they don't know who or why). Charmed players know each other but keep it hidden. Your solo victory: charm every last living player. Neither wolves nor village win if you complete your song.",e:"🎼"},
fox:{n:"Fox",t:"village",w:3,no:53,d:"Each night, sniff 3 players. Learn if any wolf is among them.",ld:"Your keen nose finds evil in threes. Each night, point at three players. If any among them is a wolf, the moderator nods. If none are wolves, you lose your power forever — a used-up fox. A single big investigation, then a normal villager.",e:"🦊"},
bearTamer:{n:"Bear Tamer",t:"village",w:3,no:99,d:"Each morning, your bear growls if a wolf sits immediately beside you.",ld:"Your bear senses evil at close range. Every morning, the moderator announces whether your bear growled during the night — meaning at least one of your two immediate neighbors is a wolf. If a wolf neighbor dies, your bear goes silent. Position becomes information.",e:"🐻"},
twoSisters:{n:"Two Sisters",t:"village",w:2,no:99,d:"There are TWO of you. You wake on night 1 and confirm each other.",ld:"You are bound by blood. On the first night, the two Sisters open their eyes together and lock in mutual trust. Your ally is confirmed for the rest of the game — no matter what suspicions arise. If you both survive to the end, you play in perfect coordination.",e:"👭"},
threebrothers:{n:"Three Brothers",t:"village",w:3,no:99,d:"There are THREE of you. Wake on night 1 — all three confirm each other's identities.",ld:"You are a brotherhood of three, bonded before the village was built. On the first night, you and your two brothers open your eyes together, scanning every face — a triumvirate of absolute trust is born in that single gaze. From that moment, you carry three confirmed innocents in your pocket. Coordinate subtly: vote together with purpose, speak with authority, and form the immovable anchor the village rallies around. The wolves cannot infiltrate your circle — your greatest challenge is not doubt, it is staying alive long enough to use what you know.",e:"👬"},
stutteringJudge:{n:"Stuttering Judge",t:"village",w:3,no:99,d:"Once per game, silently signal the mod — that day gets a SECOND lynch vote.",ld:"You wield the gavel of chaos. Once during the entire game, you may signal the moderator (with a pre-agreed sign) during any day. That day's lynch proceeds as normal — and then a SECOND full vote occurs, potentially killing another player before nightfall. Save it for a critical wolf pileup.",e:"⚖️"},
scandalmonger:{n:"Scandalmonger",t:"village",w:2,no:54,d:"Each night, mark a player. Next day, votes AGAINST them count double.",ld:"You are the village's cruel gossip. Each night, choose one player to smear. During the following day, any votes cast against them count double — an unfair thumb on the scale. Use it to make sure a suspected wolf actually falls.",e:"📢"},
servant:{n:"Devoted Servant",t:"village",w:2,no:99,d:"When a player is lynched, you may sacrifice yourself and steal their role.",ld:"You are utterly devoted — to power. The moment a player is voted out and their card is about to be revealed, you may leap forward: your card is discarded and you become that role instead, permanently. You could inherit a Seer's sight from a wrongfully-lynched Seer, or a wolf's fangs from an executed wolf.",e:"🎩"},
ancient:{n:"Ancient",t:"village",w:3,no:99,d:"Survive the first wolf attack. But if the VILLAGE lynches you, they lose all powers.",ld:"You are older than the village itself. The first time wolves attack you, you survive — your ancient bones will not break so easily. But if the village makes the mistake of lynching you, they are cursed: every remaining villager loses their special powers for the rest of the game. Villagers must protect you or fall together.",e:"🏛️"},
angel:{n:"Angel",t:"neutral",w:-1,no:99,d:"Solo-win if you are lynched on day 1 or killed on night 1.",ld:"You are a fallen angel yearning for the fall. Your goal: die on the very first day, either by wolf attack or by village lynch. Achieve it and you ascend, winning solo. If you survive night 1 and day 1, you become a normal villager for the rest of the game — a consolation of mere existence.",e:"👼"},
wolfSniffer:{n:"Wolf Sniffer",t:"village",w:3,no:55,d:"Each night, point at a player — learn how many wolves sit adjacent to them.",ld:"Your nose reads werewolf density. Each night, point at any player and the moderator tells you the number of wolves sitting immediately beside them (0, 1, or 2). Triangulate through the village to isolate the pack.",e:"👃"},
actor:{n:"Actor",t:"village",w:3,no:56,d:"Each night, choose one of 3 face-up role cards. You gain its ability that night.",ld:"You are chameleon and thespian. At game start, three role cards are placed face-up in front of you (village-only). Each night, pick one — you may use that role's ability for that night only. The next night, pick from the two remaining. Versatile, cinematic, hard to predict.",e:"🎭"},
thief:{n:"Thief",t:"village",w:2,no:99,d:"Night 1: choose from 2 unused role cards to become your true role.",ld:"You steal identities. At game start, two extra role cards are set face-down. On the first night, you look at both and choose one to become permanently. Sometimes you draw two villagers and become a villager (unlucky). Sometimes you inherit a Seer's sight. Gamble.",e:"🥷"},
ninja:{n:"Ninja",t:"village",w:3,no:57,d:"Once per game, silently kill any player at night — even without the wolves.",ld:"You are a shadow of steel. Once during the game, on any night, you may silently assassinate any player of your choice. The kill is not attributed to the wolves — the village will wonder who struck. Use it to remove a confirmed wolf without exposing your hand.",e:"🥷"},
groupie:{n:"Groupie",t:"neutral",w:-2,no:99,d:"Night 1: pick your idol. Follow their team — but if they die, so do you.",ld:"You worship one person. On night 1, choose any player as your idol. Your win condition becomes theirs — you win when their team wins. But if your idol dies for any reason, your heart breaks and you die alongside them.",e:"🎤"},
cursed:{n:"Cursed",t:"village",w:0,no:99,d:"If wolves attack you, you become a wolf instead of dying.",ld:"You carry a dormant infection. If the wolves target you at night, you don't die — you transform into a werewolf and join their team forever. The wolves must decide: is converting you worth giving up a kill?",e:"🌑"},

// ============ NEUTRAL / CHAOS TEAM ============
troublemaker:{n:"Troublemaker",t:"neutral",w:-1,no:16,d:"When you die, the NEXT day features TWO lynching votes.",ld:"You are chaos personified. Whenever you die — by any means — the following day phase runs TWO lynching votes instead of one. Your death cascades into more death. Roleplay dangerously; you win harder when the village learns to fear killing you.",e:"😈"},
doppelganger:{n:"Doppelganger",t:"neutral",w:-2,no:17,d:"Night 1: shadow another player. If they die, you inherit their role.",ld:"You are a mimic. On night 1, choose one player secretly. From that moment, if they die at any point, you instantly transform into their role and continue as them (with their team). Choose a strong role to steal, or a wolf to inherit the pack.",e:"👥"},
madbomber:{n:"Mad Bomber",t:"neutral",w:-3,no:99,d:"If lynched, both of your immediate neighbors die too.",ld:"You are a walking bomb. If the village lynches you, you detonate: both of your immediate neighbors die along with you in the blast. Roleplay unpredictably — the village will hesitate to vote you out, giving you cover.",e:"💣"},
curse:{n:"Cursed One",t:"neutral",w:-2,no:99,d:"If wolves eat you at night, you rise as a werewolf instead of dying.",ld:"You are cursed. If wolves target you, you don't die — you transform and join their pack. The wolves must weigh: is recruiting worth losing a kill? Sometimes they prefer to leave you alive rather than gain a fanged ally.",e:"⚫"},
cultleader:{n:"Cult Leader",t:"neutral",w:0,no:18,d:"Each night, recruit a player. Solo-win when every living player is in your cult.",ld:"You build a religion of secrets. Each night, choose a player to recruit — the moderator informs them they are now in your cult (they know you exist but not who you are). Your solo victory: recruit every remaining living player. A third-way win.",e:"⛪"},
fool:{n:"Fool",t:"neutral",w:-1,no:99,d:"Solo-win if the village lynches you during a day.",ld:"You seek destruction on their terms. Your victory: be voted out and lynched by the village during any day phase. Draw attention, act suspicious, invite the accusation. Death by fang doesn't count — only their vote.",e:"🤡"},
jester:{n:"Jester",t:"neutral",w:-1,no:99,d:"Solo-win if the village lynches you.",ld:"You dance for their execution. Like the Fool: win when the village votes to hang you. Act erratically, provoke, entertain — until they can't resist voting for the clown.",e:"🎭"},
hoodlum:{n:"Hoodlum",t:"neutral",w:-2,no:99,d:"You are given two secret marks. Solo-win if both die while you're alive.",ld:"You are a hitman for the shadows. At game start, the moderator whispers two player names to you — your marks. You win if BOTH of them die while you're still alive. You don't kill them yourself; you just need the game to do the work.",e:"🚬"},
tanner:{n:"Tanner",t:"neutral",w:1,no:99,d:"Solo-win if you die by ANY means.",ld:"You hate the leather trade and yourself. Your victory: die. Any death — lynch, wolves, potions, anything. Play recklessly, provoke everyone, ensure someone kills you before the game ends.",e:"👔"},
wildchild:{n:"Wild Child",t:"neutral",w:-1,no:99,d:"Night 1: pick a role-model. If they die, you become a werewolf.",ld:"You watch one player with feral eyes. On night 1, choose your role-model. If they survive to the end, you win with the village. If they die at any point, you transform into a werewolf and join the pack. Your fate depends on someone else's survival.",e:"👶"},
sasquatch:{n:"Sasquatch",t:"neutral",w:-1,no:99,d:"If a day ends WITHOUT a lynch, you transform into a werewolf.",ld:"You lurk at the treeline. If the village fails to lynch anyone on any given day (skipped or tied vote), your feral nature awakens — you transform into a werewolf and join the pack. Inaction converts you.",e:"🦍"},
leprechaun:{n:"Leprechaun",t:"neutral",w:1,no:37,d:"Each night, redirect a werewolf attack to an adjacent target.",ld:"You are mischief incarnate. When the wolves choose a victim, you may redirect the kill to one of the target's immediate neighbors instead. You don't stop deaths — you scramble their pattern. Chaos, but a specific kind.",e:"🍀"},
bloodymary:{n:"Bloody Mary",t:"neutral",w:-2,no:99,d:"When you die, kill one player from the team that killed you every night thereafter.",ld:"Death does not end you. When you die by any team's hand, you become a vengeful spirit. Each subsequent night, the moderator kills a random living member of the team that killed you. Your revenge grinds on until the game ends.",e:"🩸"},
chupacabra:{n:"Chupacabra",t:"neutral",w:-2,no:38,d:"Each night, target a wolf — they die. Miss and nothing happens.",ld:"You are a myth that hunts myths. Each night, point at a player. If they are a wolf, they die instantly — no defense, no doctor can save them. If not, nothing happens (except now you know one player is definitely not a wolf).",e:"🦇"},
nostradamus:{n:"Nostradamus",t:"neutral",w:1,no:99,d:"Night 1: predict the winning team. Solo-win if you're right AND alive.",ld:"You see the ending. On the first night, whisper your prophecy to the moderator: which team will win? If you predict correctly AND survive to game's end, you win solo — regardless of which team actually won.",e:"📜"},
direwolf:{n:"Dire Wolf",t:"neutral",w:-2,no:99,d:"Night 1: pick a companion. If they die, you die too.",ld:"You bind yourself to another. On night 1, choose any player as your companion (they don't know). From that moment, if your companion dies for any reason, you drop dead too. Play to keep them alive — even if they're a wolf.",e:"👹"},
ghost:{n:"Ghost",t:"neutral",w:0,no:99,d:"You die on night 1 automatically. Then leave one clue letter for the village.",ld:"You are already fading. You die automatically on night 1 — no discussion. But you write one clue letter (chosen with the moderator) that is delivered to the village later in the game. Even from beyond, you guide.",e:"👼"},
demagogue:{n:"Demagogue",t:"neutral",w:-2,no:44,d:"Solo-win if the village fails to lynch anyone for 5 consecutive days.",ld:"You are the poison of consensus. Every day the village fails to lynch anyone (tie vote, skipped, chaos) counts toward your victory. Reach 5 days without a lynch and you win solo. Sabotage every vote, defend every accused, sow every doubt.",e:"🗣️"},
gadfly:{n:"Gadfly",t:"neutral",w:-1,no:48,d:"Solo-win by simply surviving to the end of the game.",ld:"You are a critic and a survivor. You don't care who wins — you only care that you're alive when the dust settles. Question every accusation, defend every suspect, blend in as chaos. Peripheral survival is the goal.",e:"🪰"},

// ============ EXPANSION ROLES ============
renfield:{n:"Renfield",t:"vampire",w:-3,no:58,d:"Vampire's servant — night 1, see all vampires. Win with vampires even if you die.",ld:"You are the architect of a monster's feeding schedule. On the first night, you open your eyes and see every vampire at the table — but they don't know your name. You win if the vampires win, even if you are killed along the way. This makes you the most dangerous kind of spy: a disposable one. Absorb accusations, act as the village's moral crusader, deflect suspicion from vampires with surgical precision, and never reveal your master's face.",e:"🕸️"},
apprenticeTanner:{n:"Apprentice Tanner",t:"neutral",w:0,no:99,d:"Night 1: secretly identify the Tanner. Solo-win if the Tanner is lynched — or win by dying if there is no Tanner.",ld:"You trained at the feet of the most suicidal craftsman in the village. On the first night you peek at the Tanner's identity — now you know their face. Your victory comes when the village lynch-mob finally finishes off your mentor. If there is no Tanner in this game, you inherit their death wish: you win by getting yourself killed instead. Two paths to victory, both requiring someone to die horribly — hopefully not you, unless it's part of the plan.",e:"🪡"},
mortician:{n:"Mortician",t:"village",w:3,no:59,d:"Each night, examine one dead player's exact role.",ld:"You profit from the village's tragedies and turn them into intelligence. Each night, choose one dead player and the moderator whispers their exact role to you. Over multiple nights you assemble a perfect accounting of who was who — an increasingly precise map of the wolves' strategy. In late game, your accumulated knowledge can pinpoint every remaining wolf by elimination. The dead speak to you, and what they say wins wars.",e:"🪦"},
undertaker:{n:"Undertaker",t:"village",w:2,no:99,d:"After each village lynch, secretly learn the lynched player's exact role before the public reveal.",ld:"You process every body the village produces. Immediately after each day's lynch vote, the moderator whispers the executed player's role to you before announcing it publicly. You gather a quiet trail of confirmed identities. Two consecutive innocent lynches tells you wolves are engineering your friends' deaths; a confirmed wolf tells you who to celebrate. Knowledge flows through the graveyard, and you control the gate.",e:"📋"},
escort:{n:"Escort",t:"village",w:3,no:60,d:"Each night, choose one player — they cannot perform any night action that night.",ld:"You know how to occupy someone's attention completely. Each night, choose one player: they are kept company and cannot perform their night ability — Seers go blind for a night, Doctors cannot heal, wolves lose individual special abilities. If you choose a Solo Killer on their kill night, you save a life without knowing it. Roleblocking is invisible, unprovable, and absolutely devastating in the right hands.",e:"💃"},
trapper:{n:"Trapper",t:"village",w:2,no:61,d:"Each night, set a hidden trap on one player. Any wolf who attacks them that night dies in the trap instead.",ld:"You are the village's quiet engineer of death. Each night, pick one player and bury a hidden trap beneath their doorstep. If a wolf tries to kill them that night, the wolf triggers the trap and dies — the kill never lands. The village gains a free wolf elimination and your target survives. Predict which player the wolves most want dead (Seer, Doctor, any confirmed villager), and your trap becomes an execution without a trial.",e:"🪤"},
serialkiller:{n:"Serial Killer",t:"neutral",w:-4,no:62,d:"Each night, independently kill any player. Solo-win if you are the last player alive.",ld:"You are a monster wearing a neighbor's face. Every single night, you must kill someone — not with the wolves, not for the village, but for yourself alone. Your goal is singular and apocalyptic: outlast every living soul. Let the wolves and villagers tear each other apart while you quietly prune whoever threatens you most. Late game when only a handful remain, your midnight blade is the only thing standing between you and a cold, perfect, solitary victory. Trust no one. Kill everyone. Survive.",e:"🔪"},
mysticwolf:{n:"Mystic Wolf",t:"evil",w:-7,no:1,d:"Wake with the pack AND investigate one player's exact role each night. A wolf who sees.",ld:"You are the pack's most devastating weapon: a born killer with a sorcerer's eye. Each night, you rise with the wolves to hunt — and then, before dawn breaks, you investigate any one player and learn their exact role. You are your own intelligence service. You know who the Seer is before they accuse anyone. You know where the Doctor sleeps. You guide the pack's kills with perfect information while your kin believe you are simply the sharpest fang among them. Your secret advantage is absolute.",e:"🔭"},
godfather:{n:"Godfather",t:"evil",w:-4,no:99,d:"You appear as 'Innocent Villager' to ALL Seers and Aura Seers. Completely immune to detection.",ld:"You have cultivated an air of absolute respectability. No matter how many times the Seer, Aura Seer, or Fortune Teller investigates you, they always receive the same clean answer: Villager. You are invisible to the village's finest instruments. Play the trusted patriarch — champion the Seer's cause, denounce suspected wolves loudly, earn unwavering trust. When wolves are cornered, step forward to lead their defense. The village will never know their beloved community leader was the one who ordered the hunts.",e:"🤌"},
vampirehunter:{n:"Vampire Hunter",t:"village",w:3,no:63,d:"Once per game, at night accuse a player of being a Vampire. If correct, staked. If wrong, you die instead.",ld:"You carry a silver stake sharpened over generations. Once during the game, on any night, you may silently accuse any player of being a Vampire. If you are right, the stake lands true — that Vampire is eliminated instantly, no morning discussion required. If you are wrong, the stake turns against you: you die in their place. A high-stakes gamble that rewards patient observation. Watch for the player who accuses others loudly by day but whose overnight choices never seem to help the village.",e:"⚔️"},
headhunter:{n:"Headhunter",t:"neutral",w:-2,no:99,d:"At game start, receive a secret mark. Solo-win if your marked target is lynched by the village.",ld:"Before the game begins, the moderator whispers one player's name into your ear. That player is your mark. You don't kill them yourself — your victory requires the village to do your dirty work. Guide accusations, plant rumors, keep heat on your target while seeming to care only about wolves. When the village finally votes out your mark in broad daylight, you win alone, regardless of who else survives. You are a ghost with an agenda — and an audience of unknowing executioners.",e:"🧿"},

// ============================================================
// BLOOD ON THE CLOCKTOWER ROLES
// A separate cast from the Werewolf roster. Tagged botc:true so the
// auto-balancer never mixes them into a standard Werewolf setup — a
// moderator adds them deliberately via the "Change Role" swap dropdown.
// Alignment mapping: Townsfolk & Outsider → village (good team),
// Minion & Demon → evil. Night order is no:99 (run BotC's own night
// order from the almanac; they don't appear in the Werewolf night walker).
// ============================================================

// ---- Trouble Brewing · Townsfolk ----
botc_washerwoman:{n:"Washerwoman",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"You start knowing that 1 of 2 players is a particular Townsfolk.",ld:"On the first night, the Storyteller shows you two players and names one Townsfolk role — one of those two players is that character. You've done their laundry; you'd know their linens anywhere. It's a powerful opening lead, but the drunk or a Spy can muddy your certainty. Use it to anchor a trust web early and build the good team's spine.",e:"🧺"},
botc_librarian:{n:"Librarian",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"You start knowing that 1 of 2 players is a particular Outsider (or that none are in play).",ld:"On the first night you learn that one of two shown players is a specific Outsider — or, unsettlingly, that no Outsiders exist at all. That single fact reshapes the whole game's math: knowing a Baron lurks, or that the Drunk is one of two people, tells the good team exactly how careful to be. Read the absence as loudly as the presence.",e:"📖"},
botc_investigator:{n:"Investigator",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"You start knowing that 1 of 2 players is a particular Minion.",ld:"On the first night, the Storyteller reveals two players and names a Minion — one of them holds that evil role. It's the sharpest opening blade the good team owns: a confirmed Minion candidate before a single vote. But beware the Recluse, who may register as your Minion and send you hunting an innocent. Triangulate, don't accuse blindly.",e:"🔎"},
botc_chef:{n:"Chef",t:"village",w:3,no:99,botc:1,ed:"Trouble Brewing",d:"You start knowing how many pairs of evil players sit next to each other.",ld:"On the first night, you learn a single number: how many pairs of adjacent evil players are seated around the circle. Zero means evil is scattered; a high count means the villains are clustered. Combined with the seating chart, this quiet arithmetic can crack the whole game open before dawn.",e:"👨‍🍳"},
botc_empath:{n:"Empath (Clocktower)",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, learn how many of your 2 living neighbours are evil (0, 1, or 2).",ld:"Every night, you feel the auras of the two living players beside you and learn how many are evil. As neighbours die and seats shift, your reading changes — a rising number means evil is closing in. Announce your readings carefully; the moment evil knows you're the Empath, you become the Demon's next meal.",e:"💗"},
botc_fortuneteller_botc:{n:"Fortune Teller (Clocktower)",t:"village",w:5,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, choose 2 players: learn if either is the Demon. One good player always reads as Demon to you.",ld:"Each night you point at two players and learn whether either is the Demon — a devastating tool. But there's a catch woven into your fate: one good player is your 'red herring' and will always ping as the Demon, even though they're innocent. Learn to separate the true signal from your cursed false positive, and you'll corner the Demon by mid-game.",e:"🔮"},
botc_undertaker_botc:{n:"Undertaker (Clocktower)",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, learn which character was executed by the town today.",ld:"Each night after an execution, the Storyteller reveals the exact character the town hanged that day. A trail of confirmed roles builds behind you: was that loud accuser really the Saint? Was the quiet one actually the Imp? String these truths together and you become the town's living ledger of what the votes actually killed.",e:"⚰️"},
botc_monk:{n:"Monk",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, choose a player other than yourself — they are safe from the Demon tonight.",ld:"Each night you lay a protective blessing on one player (never yourself), and the Demon's attack against them fails. Guard a confirmed Fortune Teller or Slayer and you deny evil its kill. But your protection is a tell: if the Demon strikes your ward and they live, the villains know a Monk walks among them, and they'll come for you next.",e:"🧘"},
botc_ravenkeeper:{n:"Ravenkeeper",t:"village",w:3,no:99,botc:1,ed:"Trouble Brewing",d:"If you die at night, you wake to choose a player and learn their exact character.",ld:"You sleep peacefully — until the night you're killed. In your dying moment, you point at any player and the Storyteller whispers their true character to you. Your death becomes a weapon: a well-aimed final gaze can out the Demon from beyond the grave. The trick is making sure the town believes your dying words.",e:"🦅"},
botc_virgin:{n:"Virgin",t:"village",w:3,no:99,botc:1,ed:"Trouble Brewing",d:"The 1st time you are nominated, if the nominator is a Townsfolk, they are executed immediately.",ld:"You are sacrosanct. The very first time anyone nominates you for execution, if that accuser is a Townsfolk, they are struck down on the spot instead — proving your innocence in the most dramatic way possible. Evil learns to fear nominating you. Bait a suspected villain into accusing you and watch the trap spring.",e:"👰"},
botc_slayer:{n:"Slayer",t:"village",w:4,no:99,botc:1,ed:"Trouble Brewing",d:"Once per game, during the day, publicly choose a player: if they are the Demon, they die.",ld:"You carry one slaying shot, fired openly in daylight. Point at any player and declare it — if they are the Demon, they die instantly and the good team likely wins. If not, nothing happens and you've spent your bullet. The mere claim of being the Slayer terrifies the Demon into hiding. Bluff it, save it, or fire it at the perfect moment.",e:"🗡️"},
botc_soldier:{n:"Soldier",t:"village",w:3,no:99,botc:1,ed:"Trouble Brewing",d:"You are immune to the Demon — its attacks against you always fail.",ld:"You are a hardened veteran the Demon cannot kill at night. This makes you a safe anchor for the town: claim it, and the Demon wastes no kills on you. But a Poisoner can strip your armor for a night, so never grow complacent — evil has ways of making even a Soldier bleed.",e:"🪖"},
botc_mayor_botc:{n:"Mayor (Clocktower)",t:"village",w:3,no:99,botc:1,ed:"Trouble Brewing",d:"If only 3 players live and no execution happens, good wins. If you'd die at night, another may die instead.",ld:"You are the town's figurehead of peace. If the game reaches three living players with no execution that day, the good team wins outright — a hidden victory clock. And should the Demon target you at night, the Storyteller may redirect that death to someone else. Reveal wisely: a known Mayor is both a shield and a bullseye.",e:"🎩"},
// ---- Trouble Brewing · Outsiders ----
botc_butler:{n:"Butler",t:"village",w:-1,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, choose a master. Tomorrow you may only vote if your master is also voting.",ld:"You serve at another's pleasure. Each night you pick a master, and the next day your vote is chained to theirs — you may only raise your hand if they raise theirs first. You're good at heart, but your shackled vote can accidentally starve a crucial execution. Choose a trustworthy master and let your loyalty become leverage.",e:"🤵"},
botc_drunk_botc:{n:"Drunk (Clocktower)",t:"village",w:-2,no:99,botc:1,ed:"Trouble Brewing",d:"You don't know you're the Drunk. You believe you're a Townsfolk, but your ability does nothing.",ld:"You think you're a helpful Townsfolk — a Washerwoman, a Chef, whoever — but you're gloriously, obliviously drunk, and your 'ability' produces nothing but noise and false information. You believe your bogus readings completely, and so might the town. The tragedy of the Drunk is that you'll swear your garbage intel is gospel.",e:"🍺"},
botc_recluse:{n:"Recluse",t:"village",w:-1,no:99,botc:1,ed:"Trouble Brewing",d:"You might register as evil — as a Minion or even the Demon — to other characters, even when dead.",ld:"You are a good hermit whom everyone suspects. Investigative roles may see you as a Minion or Demon; you may ping every alarm even though your heart is pure. You are the town's most dangerous distraction — a walking false positive. Your best play is radical transparency, because half the room already thinks you're a monster.",e:"🏚️"},
botc_saint:{n:"Saint",t:"village",w:-2,no:99,botc:1,ed:"Trouble Brewing",d:"If you are executed by the town, your team immediately loses the game.",ld:"You are beloved and fragile. If the town ever votes to execute you, the good team loses on the spot — game over. Evil's dream is to frame you into the noose. You must convince everyone of your innocence without ever being so trusted that evil manipulates a vote against you. A single careless lynch ends everything.",e:"😇"},
// ---- Trouble Brewing · Minions ----
botc_poisoner:{n:"Poisoner",t:"evil",w:-5,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, choose a player: their ability malfunctions tonight and tomorrow.",ld:"You are evil's quiet saboteur. Each night you poison one player, and their ability silently breaks — a Fortune Teller reads lies, a Monk protects no one, an Empath senses nothing. Nobody knows they've been poisoned. Time it to neutralize the town's sharpest tools at the worst possible moment and the good team drowns in bad information.",e:"☠️"},
botc_spy:{n:"Spy",t:"evil",w:-4,no:99,botc:1,ed:"Trouble Brewing",d:"Each night you see the whole board of roles. You may register as good, even as a Townsfolk.",ld:"You are evil's eyes. Each night the Storyteller shows you the entire secret layout — every role, every bluff. Meanwhile, investigative roles may see you as a harmless Townsfolk, letting you pose as the most trustworthy person at the table. Perfect information plus perfect disguise: feed the Demon truth while wearing the face of a saint.",e:"🕵️"},
botc_scarletwoman:{n:"Scarlet Woman",t:"evil",w:-4,no:99,botc:1,ed:"Trouble Brewing",d:"If the Demon dies while 5+ players live, you become the Demon.",ld:"You are evil's insurance policy. As long as five or more players remain, the moment the Demon falls — to a Slayer, an execution, anything — you rise and become the new Demon, continuing the reign of terror. Play like a nobody, deflect all suspicion, and be ready to inherit the throne the instant your master dies.",e:"💃"},
botc_baron:{n:"Baron",t:"evil",w:-3,no:99,botc:1,ed:"Trouble Brewing",d:"Extra Outsiders are in play — the good team is more fragile than it looks.",ld:"Your mere presence warps the game: two additional Outsiders join the cast, replacing helpful Townsfolk. The good team is quietly weakened before the first night even begins — more Drunks, Saints, and Recluses to trip over. You do nothing at night; your sabotage was baked in at setup. Blend in and let the town's own fragile roles betray them.",e:"🎩"},
// ---- Trouble Brewing · Demon ----
botc_imp:{n:"Imp",t:"evil",w:-7,no:99,botc:1,ed:"Trouble Brewing",d:"Each night, choose a player: they die. Kill yourself and a Minion becomes the new Imp.",ld:"You are the Demon of Trouble Brewing — the heartbeat of evil. Each night you choose a victim and they die at dawn. If the town closes in, you can 'star pass': kill yourself and a Minion rises as the new Imp, letting evil slip the noose entirely. Kill the town's information roles, protect your identity, and bleed the village dry one night at a time.",e:"😈"},

// ---- Bad Moon Rising · Townsfolk ----
botc_grandmother:{n:"Grandmother",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"You start knowing a good player and their character. If the Demon kills them, you die too.",ld:"On the first night you learn one good player's exact character — your beloved grandchild. You have a confirmed ally from the start. But your hearts are bound: if the Demon kills them, grief takes you the same night. Protect them fiercely, and never reveal who they are, or evil will kill two birds with one stone.",e:"👵"},
botc_sailor:{n:"Sailor",t:"village",w:4,no:99,botc:1,ed:"Bad Moon Rising",d:"Each night, choose a player: you or they are drunk until dusk. You cannot die.",ld:"You are a drunken sea-dog who simply cannot be killed — not by Demon, not by execution, nothing. Each night you drink with a chosen player, and one of you is drunk through the next day. Your immortality makes you an unshakable anchor for the town, though your rum-soaked choices spread confusion. Being unkillable, you can afford to be bold.",e:"⚓"},
botc_chambermaid:{n:"Chambermaid",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"Each night, choose 2 players: learn how many woke tonight to use their ability.",ld:"You keep the house and notice who stirs after dark. Each night you pick two players and learn how many of them woke to act. This exposes the game's active roles — and inactive ones. Cross-reference over several nights and you can map exactly who has a night ability and who is merely sleeping, a devastating deduction engine.",e:"🧹"},
botc_exorcist:{n:"Exorcist",t:"village",w:4,no:99,botc:1,ed:"Bad Moon Rising",d:"Each night, choose a player (different each night): if it's the Demon, it doesn't kill tonight.",ld:"You hunt the Demon with rite and prayer. Each night you choose someone new — and if you happen to pick the Demon, it learns your face but is forced to skip its kill that night. A single lucky guess buys the town a life and rattles the Demon's confidence. Rotate your targets cleverly to corner the beast.",e:"✝️"},
botc_innkeeper:{n:"Innkeeper",t:"village",w:4,no:99,botc:1,ed:"Bad Moon Rising",d:"Each night, choose 2 players: they can't die tonight, but one of them is drunk.",ld:"Your inn is a safehouse. Each night you shelter two guests — neither can die tonight — but the comfort comes at a price: one of the two is drunk until dusk and their ability fails. Guard the town's key players from the Demon while accepting that you're muddling one of them. A powerful, double-edged protection.",e:"🍺"},
botc_gambler:{n:"Gambler",t:"village",w:2,no:99,botc:1,ed:"Bad Moon Rising",d:"Each night, choose a player and guess their character: if you're wrong, you die.",ld:"You bet your life on your reads. Each night you name a player and guess their exact character — nail it and you gain confirmed knowledge, miss it and you die at dawn. High risk, high reward: a confident Gambler can rapidly confirm allies, but a reckless one hands evil a free kill. Wager only when the odds are truly in your favor.",e:"🎲"},
botc_gossip_botc:{n:"Gossip (Clocktower)",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"Each day, make one public statement. If it's true, a player dies that night.",ld:"Your words carry lethal weight. Each day you may declare one public statement, and if it turns out to be true, the Storyteller kills a player that night. Craft a claim only you can verify — 'the Demon sits to my left' — and turn your certainty into a corpse. But a false boast does nothing but expose your bluff.",e:"🗣️"},
botc_courtier:{n:"Courtier",t:"village",w:4,no:99,botc:1,ed:"Bad Moon Rising",d:"Once per game, at night, name a character: they are drunk for 3 nights and 3 days.",ld:"You know how to get anyone catastrophically drunk. Once per game you name a character — not a player, a role — and if that role is in play, they spend three full days and nights incapacitated, their ability useless. Cripple the Demon or a key Minion at the perfect moment. One shot, enormous impact — spend it when it hurts evil most.",e:"🍷"},
botc_professor:{n:"Professor",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"Once per game, at night, choose a dead player: if they're a Townsfolk, they return to life.",ld:"You practice the forbidden science of resurrection. Once per game you point at a corpse — if they were a Townsfolk, they rise, fully alive and abilities restored. Bring back a slain Fortune Teller or Slayer and swing the entire game. Choose wrong (a dead Outsider or villain) and your miracle fizzles. Timing and certainty are everything.",e:"🎓"},
botc_minstrel:{n:"Minstrel",t:"village",w:2,no:99,botc:1,ed:"Bad Moon Rising",d:"When a Minion is executed, everyone else is drunk until the next dusk.",ld:"Your music is intoxicating. Whenever a Minion dies by execution, your melody sweeps the town — every other player is drunk until the following dusk, all abilities silenced for a day and night. It's chaotic but revealing: the sudden fog can protect the town from evil's night actions while everyone sobers up. A strange, festive safeguard.",e:"🎻"},
botc_tealady:{n:"Tea Lady",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"If both your living neighbours are good, neither of them can die.",ld:"You pour a protective brew. As long as the two living players beside you are both good, neither can die — not to the Demon, not to execution. You create an untouchable pocket of safety around yourself. The town learns to seat its most valuable players next to you, turning your quiet hospitality into an impregnable fortress.",e:"🫖"},
botc_pacifist_botc:{n:"Pacifist (Clocktower)",t:"village",w:2,no:99,botc:1,ed:"Bad Moon Rising",d:"Executed good players might survive the hanging.",ld:"Your presence pleads for mercy. When the town executes a good player, the Storyteller may spare them — the noose simply fails. This can save a wrongly-accused Fortune Teller, but it also means evil can't always trust an execution to stick. Your gentle influence makes every hanging a question mark.",e:"☮️"},
botc_fool_botc:{n:"Fool (Clocktower)",t:"village",w:3,no:99,botc:1,ed:"Bad Moon Rising",d:"The first time you would die, you don't.",ld:"Fate favors the foolish. The very first time you would die — Demon attack, execution, poison, anything — you simply survive, cheating death once. This makes you a fearless investigator: bait the Demon, provoke the town, take the risks others can't. But once your charm is spent, you're as mortal as anyone. Spend that first life wisely.",e:"🃏"},
// ---- Bad Moon Rising · Outsiders ----
botc_goon:{n:"Goon",t:"village",w:-1,no:99,botc:1,ed:"Bad Moon Rising",d:"The first player to target you each night makes you drunk — and you turn their alignment.",ld:"You are a chameleon of allegiance. Each night, the first player to use an ability on you gets drunk, and you flip to whatever alignment they are — good or evil. Your loyalty is a hot potato nobody wants to hold. You might start good and end the game as evil's pawn, all because someone pointed at you at the wrong moment.",e:"🥊"},
