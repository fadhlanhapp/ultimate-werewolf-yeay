<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultimate Werewolf</title>
  <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; font-size: 14px; color: #1a1a1a;
      background: radial-gradient(ellipse at top, #2b2b3a 0%, #0f0f18 100%);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px; color: #eee; }
    h1 { font-size: 26px; margin-bottom: 4px; color: #f5f5f0; text-shadow: 0 2px 10px rgba(255,107,107,0.4); }
    .subtitle { color: #b0b0c0; font-style: italic; font-size: 12px; margin-bottom: 18px; }
    .container { width: 100%; max-width: 720px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 20px; justify-content: center; }
    .tab-btn { padding: 10px 22px; border: 2px solid #444; border-radius: 8px; background: #1e1e2a;
      color: #ccc; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s; }
    .tab-btn:hover { border-color: #888; }
    .tab-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: rgba(255,255,255,0.97); color: #1a1a1a; border-radius: 12px;
      padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .card h3 { font-size: 18px; margin-bottom: 12px; }
    .card h4 { font-size: 14px; margin: 14px 0 8px; color: #444; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
    .count-btn { width: 52px; height: 52px; border: 2px solid #bbb; border-radius: 8px; background: #fff;
      font-weight: bold; cursor: pointer; font-size: 16px; font-family: Georgia; transition: all 0.2s; }
    .count-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .count-btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }

    .action-btn { padding: 10px 18px; margin: 4px; border: 2px solid #2b2b2b; border-radius: 8px;
      background: #fff; color: #2b2b2b; cursor: pointer; font-weight: bold; font-family: Georgia;
      font-size: 13px; transition: all 0.15s; }
    .action-btn:hover { background: #2b2b2b; color: #fff; transform: translateY(-1px); }
    .action-btn.primary { border-color: #27ae60; color: #fff; background: #27ae60; }
    .action-btn.primary:hover { background: #219150; }
    .action-btn.danger { border-color: #c0392b; color: #c0392b; }
    .action-btn.danger:hover { background: #c0392b; color: #fff; }
    .action-btn.warn { border-color: #f39c12; color: #f39c12; }
    .action-btn.warn:hover { background: #f39c12; color: #fff; }
    .action-btn.big { padding: 14px 28px; font-size: 15px; }

    .tag { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 4px; margin-right: 6px; font-weight: bold; letter-spacing: 0.5px; }
    .tag-evil { background: #fdecea; color: #c0392b; }
    .tag-village { background: #eafaf1; color: #27ae60; }
    .tag-neutral { background: #f5eef8; color: #8e44ad; }
    .tag-vampire { background: #f9e4e4; color: #8e0000; }

    .summary { display: flex; gap: 10px; justify-content: center; font-size: 12px; flex-wrap: wrap; margin: 12px 0; }
    .balance-pill { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold;
      background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
    .balance-pill.positive { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .balance-pill.negative { background: linear-gradient(135deg, #c0392b, #e74c3c); }

    .role-row { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
    .role-row:last-child { border-bottom: none; }
    .role-emoji { font-size: 30px; min-width: 44px; text-align: center; }
    .role-name { font-weight: bold; font-size: 14px; }
    .role-desc { font-size: 12px; color: #555; margin-top: 2px; }

    .night-order { background: #fff9e6; border: 1px solid #f39c12; border-radius: 8px; padding: 14px; margin: 12px 0; color: #1a1a1a; }
    .night-step { display: flex; gap: 10px; padding: 8px 10px; border-left: 3px solid #f39c12; margin-bottom: 6px; font-size: 12px; background: rgba(255,255,255,0.6); border-radius: 4px; }
    .night-step.done { opacity: 0.5; border-left-color: #27ae60; }
    .night-step.current { background: #fff3cd; border-left-color: #e67e22; border-left-width: 5px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

    .share-box { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border: 1px solid #64b5f6; border-radius: 8px; padding: 14px; margin: 12px 0; color: #0d47a1; }
    .share-link { background: #fff; border: 1px solid #90caf9; padding: 10px; font-family: monospace; font-size: 11px; word-break: break-all; margin-bottom: 8px; border-radius: 4px; }

    .player-name-input { font-size: 16px; padding: 12px; border: 2px solid #ddd; border-radius: 6px; width: 100%; max-width: 320px; margin-bottom: 12px; font-family: Georgia; }
    .player-name-input:focus { border-color: #667eea; outline: none; }

    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin: 12px 0; }
    .player-tile { background: #fff; border: 2px solid #e0e0e0; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
    .player-tile.dead { opacity: 0.5; background: #f5f5f5; border-color: #ccc; }
    .player-tile.dead .player-tile-name { text-decoration: line-through; color: #888; }
    .player-tile-emoji { font-size: 24px; }
    .player-tile-name { font-weight: bold; font-size: 13px; color: #1a1a1a; }
    .player-tile-role { font-size: 10px; color: #666; }
    .player-tile-hidden { color: #999; font-style: italic; }
    .player-tile-kill { background: #fee; border: 1px solid #c0392b; color: #c0392b; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; margin-left: auto; }
    .player-tile-kill:hover { background: #c0392b; color: #fff; }
    .player-tile-revive { background: #efe; border: 1px solid #27ae60; color: #27ae60; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; margin-left: auto; }

    .role-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 16px;
      padding: 40px 30px; margin: 20px 0; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: slideUp 0.6s ease; }
    .role-card-evil { background: linear-gradient(135deg, #8b0000 0%, #ff4444 100%); }
    .role-card-village { background: linear-gradient(135deg, #196f3d 0%, #2ecc71 100%); }
    .role-card-neutral { background: linear-gradient(135deg, #6c3483 0%, #bb8fce 100%); }
    .role-card-vampire { background: linear-gradient(135deg, #4a0000 0%, #8e0000 100%); }
    .role-card-big-emoji { font-size: 90px; margin: 20px 0; animation: bounce 2.5s infinite; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .role-card h2 { font-size: 34px; margin: 12px 0; font-weight: bold; text-shadow: 2px 2px 8px rgba(0,0,0,0.4); }
    .role-card .team-badge { display: inline-block; font-size: 12px; padding: 8px 18px; background: rgba(255,255,255,0.25);
      border-radius: 20px; margin: 8px 0 16px; font-weight: bold; letter-spacing: 1px; }
    .role-card .short-desc { font-size: 15px; margin: 12px 0; font-weight: bold; line-height: 1.5; }
    .role-card .long-desc { font-size: 12px; margin: 20px 0 12px; line-height: 1.7; text-align: left;
      background: rgba(0,0,0,0.18); padding: 14px; border-radius: 8px; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes reveal { 0% { filter: blur(20px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }

    .warning { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #856404; font-size: 12px; }
    .info { background: #e3f2fd; border: 1px solid #64b5f6; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #0d47a1; font-size: 12px; }
    .error { background: #fdecea; border: 1px solid #c0392b; border-radius: 6px; padding: 10px 14px; margin: 10px 0; color: #c0392b; font-size: 12px; }

    .phase-banner { text-align: center; padding: 16px; border-radius: 10px; margin-bottom: 16px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
    .phase-night { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; }
    .phase-day { background: linear-gradient(135deg, #f9d423, #ff9068); color: #1a1a1a; }
    .phase-lobby { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #1a1a1a; }

    .day-counter { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px; margin-left: 10px; font-size: 14px; }

    .lobby-status { background: linear-gradient(135deg, #f9f9f9, #e8e8e8); padding: 20px; text-align: center; border-radius: 10px; color: #333; font-size: 14px; }
    .waiting-dots::after { content: '...'; animation: pulse 1.5s infinite; }

    .win-check { padding: 12px; background: #e8f5e9; border-left: 4px solid #27ae60; margin: 10px 0; border-radius: 4px; font-size: 13px; }
    .win-check.evil { background: #ffebee; border-left-color: #c0392b; }
    .win-check.neutral { background: #f3e5f5; border-left-color: #8e44ad; }

    .toggle-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }

    @media (max-width: 500px) {
      .role-card { padding: 28px 18px; }
      .role-card h2 { font-size: 26px; }
      .role-card-big-emoji { font-size: 70px; }
      .players-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

// ============================================================
// SUPABASE HELPERS (REST API - works even before SDK loads)

var HEADERS = {
  "Content-Type": "application/json",
  "Authorization": "Bearer " + SUPABASE_KEY,
  "apikey": SUPABASE_KEY
};

function sbInsertGame(g) {
  return fetch(SUPABASE_URL + "/rest/v1/games", {
    method: "POST",
    headers: Object.assign({}, HEADERS, {"Prefer": "resolution=merge-duplicates,return=minimal"}),
    body: JSON.stringify({
      id: g.id, count: g.count, roles: JSON.stringify(g.roles),
      evil: g.evil, village: g.village, neutral: g.neutral, balance: g.balance
    })
  });
}
function sbGetGame(id) {
  return fetch(SUPABASE_URL + "/rest/v1/games?id=eq." + encodeURIComponent(id), {headers: HEADERS})
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (arr) { return arr && arr[0] || null; });
}
function sbDeleteGame(id) {
  return fetch(SUPABASE_URL + "/rest/v1/games?id=eq." + encodeURIComponent(id), {method: "DELETE", headers: HEADERS}).catch(function(){});
}
function sbGetPlayers(gid) {
  return fetch(SUPABASE_URL + "/rest/v1/players?game_id=eq." + encodeURIComponent(gid) + "&order=id.asc", {headers: HEADERS})
    .then(function (r) { return r.ok ? r.json() : []; })
    .catch(function () { return []; });
}
function sbInsertPlayer(p) {
  return fetch(SUPABASE_URL + "/rest/v1/players", {
    method: "POST",
    headers: Object.assign({}, HEADERS, {"Prefer": "return=representation"}),
    body: JSON.stringify(p)
  }).then(function (r) { return r.ok ? r.json() : null; });
}
function sbDeletePlayer(id) {
  return fetch(SUPABASE_URL + "/rest/v1/players?id=eq." + encodeURIComponent(id), {method: "DELETE", headers: HEADERS}).catch(function(){});
}
function sbDeleteAllPlayers(gid) {

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function calcBalance(roles) {
  var b = 0;
  for (var i = 0; i < roles.length; i++) b += ROLES[roles[i]].w;
  return b;
}
function copyToClipboard(text) {
  if (navigator.clipboard) return navigator.clipboard.writeText(text);
  var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  return Promise.resolve();
}
function saveLocal() {
  if (!gameState) return;
  localStorage.setItem("uw-game-" + gameState.id, JSON.stringify(gameState));
  localStorage.setItem("uw-current", gameState.id);
}
function loadLocal(id) {
  var s = localStorage.getItem("uw-game-" + id);
  return s ? JSON.parse(s) : null;
}

// ============================================================
// GAME LIFECYCLE (MODERATOR)
// ============================================================
function createGame(count) {
  if (!POOLS[count]) { alert("Unsupported player count: " + count); return; }
  var pool = POOLS[count];
  var roles = pool.e.concat(pool.v).concat(pool.n || []);
  // Shuffle once at creation — persists as the assignment order.
  var shuffled = shuffle(roles);
  var id = "uw-" + Date.now().toString(36) + "-" + Math.random().toString(36).substr(2, 4);
  gameState = {
    id: id, count: count,
    roles: shuffled,           // ← shuffled order = assignment order
    displayRoles: roles.slice(),// ← original order for the mod's summary card
    evil: pool.e.length, village: pool.v.length, neutral: (pool.n || []).length,
    balance: calcBalance(roles),
    players: {},               // pid → {id, name, role, dead}
    phase: "lobby",            // lobby | night | day | ended
    day: 0,
    revealed: false,           // are roles shown in mod's player list?
    createdAt: Date.now()
  };
  isModerator = true;
  saveLocal();
  sbInsertGame(gameState).catch(function () {});
  openBroadcast(id);
  startPolling();
  renderMod();
}

function rerollRoles() {
  if (!gameState) return;
  if (Object.keys(gameState.players).length > 0) {
    if (!confirm("Reroll will kick all joined players (they'll need to rejoin with a NEW link). Continue?")) return;
  }
  var count = gameState.count;
  // Full teardown → new id so old link stops working (no confusion).
  var oldId = gameState.id;
  sbDeleteAllPlayers(oldId);
  sbDeleteGame(oldId);
  localStorage.removeItem("uw-game-" + oldId);
  stopPolling(); closeBroadcast();
  createGame(count);
}

function startGame() {
  if (!gameState) return;
  var joined = Object.keys(gameState.players).length;
  if (joined < gameState.count) {
    if (!confirm("Only " + joined + "/" + gameState.count + " players joined. Start anyway?")) return;
  }
  gameState.phase = "night";
  gameState.day = 1;
  gameState.revealed = true;  // mod sees roles now
  gameState.nightStep = 0;
  saveLocal();
  broadcast({type: "game-started"});
  renderMod();
}

function nextPhase() {
  if (!gameState) return;
  if (gameState.phase === "night") {
    gameState.phase = "day";
  } else if (gameState.phase === "day") {
    gameState.phase = "night";
    gameState.day += 1;
    gameState.nightStep = 0;
  }
  saveLocal();
  renderMod();
}

function advanceNightStep() {
  if (!gameState || gameState.phase !== "night") return;
  gameState.nightStep = (gameState.nightStep || 0) + 1;
  saveLocal();
  renderMod();
}
function resetNightStep() {
  if (!gameState || gameState.phase !== "night") return;
  gameState.nightStep = 0;
  saveLocal();
  renderMod();
}

function togglePlayerDead(pid) {
  if (!gameState || !gameState.players[pid]) return;
  gameState.players[pid].dead = !gameState.players[pid].dead;
  saveLocal();
  renderMod();
}

function toggleReveal() {
  if (!gameState) return;
  gameState.revealed = !gameState.revealed;
  saveLocal();
  renderMod();
}

function endGame() {
  if (!confirm("End this game and clear all data?")) return;
  if (gameState) {
    sbDeleteAllPlayers(gameState.id);
    sbDeleteGame(gameState.id);
    localStorage.removeItem("uw-game-" + gameState.id);
    localStorage.removeItem("uw-current");
    broadcast({type: "game-ended"});
  }
  stopPolling(); closeBroadcast();
  gameState = null;
  renderMod();
}

// ============================================================
// PLAYER LIFECYCLE
// ============================================================
async function loadGameForPlayer(gid) {
  // Try Supabase first (source of truth)
  var g = await sbGetGame(gid);
  if (g) {
    var roles = [];
    try { roles = JSON.parse(g.roles); } catch (e) { roles = []; }
    return {
      id: g.id, count: g.count, roles: roles,
      evil: g.evil, village: g.village, neutral: g.neutral, balance: g.balance,
      players: {}
    };
  }
  // Fallback: localStorage
  return loadLocal(gid);
}

async function joinGame(gid) {
  var name = (document.getElementById("pname").value || "").trim();
  if (!name) { alert("Please enter your name"); return; }
  if (name.length > 24) { alert("Name too long (max 24 chars)"); return; }

  var g = await loadGameForPlayer(gid);
  if (!g) { alert("Game not found. Ask moderator for a fresh link."); return; }

  // Check for duplicate name on server + get taken roles
  var existing = await sbGetPlayers(gid);
  for (var i = 0; i < existing.length; i++) {
    if (existing[i].name.toLowerCase() === name.toLowerCase()) {
      if (!confirm("Name '" + name + "' is already taken. Rejoin as this player?")) return;
      // Rejoin — store their pid locally
      localStorage.setItem("uw-pid-" + gid, existing[i].player_id);
      localStorage.setItem("uw-current", gid);
      renderPlayer();
      return;
    }
  }

  if (existing.length >= g.count) { alert("Game is full."); return; }

  // Assign next role from the pre-shuffled list. Handles duplicates correctly:
  // if the pool has 2×werewolf, 2 players get werewolf; if 1×seer, only 1 does.
  var takenCount = {};
  existing.forEach(function (p) { takenCount[p.role] = (takenCount[p.role] || 0) + 1; });
  var seenCount = {};
  var role = null;
  for (var i = 0; i < g.roles.length; i++) {
    var r = g.roles[i];
    seenCount[r] = (seenCount[r] || 0) + 1;
    if (seenCount[r] > (takenCount[r] || 0)) { role = r; break; }
  }
  if (!role) { alert("No roles remaining."); return; }

  var pid = "p" + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
  var record = {
    id: Date.now(),           // numeric id column
    game_id: gid,
    player_id: pid,
    name: name,
    role: role
  };
  var inserted = await sbInsertPlayer(record);
  if (!inserted) { alert("Failed to join. Check your connection."); return; }

  // Race-condition guard: refetch, verify this pid actually got this role uniquely.
  var recheck = await sbGetPlayers(gid);
  var mine = recheck.find ? recheck.find(function(p){return p.player_id===pid;}) : null;
  if (!mine) { alert("Join failed — please try again."); return; }
  // Race-condition guard: role may legitimately appear N times in the pool.
  // Only retry if MORE players now hold this role than the pool allows.
  var allowed = g.roles.filter(function (r) { return r === mine.role; }).length;
  var dupes = recheck.filter(function (p) { return p.role === mine.role; });
  if (dupes.length > allowed) {
    var losers = dupes.sort(function (a, b) { return a.id - b.id; }).slice(allowed);
    if (losers.some(function (p) { return p.player_id === pid; })) {
      await sbDeletePlayer(mine.id);
      return joinGame(gid);
    }
  }

  localStorage.setItem("uw-pid-" + gid, pid);
  localStorage.setItem("uw-current", gid);
  renderPlayer();
}

async function leaveGameFromPlayer(gid) {
  if (!confirm("Leave the game? Your role will be released.")) return;
  var pid = localStorage.getItem("uw-pid-" + gid);
  if (pid) {
    var players = await sbGetPlayers(gid);
    var mine = players.find ? players.find(function(p){return p.player_id===pid;}) : null;
    if (mine) await sbDeletePlayer(mine.id);
  }
  localStorage.removeItem("uw-pid-" + gid);
  renderPlayer();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(refreshFromServer, 2000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
async function refreshFromServer() {
  if (!gameState) return;
  var players = await sbGetPlayers(gameState.id);
  // Preserve dead state from local (dead is mod-only, never on server).
  var newPlayers = {};
  players.forEach(function (p) {
    var prev = gameState.players[p.player_id] || {};
    newPlayers[p.player_id] = {
      id: p.id, name: p.name, role: p.role,
      dead: !!prev.dead
    };
  });
  gameState.players = newPlayers;
  saveLocal();
  if (isModerator) renderMod();
}

function openBroadcast(id) {
  closeBroadcast();
  try {
    bc = new BroadcastChannel("uw-" + id);
    bc.onmessage = function (e) {
      if (e.data && e.data.type === "player-joined" && isModerator) {
        refreshFromServer();
      }
    };
  } catch (err) {}
}
function closeBroadcast() {
  if (bc) { try { bc.close(); } catch(e){} bc = null; }
}
function broadcast(msg) {
  if (bc) { try { bc.postMessage(msg); } catch(e){} }
}

// ============================================================
// MOD VIEW RENDERING
// ============================================================
function renderMod() {
  var view = document.getElementById("modView");
  if (!gameState) { view.innerHTML = renderModStart(); attachModStartHandlers(); return; }
  if (gameState.phase === "lobby") { view.innerHTML = renderModLobby(); attachModLobbyHandlers(); return; }
  view.innerHTML = renderModPlay();
  attachModPlayHandlers();
}

function renderModStart() {
  var buttons = "";
  var counts = Object.keys(POOLS).sort(function (a, b) { return +a - +b; });
  for (var i = 0; i < counts.length; i++) {
    buttons += "<button class='count-btn' data-count='" + counts[i] + "'>" + counts[i] + "</button>";
  }
  return "<div class='card'>" +
    "<h3>Start a new game</h3>" +
    "<p style='color:#666;font-size:12px;margin-bottom:12px;'>Pick number of players (6–16). Roles are auto-balanced.</p>" +
    "<div class='btn-row'>" + buttons + "</div>" +
    "</div>";
}
function attachModStartHandlers() {
  document.querySelectorAll(".count-btn").forEach(function (b) {
    b.onclick = function () { createGame(+b.getAttribute("data-count")); };
  });
}

function renderModLobby() {
  var g = gameState;
  var joined = Object.keys(g.players).length;
  var url = window.location.origin + window.location.pathname + "?g=" + g.id;
  var balSign = g.balance >= 0 ? "+" : "";
  var balClass = g.balance > 2 ? "positive" : (g.balance < -2 ? "negative" : "");

  var html = "";

  // Phase banner
  html += "<div class='phase-banner phase-lobby'>🕹 LOBBY — Waiting for players</div>";

  // Summary card
  html += "<div class='card'>";
  html += "<h3>" + g.count + "-Player Game</h3>";
  html += "<div class='summary'>";
  html += "<span class='tag tag-evil'>Evil: " + g.evil + "</span>";
  html += "<span class='tag tag-village'>Village: " + g.village + "</span>";
  if (g.neutral > 0) html += "<span class='tag tag-neutral'>Neutral: " + g.neutral + "</span>";
  html += "<span class='balance-pill " + balClass + "'>Balance: " + balSign + g.balance + "</span>";
  html += "</div>";

  // Share
  html += "<div class='share-box'>";
  html += "<div style='font-weight:bold;font-size:11px;margin-bottom:6px;'>📨 SHARE THIS LINK</div>";
  html += "<div class='share-link'>" + url + "</div>";
  html += "<button class='action-btn' id='copyBtn'>📋 Copy Link</button>";
  if (navigator.share) html += "<button class='action-btn' id='shareBtn'>📤 Share</button>";
  html += "</div>";

  // Player list (names only in lobby)
  html += "<h4>Joined Players (" + joined + "/" + g.count + ")</h4>";
  if (joined === 0) {
    html += "<div class='lobby-status'><span class='waiting-dots'>Waiting for players to join</span></div>";
  } else {
    html += "<div class='players-grid'>";
    var i = 1;
    for (var pid in g.players) {
      var p = g.players[pid];
      html += "<div class='player-tile'>";
      html += "<div class='player-tile-emoji'>" + i + "️⃣</div>";
      html += "<div><div class='player-tile-name'>" + escapeHtml(p.name) + "</div>";
      html += "<div class='player-tile-role player-tile-hidden'>role hidden</div></div>";
      html += "</div>";
      i++;
    }
    html += "</div>";
  }

  // Setup preview (roles list, hidden by default)
  html += "<div class='toggle-row' style='margin-top:16px;'>";
  html += "<button class='action-btn' id='togglePreview'>" + (g.showPreview ? "Hide" : "Show") + " role list (spoilers)</button>";
  html += "</div>";
  if (g.showPreview) {
    html += "<div style='background:#f9f9f9;border-radius:8px;padding:8px;margin-top:8px;'>";
    var display = g.displayRoles || g.roles;
    for (var k = 0; k < display.length; k++) {
      var r = ROLES[display[k]];
      html += "<div class='role-row'><div class='role-emoji'>" + r.e + "</div>";
      html += "<div><div class='role-name'><span class='tag tag-" + r.t + "'>" + r.t.toUpperCase().substr(0,3) + "</span>" + r.n + "</div>";
      html += "<div class='role-desc'>" + r.d + "</div></div></div>";
    }
    html += "</div>";
  }

  // Actions
  html += "<div style='margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;'>";
  var canStart = joined >= 3;
  html += "<button class='action-btn primary big' id='startBtn' " + (canStart ? "" : "disabled style='opacity:0.5;cursor:not-allowed;'") + ">▶ Start Game</button>";
  html += "<button class='action-btn warn' id='rerollBtn'>🎲 Reroll Setup</button>";
  html += "<button class='action-btn danger' id='endBtn'>✕ End Game</button>";
  html += "</div>";
  html += "</div>";
  return html;
}
function attachModLobbyHandlers() {
  var g = gameState;
  var url = window.location.origin + window.location.pathname + "?g=" + g.id;
  var btn;
  if (btn = document.getElementById("copyBtn")) btn.onclick = function () { copyToClipboard(url).then(function () { btn.textContent = "✓ Copied!"; setTimeout(function(){btn.textContent="📋 Copy Link";},1500); }); };
  if (btn = document.getElementById("shareBtn")) btn.onclick = function () { navigator.share({title: "Werewolf Game", url: url}); };
  if (btn = document.getElementById("togglePreview")) btn.onclick = function () { g.showPreview = !g.showPreview; saveLocal(); renderMod(); };
  if (btn = document.getElementById("startBtn")) btn.onclick = startGame;
  if (btn = document.getElementById("rerollBtn")) btn.onclick = rerollRoles;
  if (btn = document.getElementById("endBtn")) btn.onclick = endGame;
}

function renderModPlay() {
  var g = gameState;
  var alive = 0, aliveEvil = 0, aliveVillage = 0, aliveNeutral = 0;
  for (var pid in g.players) {
    var p = g.players[pid];
    if (!p.dead) {
      alive++;
      var t = ROLES[p.role].t;
      if (t === "evil" || t === "vampire") aliveEvil++;
      else if (t === "village") aliveVillage++;
      else aliveNeutral++;
    }
  }

  var html = "";
  var phaseClass = g.phase === "night" ? "phase-night" : "phase-day";
  var phaseIcon = g.phase === "night" ? "🌙" : "☀️";
  var phaseText = g.phase === "night" ? "NIGHT PHASE" : "DAY PHASE";
  html += "<div class='phase-banner " + phaseClass + "'>" + phaseIcon + " " + phaseText + "<span class='day-counter'>Day " + g.day + "</span></div>";

  // Win checker
  var winMsg = checkWinCondition(aliveEvil, aliveVillage, aliveNeutral, alive);
  if (winMsg) {
    html += "<div class='card'><div class='win-check " + winMsg.team + "'><strong>" + winMsg.title + "</strong><br>" + winMsg.text + "</div></div>";
  }

  html += "<div class='card'>";
  html += "<div style='display:flex;justify-content:space-between;align-items:center;'>";
  html += "<h3>Players (" + alive + " alive)</h3>";
  html += "<button class='action-btn' id='toggleReveal'>" + (g.revealed ? "🙈 Hide Roles" : "👁 Show Roles") + "</button>";
  html += "</div>";

  html += "<div class='summary' style='margin-top:8px;'>";
  html += "<span class='tag tag-evil'>Evil alive: " + aliveEvil + "</span>";
  html += "<span class='tag tag-village'>Village alive: " + aliveVillage + "</span>";
  if (aliveNeutral > 0) html += "<span class='tag tag-neutral'>Neutral alive: " + aliveNeutral + "</span>";
  html += "</div>";

  html += "<div class='players-grid'>";
  for (var pid in g.players) {
    var p = g.players[pid];
    var r = ROLES[p.role];
    html += "<div class='player-tile" + (p.dead ? " dead" : "") + "'>";
    html += "<div class='player-tile-emoji'>" + (g.revealed ? r.e : "❔") + "</div>";
    html += "<div style='flex:1;min-width:0;'>";
    html += "<div class='player-tile-name'>" + escapeHtml(p.name) + "</div>";
    if (g.revealed) {
      html += "<div class='player-tile-role'><span class='tag tag-" + r.t + "'>" + r.t.substr(0,3).toUpperCase() + "</span>" + r.n + "</div>";
    } else {
      html += "<div class='player-tile-role player-tile-hidden'>hidden</div>";
    }
    html += "</div>";
    html += "<button class='" + (p.dead ? "player-tile-revive" : "player-tile-kill") + "' data-pid='" + pid + "'>" + (p.dead ? "revive" : "kill") + "</button>";
    html += "</div>";
  }
  html += "</div>";
  html += "</div>";

  // Night walker
  if (g.phase === "night") {
    var nightRoles = [];
    for (var i = 0; i < g.roles.length; i++) {
      var r = ROLES[g.roles[i]];
      if (r.no < 99) nightRoles.push({key: g.roles[i], no: r.no});
    }
    // Include only unique night orders (some roles share slot 5), sort by no.
    nightRoles.sort(function (a, b) { return a.no - b.no; });

    html += "<div class='card'>";
    html += "<h3>🌙 Night Walker</h3>";
    html += "<p style='font-size:12px;color:#666;margin-bottom:8px;'>Call each role in order. Tap Next when done. Some roles die and don't wake.</p>";
    var step = g.nightStep || 0;
    html += "<div class='night-order'>";
    for (var i = 0; i < nightRoles.length; i++) {
      var nr = nightRoles[i];
      var rr = ROLES[nr.key];
      var pTaken = false;
      // Find any living player with this role
      for (var pid2 in g.players) {
        if (g.players[pid2].role === nr.key && !g.players[pid2].dead) { pTaken = true; break; }
      }
      var cls = "night-step";
      if (i < step) cls += " done";
      else if (i === step) cls += " current";
      html += "<div class='" + cls + "'>";
      html += "<strong>" + rr.e + " " + rr.n + "</strong> — " + (NIGHT_ACTIONS[nr.no] || rr.d);
      if (!pTaken) html += " <em style='color:#888;'>(no living player)</em>";
      html += "</div>";
    }
    html += "</div>";
    html += "<div style='margin-top:12px;'>";
    html += "<button class='action-btn primary' id='nextStep'>▶ Next Role</button>";
    html += "<button class='action-btn' id='resetStep'>↻ Reset</button>";
    html += "<button class='action-btn warn' id='toDay'>☀️ End Night → Day</button>";
    html += "</div>";
    html += "</div>";
  } else {
    html += "<div class='card'>";
    html += "<h3>☀️ Day Phase</h3>";
    html += "<p style='color:#555;font-size:13px;'>Village debates, accuses, and votes. Use the <em>kill</em> button above to mark the lynched player. Then advance to night.</p>";
    html += "<div style='margin-top:12px;'>";
    html += "<button class='action-btn primary' id='toNight'>🌙 End Day → Night " + (g.day + 1) + "</button>";
    html += "</div>";
    html += "</div>";
  }

  html += "<div class='card'>";
  html += "<button class='action-btn danger' id='endBtn'>✕ End Game</button>";
  html += "</div>";
  return html;
}
function attachModPlayHandlers() {
  var btn;
  document.querySelectorAll(".player-tile-kill, .player-tile-revive").forEach(function (b) {
    b.onclick = function () { togglePlayerDead(b.getAttribute("data-pid")); };
  });
  if (btn = document.getElementById("toggleReveal")) btn.onclick = toggleReveal;
  if (btn = document.getElementById("nextStep")) btn.onclick = advanceNightStep;
  if (btn = document.getElementById("resetStep")) btn.onclick = resetNightStep;
  if (btn = document.getElementById("toDay")) btn.onclick = nextPhase;
  if (btn = document.getElementById("toNight")) btn.onclick = nextPhase;
  if (btn = document.getElementById("endBtn")) btn.onclick = endGame;
}

function checkWinCondition(evil, village, neutral, total) {
  if (total === 0) return {team: "neutral", title: "Everyone is dead", text: "Game over — no winners."};
  if (evil === 0) return {team: "", title: "🎉 Village wins!", text: "All evil players have been eliminated."};
  if (village === 0 && neutral === 0) return {team: "evil", title: "🐺 Evil wins!", text: "The village has fallen."};
  if (evil >= village + neutral) return {team: "evil", title: "🐺 Evil dominates!", text: "Evil equals/outnumbers everyone else. Village cannot win."};
  return null;
}

// ============================================================
// PLAYER VIEW RENDERING
// ============================================================
async function renderPlayer() {
  var view = document.getElementById("playerView");
  view.innerHTML = "<div class='card'><div class='lobby-status'><span class='waiting-dots'>Loading</span></div></div>";

  var params = new URLSearchParams(window.location.search);
  var gid = params.get("g") || params.get("game");

  if (!gid) {
    view.innerHTML = "<div class='card'><div class='info'>Ask your moderator for a game link. It should look like <code>?g=uw-...</code></div></div>";
    return;
  }

  var g = await loadGameForPlayer(gid);
  if (!g) {
    view.innerHTML = "<div class='card'><div class='error'>❌ Game not found or ended. Ask moderator for a new link.</div></div>";
    return;
  }

  openBroadcast(gid);

  var pid = localStorage.getItem("uw-pid-" + gid);
  var players = await sbGetPlayers(gid);
  var me = null;
  if (pid) me = players.find ? players.find(function(p){return p.player_id===pid;}) : null;

  if (!me) {
    // Not joined — show name form
    view.innerHTML = "<div class='card'>" +
      "<h3>👤 Join the Game</h3>" +
      "<p style='color:#666;font-size:12px;margin-bottom:10px;'>" + players.length + "/" + g.count + " players joined.</p>" +
      "<input type='text' class='player-name-input' id='pname' placeholder='Enter your name' maxlength='24'>" +
      "<div><button class='action-btn primary big' id='joinBtn'>🎭 Join Game</button></div>" +
      "</div>";
    var jb = document.getElementById("joinBtn");
    var input = document.getElementById("pname");
    jb.onclick = function () { joinGame(gid); };
    input.onkeydown = function (e) { if (e.key === "Enter") jb.click(); };
    input.focus();
    // Poll: refresh join count while waiting
    setTimeout(function () { if (!localStorage.getItem("uw-pid-" + gid)) renderPlayer(); }, 4000);
    return;
  }

  // Show role
  var role = ROLES[me.role];
  if (!role) {
    view.innerHTML = "<div class='card'><div class='error'>Unknown role: " + me.role + "</div></div>";
    return;
  }
  var cardCls = "role-card-" + (role.t === "vampire" ? "vampire" : role.t);
  var teamLabel = role.t === "evil" ? "🔴 EVIL SIDE" :
                  role.t === "village" ? "🟢 VILLAGE SIDE" :
                  role.t === "vampire" ? "🩸 VAMPIRE" :
                  "🟣 NEUTRAL";

  var html = "<div class='role-card " + cardCls + "'>";
  html += "<div style='font-size:14px;opacity:0.9;'>👤 " + escapeHtml(me.name) + "</div>";
  html += "<div class='role-card-big-emoji'>" + role.e + "</div>";
  html += "<h2>" + role.n + "</h2>";
  html += "<div class='team-badge'>" + teamLabel + "</div>";
  html += "<div class='short-desc'>" + role.d + "</div>";
  html += "<div class='long-desc'>" + role.ld + "</div>";
  html += "<button class='action-btn' style='background:#fff;color:#333;margin-top:14px;' id='leaveBtn'>🚪 Leave Game</button>";
  html += "</div>";
  view.innerHTML = html;
  document.getElementById("leaveBtn").onclick = function () { leaveGameFromPlayer(gid); };
}

// ============================================================
// TAB SWITCHING
// ============================================================
function showTab(which) {
  document.getElementById("modBtn").classList.toggle("active", which === "mod");
  document.getElementById("playerBtn").classList.toggle("active", which === "player");
  document.getElementById("modTab").classList.toggle("active", which === "mod");
  document.getElementById("playerTab").classList.toggle("active", which === "player");
  if (which === "mod") renderMod();
  else renderPlayer();
}
function bindTabs() {
  var m = document.getElementById("modBtn");
  var p = document.getElementById("playerBtn");
  if (m) m.onclick = function () { showTab("mod"); };
  if (p) p.onclick = function () { showTab("player"); };
}

// ============================================================
// UTIL
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// ============================================================
// INIT
// ============================================================
function init() {
  try {
    bindTabs();
    var params = new URLSearchParams(window.location.search);
    var gid = params.get("g") || params.get("game");

    var currentId = localStorage.getItem("uw-current");
    if (currentId && !gid) {
      var saved = loadLocal(currentId);
      // Only resume as moderator if this device saved the game itself.
      // (Player devices set uw-current too, but never save the full game.)
      if (saved && saved.roles) {
        gameState = saved;
        isModerator = true;
        openBroadcast(currentId);
        startPolling();
        refreshFromServer();
        renderMod();
        return;
      }
    }

    if (gid) showTab("player");
    else showTab("mod");
  } catch (err) {
    console.error("init error:", err);
    var mv = document.getElementById("modView");
    if (mv) mv.innerHTML = "<div class='card'><div class='error'>Startup error: " + (err && err.message || err) + "</div></div>";
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
  </script>
