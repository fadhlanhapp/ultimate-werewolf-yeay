<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Werewolf - Online Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; font-size: 13px; color: #1a1a1a; background: #f5f5f0;
      display: flex; flex-direction: column; align-items: center; padding: 32px 20px; min-height: 100vh; }
    h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; text-align: center; }
    .subtitle { color: #666; font-style: italic; font-size: 12px; margin-bottom: 6px; text-align: center; }
    .note { font-size: 11px; color: #c0392b; background: #fdecea; border: 1px solid #e74c3c;
      border-radius: 4px; padding: 5px 14px; margin-bottom: 24px; text-align: center; }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab-btn { padding: 8px 16px; border: 2px solid #bbb; border-radius: 6px; background: #fff;
      cursor: pointer; font-family: Georgia, serif; font-size: 13px; font-weight: bold; }
    .tab-btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
    .tab-content { display: none; max-width: 560px; width: 100%; }
    .tab-content.active { display: block; }
    .input-section { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
    .input-label { font-size: 15px; font-weight: bold; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn { width: 44px; height: 44px; border: 2px solid #bbb; border-radius: 6px; background: #fff;
      font-size: 15px; font-family: Georgia, serif; font-weight: bold; cursor: pointer; color: #333; }
    .btn:hover { border-color: #555; background: #f0f0f0; }
    .btn.active { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
    .action-btn { padding: 8px 20px; margin-top: 8px; border: 2px solid #2b2b2b; border-radius: 6px;
      background: #fff; font-size: 13px; font-family: Georgia, serif; cursor: pointer; display: inline-block; }
    .action-btn:hover { background: #2b2b2b; color: #fff; }
    .action-btn-green { border-color: #27ae60; color: #27ae60; }
    .action-btn-green:hover { background: #27ae60; color: #fff; }
    #result { width: 100%; max-width: 560px; background: #fff; border: 1px solid #ddd;
      border-radius: 8px; padding: 22px 26px; display: none; }
    .result-title { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
    .result-sub { font-size: 11px; color: #888; margin-bottom: 16px; }
    .share-box { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin: 12px 0; }
    .share-label { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #666; margin-bottom: 6px; }
    .share-link { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px;
      font-size: 11px; word-break: break-all; font-family: monospace; margin-bottom: 6px; }
    .share-buttons { display: flex; gap: 6px; }
    .share-buttons button { padding: 4px 12px; font-size: 11px; border: 1px solid #ccc;
      border-radius: 4px; background: #fff; cursor: pointer; }
    .player-panel { max-width: 600px; width: 100%; text-align: center; }
    .role-display { background: #fff; border: 2px solid #ddd; border-radius: 8px;
      padding: 40px 30px; margin: 20px 0; font-size: 18px; }
    .role-name { font-size: 28px; font-weight: bold; margin: 20px 0; color: #2b2b2b; }
    .role-team-evil { color: #c0392b; }
    .role-team-village { color: #27ae60; }
    .role-team-neutral { color: #8e44ad; }
    .role-desc { font-size: 12px; color: #555; margin: 20px 0; line-height: 1.6; text-align: left;
      background: #f9f9f9; padding: 15px; border-radius: 4px; }
    .player-name-input { font-size: 16px; padding: 10px; border: 2px solid #ddd;
      border-radius: 4px; width: 100%; max-width: 300px; margin-bottom: 12px; }
    .players-list { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin: 12px 0; }
    .player-item { display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-bottom: 1px solid #e0e0e0; gap: 12px; }
    .player-item:last-child { border-bottom: none; }
    .player-info { flex: 1; text-align: left; }
    .player-name { font-weight: bold; }
    .player-role { font-size: 11px; color: #666; }
    .player-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: sans-serif; font-weight: bold; }
    .tag-evil { background: #fdecea; color: #c0392b; border: 1px solid #e74c3c; }
    .tag-village { background: #eafaf1; color: #27ae60; border: 1px solid #2ecc71; }
    .tag-neutral { background: #f5eef8; color: #8e44ad; border: 1px solid #9b59b6; }
    .role-row { display: flex; align-items: baseline; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px dotted #e0e0e0; gap: 8px; }
    .role-row:last-child { border-bottom: none; }
    .role-left { display: flex; align-items: baseline; gap: 7px; min-width: 155px; }
    .tag { font-size: 10px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; font-family: sans-serif; }
    .summary { margin-top: 16px; padding-top: 10px; border-top: 1px solid #ddd;
      display: flex; gap: 10px; justify-content: center; font-size: 11px; flex-wrap: wrap; }
    .summary span { padding: 3px 10px; border-radius: 12px; font-family: sans-serif; }
    .sum-evil { background: #fdecea; color: #c0392b; border: 1px solid #e74c3c; }
    .sum-village { background: #eafaf1; color: #27ae60; border: 1px solid #2ecc71; }
    .sum-neutral { background: #f5eef8; color: #8e44ad; border: 1px solid #9b59b6; }
  </style>
</head>
<body>
  <h1>Ultimate Werewolf</h1>
  <p class="subtitle">Digital Setup Generator - No Cards Needed!</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="mod">📋 Moderator Setup</button>
    <button class="tab-btn" data-tab="player">👤 Player Join</button>
  </div>

  <div id="mod" class="tab-content active">
    <p class="note">🎲 Generate a setup and share the link</p>
    <div class="input-section">
      <span class="input-label">Players (excluding you)?</span>
      <div class="btn-row" id="btnRow"></div>
    </div>
    <div id="result">
      <div class="result-title"></div>
      <div class="result-sub"></div>
      <div class="share-box" style="display:none" id="shareBox">
        <div class="share-label">📤 Share This Link:</div>
        <div class="share-link" id="shareLink"></div>
        <div class="share-buttons">
          <button onclick="copyLink()">Copy</button>
          <button onclick="shareLink()">Share</button>
        </div>
      </div>
      <div id="roleList"></div>
      <div id="summary" class="summary"></div>
      <div id="playerList"></div>
    </div>
  </div>

  <div id="player" class="tab-content player-panel">
    <p class="note">👤 Enter your name to see your role</p>
    <div id="playerView"></div>
  </div>

  <script>
var APP = {
  roles: {werewolf:{n:"Werewolf",t:"evil",d:"Kill at night"},seer:{n:"Seer",t:"village",d:"See roles at night"},hunter:{n:"Hunter",t:"village",d:"Shoot when dead"},bodyguard:{n:"Bodyguard",t:"village",d:"Protect at night"},witch:{n:"Witch",t:"village",d:"Save or eliminate"},mason:{n:"Mason",t:"village",d:"Know other Masons"},minion:{n:"Minion",t:"evil",d:"Knows werewolves"},alphawolf:{n:"Alpha Wolf",t:"evil",d:"Convert villager once"},wolfcub:{n:"Wolf Cub",t:"evil",d:"Double kill if dies"},prince:{n:"Prince",t:"village",d:"Vote cancel first time"},drunk:{n:"Drunk",t:"village",d:"Learn role day 3"},diseased:{n:"Diseased",t:"village",d:"Skip kill if eaten"},priest:{n:"Priest",t:"village",d:"Bless player"},huntress:{n:"Huntress",t:"village",d:"Shoot proactively"},toughguy:{n:"Tough Guy",t:"village",d:"Survive 1 night"},pi:{n:"PI",t:"village",d:"Check werewolf"},auraseer:{n:"Aura Seer",t:"village",d:"See alignment"},mentalist:{n:"Mentalist",t:"village",d:"Compare players"},revealer:{n:"Revealer",t:"village",d:"Flip card, then die"},appseer:{n:"Apprentice Seer",t:"village",d:"Become Seer"},spellcaster:{n:"Spellcaster",t:"village",d:"Silence player"},cupid:{n:"Cupid",t:"village",d:"Link lovers N1"},pacifist:{n:"Pacifist",t:"village",d:"Must vote daily"},mysticseer:{n:"Mystic Seer",t:"village",d:"See 2 players"},troublemaker:{n:"Troublemaker",t:"neutral",d:"Stir trouble"},sorceress:{n:"Sorceress",t:"evil",d:"Find Seer"},lycan:{n:"Lycan",t:"evil",d:"Appear as wolf"},doppelganger:{n:"Doppelganger",t:"neutral",d:"Copy role"},madbomber:{n:"Mad Bomber",t:"neutral",d:"Bomb adjacent"},curse:{n:"Curse",t:"neutral",d:"Become wolf if eaten"},cultleader:{n:"Cult Leader",t:"neutral",d:"Recruit nightly"}},
  pools:{6:{e:["werewolf"],v:["seer","hunter","bodyguard"]},7:{e:["werewolf","werewolf"],v:["seer","hunter","bodyguard"]},8:{e:["werewolf","wolfcub"],v:["seer","hunter","bodyguard","witch"]},9:{e:["werewolf","werewolf","minion"],v:["seer","hunter","bodyguard","mason","mason"]},10:{e:["werewolf","werewolf","minion"],v:["seer","hunter","bodyguard","witch","mason","mason"]},11:{e:["werewolf","werewolf","werewolf","minion"],v:["seer","hunter","bodyguard","witch","mason","mason"]},12:{e:["werewolf","werewolf","wolfcub","minion"],v:["seer","appseer","hunter","bodyguard","witch","mason","mason"]},13:{e:["werewolf","werewolf","werewolf","minion"],v:["seer","appseer","hunter","bodyguard","witch","mason","mason","priest"]},14:{e:["werewolf","werewolf","werewolf","alphawolf","minion"],v:["seer","appseer","hunter","bodyguard","witch","mason","mason"]}},
  gameState: null,
  
  init() {
    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', e => {
      document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      const tab = e.target.dataset.tab;
      document.getElementById(tab).classList.add('active');
      e.target.classList.add('active');
      if (tab === 'player') this.showPlayerView();
    }));
    
    for (let i = 6; i <= 14; i++) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = i;
      b.onclick = () => this.setupGame(i);
      document.getElementById('btnRow').appendChild(b);
    }
    
    const params = new URLSearchParams(window.location.search);
    if (params.get('game')) {
      setTimeout(() => {
        document.querySelector('[data-tab="player"]').click();
      }, 100);
    }
  },
  
  setupGame(count) {
    const pool = JSON.parse(JSON.stringify(this.pools[count]));
    this.gameState = { id: 'uw-' + Date.now(), count, players: {}, roles: pool.e.concat(pool.v) };
    this.showSetup(pool);
  },
  
  showSetup(pool) {
    const evil = pool.e.length, village = pool.v.length, total = evil + village;
    document.querySelector('#result .result-title').textContent = this.gameState.count + ' Players';
    document.querySelector('#result .result-sub').textContent = 'Setup complete';
    document.getElementById('result').style.display = 'block';
    
    let html = '<div class="summary">' +
      '<span class="sum-evil">Evil: ' + evil + '</span>' +
      '<span class="sum-village">Village: ' + village + '</span>' +
      '</div>';
    
    pool.e.concat(pool.v).forEach(rk => {
      const r = this.roles[rk];
      html += '<div class="role-row"><div class="role-left"><span class="tag tag-' + r.t + '">' + r.t.toUpperCase() + '</span><span class="role-name">' + r.n + '</span></div><span class="role-desc">' + r.d + '</span></div>';
    });
    
    document.getElementById('roleList').innerHTML = html;
    
    if (this.gameState) {
      localStorage.setItem('game-' + this.gameState.id, JSON.stringify(this.gameState));
      const url = window.location.origin + window.location.pathname + '?game=' + this.gameState.id;
      document.getElementById('shareLink').textContent = url;
      document.getElementById('shareBox').style.display = 'block';
      this.showPlayerList();
    }
  },
  
  showPlayerList() {
    const players = this.gameState.players;
    const html = Object.keys(players).length > 0 ?
      Object.entries(players).map(([k, p]) => {
        const r = this.roles[p.role];
        return '<div class="player-item"><div class="player-info"><div class="player-name">' + p.name + '</div><div class="player-role">' + r.n + '</div></div><span class="player-tag tag-' + r.t + '">' + r.t + '</span></div>';
      }).join('') :
      '<div style="padding:20px;text-align:center;color:#888;">Waiting for players...</div>';
    document.getElementById('playerList').innerHTML = '<h3 style="margin-top:20px;margin-bottom:12px;">Players (' + Object.keys(players).length + '/' + this.gameState.count + ')</h3><div class="players-list">' + html + '</div>';
  },
  
  showPlayerView() {
    const params = new URLSearchParams(window.location.search);
    const gid = params.get('game');
    if (!gid) {
      document.getElementById('playerView').innerHTML = '<p style="color:#888">Ask moderator for link</p>';
      return;
    }
    const gdata = localStorage.getItem('game-' + gid);
    if (!gdata) {
      document.getElementById('playerView').innerHTML = '<p style="color:#888">Game expired</p>';
      return;
    }
    const g = JSON.parse(gdata);
    const pid = localStorage.getItem('pid-' + gid);
    
    if (!pid) {
      document.getElementById('playerView').innerHTML = 
        '<input type="text" class="player-name-input" id="pname" placeholder="Your name">' +
        '<button class="action-btn action-btn-green" onclick="APP.joinGame(\'' + gid + '\')">Join</button>';
    } else {
      const p = g.players[pid];
      const r = this.roles[p.role];
      document.getElementById('playerView').innerHTML = 
        '<div class="role-display">' +
        '<div style="font-size:14px;margin-bottom:12px;">Player: <strong>' + p.name + '</strong></div>' +
        '<div class="role-name role-team-' + r.t + '">' + r.n + '</div>' +
        '<div class="role-desc">' + r.d + '</div>' +
        '<button class="action-btn" onclick="APP.leaveGame(\'' + gid + '\')">Leave</button>' +
        '</div>';
    }
  },
  
  joinGame(gid) {
    const name = document.getElementById('pname').value.trim();
    if (!name) { alert('Enter name'); return; }
    const gdata = localStorage.getItem('game-' + gid);
    const g = JSON.parse(gdata);
    const pid = 'p' + Date.now();
    const rndx = Math.floor(Math.random() * g.roles.length);
    g.players[pid] = { name, role: g.roles[rndx] };
    localStorage.setItem('game-' + gid, JSON.stringify(g));
    localStorage.setItem('pid-' + gid, pid);
    this.showPlayerView();
    if (this.gameState && this.gameState.id === gid) this.showPlayerList();
  },
  
  leaveGame(gid) {
    localStorage.removeItem('pid-' + gid);
    this.showPlayerView();
  }
};

function copyLink() {
  const link = document.getElementById('shareLink').textContent;
  navigator.clipboard.writeText(link).then(() => alert('Copied!'));
}

function shareLink() {
  const link = document.getElementById('shareLink').textContent;
  if (navigator.share) navigator.share({ title: 'Ultimate Werewolf', url: link });
  else alert('Copy manually');
}

document.addEventListener('DOMContentLoaded', () => APP.init());
  </script>
</body>
</html>
