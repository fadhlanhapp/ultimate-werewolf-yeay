}

function cancelRoleChange() {
  if (!gameState) return;
  gameState.changing = null;
  saveLocal();
  hideSwapModal();
}
async function applyRoleChange() {
  if (!gameState || !gameState.changing || !gameState.changing.selectedKey) return;
  var ch = gameState.changing;
  var oldKey = ch.sourceKey;
  var newKey = ch.selectedKey;
  if (oldKey === newKey) { cancelRoleChange(); return; }

  // Update displayRoles at the specific index
  gameState.displayRoles[ch.index] = newKey;

  // Update the first matching occurrence in the shuffled assignment list
  var rIdx = gameState.roles.indexOf(oldKey);
  if (rIdx !== -1) gameState.roles[rIdx] = newKey;

  // Recompute team counts and balance
  var evilCount = 0, villageCount = 0, neutralCount = 0;
  for (var i = 0; i < gameState.roles.length; i++) {
    var t = ROLES[gameState.roles[i]].t;
    if (t === "evil" || t === "vampire") evilCount++;
    else if (t === "village") villageCount++;
    else neutralCount++;
  }
  gameState.evil = evilCount;
  gameState.village = villageCount;
  gameState.neutral = neutralCount;
  gameState.balance = calcBalance(gameState.roles);
  gameState.balanceOk = gameState.balance >= MIN_BALANCE && gameState.balance <= MAX_BALANCE;
  gameState.changing = null;
  hideSwapModal();
  saveLocal();

  // Push the new pool to Supabase so future joiners see the updated roles
  await sbInsertGame(gameState).catch(function () {});

  // Reassign already-joined players positionally by join order
  var players = await sbGetPlayers(gameState.id);
  var pool = gameState.roles.slice();
  for (var i = 0; i < players.length && pool.length > 0; i++) {
    var assignedRole = pool.shift();
    if (players[i].role !== assignedRole) {
      await sbUpdatePlayerRole(players[i].id, assignedRole);
    }
  }

  await refreshFromServer();
  broadcast({type: "roles-changed"});
  renderMod();
}

function renderModPlay() {
  var g = gameState;
  var alive = 0, aliveEvil = 0, aliveVillage = 0, aliveNeutral = 0;
  for (var pid in g.players) {
    var p = g.players[pid];
    if (!p.dead) {
      alive++;
      var t = ROLES[p.role].t;
      if (t === "evil" || t === "vampire") aliveEvil++;
      else if (t === "village") aliveVillage++;
      else aliveNeutral++;
    }
  }

  var html = "";
  var phaseClass = g.phase === "night" ? "phase-night" : "phase-day";
  var phaseIcon = g.phase === "night" ? "🌙" : "☀️";
  var phaseText = g.phase === "night" ? "NIGHT PHASE" : "DAY PHASE";
  html += "<div class='phase-banner " + phaseClass + "'>" + phaseIcon + " " + phaseText + "<span class='day-counter'>Day " + g.day + "</span></div>";

  // Win checker
  var winMsg = checkWinCondition(aliveEvil, aliveVillage, aliveNeutral, alive);
  if (winMsg) {
    html += "<div class='card'><div class='win-check " + winMsg.team + "'><strong>" + winMsg.title + "</strong><br>" + winMsg.text + "</div></div>";
  }

  html += "<div class='card'>";
  html += "<h3>Players (" + alive + " alive)</h3>";
  html += "<div class='summary' style='margin-top:8px;'>";
  html += "<span class='tag tag-evil'>Evil alive: " + aliveEvil + "</span>";
  html += "<span class='tag tag-village'>Village alive: " + aliveVillage + "</span>";
  if (aliveNeutral > 0) html += "<span class='tag tag-neutral'>Neutral alive: " + aliveNeutral + "</span>";
  html += "</div>";

  html += "<div class='players-grid'>";
  for (var pid in g.players) {
    var p = g.players[pid];
    var r = ROLES[p.role];
    var tip = r.n + " — " + r.d + "\n\n" + r.ld;
    html += "<div class='player-tile" + (p.dead ? " dead" : "") + "' title=\"" + escapeHtml(tip) + "\">";
    html += "<div class='player-tile-emoji'>" + r.e + "</div>";
    html += "<div style='flex:1;min-width:0;'>";
    html += "<div class='player-tile-name'>" + escapeHtml(p.name) + "</div>";
    html += "<div class='player-tile-role'><span class='tag tag-" + r.t + "'>" + r.t.substr(0,3).toUpperCase() + "</span>" + r.n + "</div>";
    html += "<div style='font-size:10px;color:#666;margin-top:4px;line-height:1.4;'>" + r.d + "</div>";
    html += "</div>";
    html += "<button class='" + (p.dead ? "player-tile-revive" : "player-tile-kill") + "' data-pid='" + pid + "'>" + (p.dead ? "revive" : "kill") + "</button>";
    html += "</div>";
  }
  html += "</div>";
  html += "</div>";

  // Night walker
  if (g.phase === "night") {
    // Build list of night roles WITH the player who has each. Skip dead players.
    // Include a dedicated "Everyone close eyes" step at start and "Everyone open eyes" at end.
    var nightRoles = [];
    for (var i = 0; i < g.roles.length; i++) {
      var r = ROLES[g.roles[i]];
      if (r.no >= 99) continue;
      // Find living player who has this role
      var holder = null;
      for (var pid2 in g.players) {
        if (g.players[pid2].role === g.roles[i] && !g.players[pid2].dead) { holder = g.players[pid2]; break; }
      }
      // Skip if role isn't held by any living player
      if (!holder) continue;
      // Skip alpha wolf convert step on night 2+ (only relevant once, mod tracks manually)
      if (r.no === 2 && g.day > 1) continue;
      // Skip Cupid on night 2+ (lovers linked on night 1 only)
      if (nr_isNight1Only(g.roles[i]) && g.day > 1) continue;
      nightRoles.push({key: g.roles[i], no: r.no, role: r, holder: holder});
    }
    nightRoles.sort(function (a, b) { return a.no - b.no; });

    html += "<div class='card'>";
    html += "<h3>🌙 Night Walker — Day " + g.day + "</h3>";
    html += "<p style='font-size:12px;color:#666;margin-bottom:10px;'>Call each role in order. Speak the wake instruction; tap ▶ Next when they've acted. Dead players are skipped automatically.</p>";
    var step = g.nightStep || 0;

    html += "<div class='night-order'>";
    // Opening step
    var openCls = "night-step" + (step === 0 ? " current" : (step > 0 ? " done" : ""));
    html += "<div class='" + openCls + "'>";
    html += "<strong>🌑 Everyone close your eyes</strong> — Wait until every player is quiet, heads down.";
    html += "</div>";

    for (var i = 0; i < nightRoles.length; i++) {
      var nr = nightRoles[i];
      var stepIdx = i + 1;
      var cls = "night-step";
      if (stepIdx < step) cls += " done";
      else if (stepIdx === step) cls += " current";
      var wakeText = NIGHT_ACTIONS[nr.no] || nr.role.d;
      html += "<div class='" + cls + "'>";
      html += "<div><strong>" + nr.role.e + " " + nr.role.n + "</strong> — <em>" + escapeHtml(nr.holder.name) + "</em></div>";
      html += "<div style='font-size:12px;color:#333;margin-top:6px;font-weight:bold;'>📢 " + wakeText + ".</div>";
      html += "<div style='font-size:11px;color:#666;margin-top:4px;'>" + nr.role.d + "</div>";
      html += "</div>";
    }

    // Closing step
    var closeIdx = nightRoles.length + 1;
    var closeCls = "night-step";
    if (step > closeIdx) closeCls += " done";
    else if (step === closeIdx) closeCls += " current";
    html += "<div class='" + closeCls + "'>";
    html += "<strong>🌅 Everyone open your eyes</strong> — Announce any night deaths, then move to Day.";
    html += "</div>";
    html += "</div>";
    html += "<div style='margin-top:12px;'>";
    html += "<button class='action-btn primary' id='nextStep'>▶ Next Role</button>";
    html += "<button class='action-btn' id='resetStep'>↻ Reset</button>";
    html += "<button class='action-btn warn' id='toDay'>☀️ End Night → Day</button>";
    html += "</div>";
    html += "</div>";
  } else {
    html += "<div class='card'>";
    html += "<h3>☀️ Day Phase</h3>";
    html += "<p style='color:#555;font-size:13px;'>Village debates, accuses, and votes. Use the <em>kill</em> button above to mark the lynched player. Then advance to night.</p>";
    html += "<div style='margin-top:12px;'>";
    html += "<button class='action-btn primary' id='toNight'>🌙 End Day → Night " + (g.day + 1) + "</button>";
    html += "</div>";
    html += "</div>";
  }

  html += "<div class='card'>";
  html += "<button class='action-btn danger' id='endBtn'>✕ End Game</button>";
  html += "</div>";
  return html;
}
function attachModPlayHandlers() {
  var btn;
  document.querySelectorAll(".player-tile-kill, .player-tile-revive").forEach(function (b) {
    b.onclick = function () { togglePlayerDead(b.getAttribute("data-pid")); };
  });
  if (btn = document.getElementById("toggleReveal")) btn.onclick = toggleReveal;
  if (btn = document.getElementById("nextStep")) btn.onclick = advanceNightStep;
  if (btn = document.getElementById("resetStep")) btn.onclick = resetNightStep;
  if (btn = document.getElementById("toDay")) btn.onclick = nextPhase;
  if (btn = document.getElementById("toNight")) btn.onclick = nextPhase;
  if (btn = document.getElementById("endBtn")) btn.onclick = endGame;
}

// Roles that only wake on night 1 (subsequent nights, skip them).
var NIGHT1_ONLY = {cupid:1, doppelganger:1, beholder:1, mason:1, twoSisters:1, threebrothers:1, count:1, nostradamus:1, direwolf:1, wildchild:1, renfield:1, apprenticeTanner:1};
function nr_isNight1Only(key) { return !!NIGHT1_ONLY[key]; }

function checkWinCondition(evil, village, neutral, total) {
  if (total === 0) return {team: "neutral", title: "Everyone is dead", text: "Game over — no winners."};
  if (evil === 0) return {team: "", title: "🎉 Village wins!", text: "All evil players have been eliminated."};
  if (village === 0 && neutral === 0) return {team: "evil", title: "🐺 Evil wins!", text: "The village has fallen."};
  if (evil >= village + neutral) return {team: "evil", title: "🐺 Evil dominates!", text: "Evil equals/outnumbers everyone else. Village cannot win."};
  return null;
}

// ============================================================
// PLAYER VIEW RENDERING
// ============================================================
async function renderPlayer(noFlash) {
  var view = document.getElementById("playerView");
  // Only show loading spinner on cold entry — not on silent poll-triggered re-renders.
  if (!noFlash) {
    view.innerHTML = "<div class='card'><div class='lobby-status'><span class='waiting-dots'>Loading</span></div></div>";
  }

  var params = new URLSearchParams(window.location.search);
  var gid = params.get("g") || params.get("game");

  if (!gid) {
    view.innerHTML = "<div class='card'><div class='info'>Ask your moderator for a game link. It should look like <code>?g=uw-...</code></div></div>";
    return;
  }

  var g = await loadGameForPlayer(gid);
  if (!g) {
    view.innerHTML = "<div class='card'><div class='error'>❌ Game not found or ended. Ask moderator for a new link.</div></div>";
    return;
  }

  openBroadcast(gid);

  var pid = localStorage.getItem("uw-pid-" + gid);
  var players = await sbGetPlayers(gid);
  var me = null;
  if (pid) me = players.find ? players.find(function(p){return p.player_id===pid;}) : null;

  if (!me) {
    // Not joined — show name form
    view.innerHTML = "<div class='card'>" +
      "<h3>👤 Join the Game</h3>" +
      "<p style='color:#666;font-size:12px;margin-bottom:10px;' id='joinCountDisplay'>" + players.length + "/" + g.count + " players joined.</p>" +
      "<input type='text' class='player-name-input' id='pname' placeholder='Enter your name' maxlength='24'>" +
      "<div><button class='action-btn primary big' id='joinBtn'>🎭 Join Game</button></div>" +
      "</div>";
    var jb = document.getElementById("joinBtn");
    var input = document.getElementById("pname");
    jb.onclick = function () { joinGame(gid); };
    input.onkeydown = function (e) { if (e.key === "Enter") jb.click(); };
    input.focus();
    // Lightweight poll: only update the join count — no page re-render, no Loading flash.
    if (playerPollTimer) clearTimeout(playerPollTimer);
    playerPollTimer = setTimeout(async function pollJoinCount() {
      if (localStorage.getItem("uw-pid-" + gid)) return; // already joined — stop
      var pp = await sbGetPlayers(gid);
      var el = document.getElementById("joinCountDisplay");
      if (el && pp && pp.length !== undefined) el.textContent = pp.length + "/" + g.count + " players joined.";
      if (!localStorage.getItem("uw-pid-" + gid)) playerPollTimer = setTimeout(pollJoinCount, 4000);
    }, 4000);
    return;
  }

  // Show role
  var role = ROLES[me.role];
  if (!role) {
    view.innerHTML = "<div class='card'><div class='error'>Unknown role: " + me.role + "</div></div>";
    return;
  }
  var cardCls = "role-card-" + (role.t === "vampire" ? "vampire" : role.t);
  var teamLabel = role.t === "evil" ? "🔴 EVIL SIDE" :
                  role.t === "village" ? "🟢 VILLAGE SIDE" :
                  role.t === "vampire" ? "🩸 VAMPIRE" :
                  "🟣 NEUTRAL";

  var html = "<div class='role-card " + cardCls + "'>";
  html += "<div style='font-size:14px;opacity:0.9;'>👤 " + escapeHtml(me.name) + "</div>";
  html += "<div class='role-card-big-emoji'>" + role.e + "</div>";
  html += "<h2>" + role.n + "</h2>";
  html += "<div class='team-badge'>" + teamLabel + "</div>";
  html += "<div class='short-desc'>" + role.d + "</div>";
  html += "<div class='long-desc'>" + role.ld + "</div>";
  html += "<button class='action-btn' style='background:#fff;color:#333;margin-top:14px;' id='leaveBtn'>🚪 Leave Game</button>";
  html += "</div>";

  // Full list of roles in play — grouped by team, so players know what's possible.
  html += renderRolesInPlay(g.roles);

  view.innerHTML = html;
  document.getElementById("leaveBtn").onclick = function () { leaveGameFromPlayer(gid); };
  // Attach expand/collapse handlers for role entries
  document.querySelectorAll(".rip-entry").forEach(function (el) {
    el.onclick = function () { el.classList.toggle("open"); };
  });

  // Poll every 5s so a moderator reroll updates the player's card automatically.
  if (playerPollTimer) clearTimeout(playerPollTimer);
  var pollMisses = 0;
  playerPollTimer = setTimeout(async function checkForChanges() {
    // Skip if player tab is not active (user switched to Moderator tab).
    var playerTab = document.getElementById("playerTab");
    if (playerTab && !playerTab.classList.contains("active")) {
      playerPollTimer = setTimeout(checkForChanges, 5000);
      return;
    }

    var latest = await sbGetPlayers(gid);

    // Empty response: could be a transient network error.
    // Require 3 consecutive empty polls before treating it as a genuine kick.
    if (!latest || latest.length === 0) {
      pollMisses++;
      if (pollMisses < 3) {
        playerPollTimer = setTimeout(checkForChanges, 5000);
        return;
      }
      // 3 misses in a row — game likely ended.
      localStorage.removeItem("uw-pid-" + gid);
      renderPlayer();
      return;
    }
    pollMisses = 0; // reset on successful response

    var latestMe = latest.find(function(p){return p.player_id===pid;});
    if (!latestMe) {
      // Server has players but this player isn't among them — legitimately removed.
      localStorage.removeItem("uw-pid-" + gid);
      renderPlayer();
      return;
    }
    if (latestMe.role !== me.role) {
      renderPlayer(true);  // role changed — re-render without Loading flash
      return;
    }
    // No change — schedule next check without re-rendering.
    playerPollTimer = setTimeout(checkForChanges, 5000);
  }, 5000);
}
var playerPollTimer = null;

// Render a grouped, collapsible list of all roles in this game (spoiler-free about who has what).
function renderRolesInPlay(roles) {
  var groups = {evil: [], village: [], vampire: [], neutral: []};
  var counts = {};
  for (var i = 0; i < roles.length; i++) counts[roles[i]] = (counts[roles[i]] || 0) + 1;
  var seen = {};
  for (var i = 0; i < roles.length; i++) {
    var k = roles[i];
    if (seen[k]) continue;
    seen[k] = 1;
    var r = ROLES[k]; if (!r) continue;
    (groups[r.t] || groups.neutral).push({key: k, role: r, count: counts[k]});
  }

  var teamOrder = [
    {key: "village", label: "🟢 Village", cls: "village"},
    {key: "evil",    label: "🔴 Evil",    cls: "evil"},
    {key: "vampire", label: "🩸 Vampire", cls: "vampire"},
    {key: "neutral", label: "🟣 Neutral", cls: "neutral"}
  ];

  var html = "<div class='card' style='margin-top:16px;'>";
  html += "<h3 style='margin-bottom:6px;'>🎭 Roles in this game (" + roles.length + " total)</h3>";
  html += "<p style='font-size:12px;color:#666;margin-bottom:12px;'>Every role that was dealt. You don't know who has what — tap any card to read the full strategy.</p>";

  for (var t = 0; t < teamOrder.length; t++) {
    var team = teamOrder[t];
    var list = groups[team.key];
    if (!list || list.length === 0) continue;
    html += "<h4 style='margin:14px 0 8px;color:#333;'>" + team.label + " <span style='color:#888;font-weight:normal;font-size:12px;'>(" + list.length + ")</span></h4>";
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var badge = e.count > 1 ? " <span style='background:#333;color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:6px;'>×" + e.count + "</span>" : "";
      html += "<div class='rip-entry rip-" + team.cls + "'>";
      html += "<div class='rip-head'>";
      html += "<span class='rip-emoji'>" + e.role.e + "</span>";
      html += "<div style='flex:1;'>";
      html += "<div class='rip-name'>" + e.role.n + badge + "</div>";
      html += "<div class='rip-short'>" + e.role.d + "</div>";
      html += "<div class='rip-hint'>tap for full strategy ▾</div>";
      html += "</div>";
      html += "<span class='rip-caret'>▾</span>";
      html += "</div>";
      html += "<div class='rip-long'>" + e.role.ld + "</div>";
      html += "</div>";
    }
  }
  html += "</div>";
  return html;
}

// ============================================================
// TAB SWITCHING
// ============================================================
function showTab(which) {
  document.getElementById("modBtn").classList.toggle("active", which === "mod");
  document.getElementById("playerBtn").classList.toggle("active", which === "player");
  document.getElementById("modTab").classList.toggle("active", which === "mod");
  document.getElementById("playerTab").classList.toggle("active", which === "player");
  if (which === "mod") renderMod();
  else renderPlayer();
}
function bindTabs() {
  var m = document.getElementById("modBtn");
  var p = document.getElementById("playerBtn");
  if (m) m.onclick = function () { showTab("mod"); };
  if (p) p.onclick = function () { showTab("player"); };
}

// ============================================================
// UTIL
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// ============================================================
// INIT
// ============================================================
function init() {
  try {
    bindTabs();
    var params = new URLSearchParams(window.location.search);
    var gid = params.get("g") || params.get("game");

    var currentId = localStorage.getItem("uw-current");
    if (currentId && !gid) {
      var saved = loadLocal(currentId);
      // Only resume as moderator if this device saved the game itself.
      // (Player devices set uw-current too, but never save the full game.)
      if (saved && saved.roles) {
        gameState = saved;
        isModerator = true;
        openBroadcast(currentId);
        startPolling();
        refreshFromServer();
        renderMod();
        return;
      }
    }

    if (gid) showTab("player");
    else showTab("mod");
  } catch (err) {
    console.error("init error:", err);
    var mv = document.getElementById("modView");
    if (mv) mv.innerHTML = "<div class='card'><div class='error'>Startup error: " + (err && err.message || err) + "</div></div>";
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
  </script>
